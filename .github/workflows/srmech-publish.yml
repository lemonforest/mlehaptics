name: srmech-publish

# Build the pure-Python py3-none-any wheel + sdist for the ``srmech``
# package and publish to PyPI / TestPyPI via OIDC trusted publishing.
#
# srmech is currently pure-Python (no native binary). Phase B of the
# srmech build-out (Task #201, pending) introduces C/Python parity via
# scikit-build-core + CMake mirroring ephemerides-spectral's pattern;
# at that point the workflow gains a build-wheels (cibuildwheel)
# matrix and a build-pure-wheel (hatchling fallback) job to mirror
# ephemerides-spectral-publish.yml's three-job shape. For now, single
# ``build`` job ships the py3-none-any wheel + sdist.
#
# RC-version auto-routing (added Task #200 Phase A — 2026-05-13):
#   * Tag ``srmech-vX.Y.ZrcN``  → TestPyPI (testpypi environment)
#   * Tag ``srmech-vX.Y.Z``      → PyPI    (pypi environment)
# The tag suffix is the source of truth. TestPyPI releases happen
# autonomously on rc-tagged pushes; PyPI releases happen on clean-
# version pushes (which are human-in-loop because tagging a non-rc
# version is itself the gate).
#
# Triggers:
#   * ``push`` on ``srmech-v*`` tags — auto-routes per rc-suffix
#     (see above). Tags pushed by the autotag workflow's GITHUB_TOKEN
#     do NOT trigger this event (GitHub's anti-recursion guard).
#   * ``workflow_dispatch`` — manual fallback. Pick the tag in the
#     Ref dropdown and choose target (testpypi / pypi) to override
#     the auto-routing rule.
#
# Trusted publisher configuration (one-time, done by a human):
#   pypi.org      project=srmech, environment=pypi
#   test.pypi.org project=srmech, environment=testpypi

on:
  push:
    tags:
      - "srmech-v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target (override rc-auto-route)"
        required: true
        type: choice
        options: [testpypi, pypi]
        default: testpypi

# Default token permissions: read-only. The build job only needs to
# read the repo and upload artifacts (no contents:write needed).
# The publish job overrides this to add id-token:write for PyPI
# trusted publishing — see its job-level `permissions:` block.
permissions:
  contents: read

jobs:
  build:
    name: build (sdist + py3-none-any wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build hatchling twine

      - name: Build wheel + sdist
        working-directory: docs/srmech/python
        run: |
          set -euo pipefail
          python -m build
          ls -la dist/
          # Sanity: ensure the wheel has 'py3-none-any' tag.
          if ! ls dist/srmech-*-py3-none-any.whl 1>/dev/null 2>&1; then
            echo "::error::expected a py3-none-any wheel, did not find one"
            exit 1
          fi
          # Sanity: ensure no native binaries leaked (srmech is pure-
          # Python until Task #201 Phase B introduces the C side).
          if python -m zipfile -l dist/*-py3-none-any.whl \
              | grep -E '\.(so|dll|dylib|exe)$'; then
            echo "::error::native binaries leaked into pure wheel"
            exit 1
          fi
          # Twine metadata check (strict).
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: docs/srmech/python/dist/*

  publish:
    name: >-
      publish
      (${{
        (github.event_name == 'workflow_dispatch' && inputs.target)
        || (contains(github.ref_name, 'rc') && 'testpypi')
        || 'pypi'
      }})
    needs: [build]
    runs-on: ubuntu-latest
    # Publish only on tag-push or workflow_dispatch; never on PR /
    # branch dispatches.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/srmech-v'))
    environment:
      # rc-version auto-routing: tag ending in rcN goes to testpypi;
      # plain semver tag goes to pypi. workflow_dispatch overrides
      # via `inputs.target`.
      name: >-
        ${{
          (github.event_name == 'workflow_dispatch' && inputs.target)
          || (contains(github.ref_name, 'rc') && 'testpypi')
          || 'pypi'
        }}
      url: >-
        ${{
          ((github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi')
           || (github.event_name == 'push' && contains(github.ref_name, 'rc')))
            && 'https://test.pypi.org/project/srmech/'
            || 'https://pypi.org/project/srmech/'
        }}
    permissions:
      id-token: write  # OIDC token for PyPI trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Verify tag matches pyproject version (tag-push only)
        if: github.event_name == 'push'
        shell: bash
        run: |
          python3 <<'PY'
          import os, re, sys
          try:
              import tomllib
          except ImportError:
              import tomli as tomllib  # type: ignore[no-redef]
          tag = os.environ["GITHUB_REF_NAME"]  # e.g. "srmech-v0.1.1rc1"
          # Allow rcN suffix (TestPyPI auto-route trigger). Matches
          # PEP 440 pre-release form: X.Y.ZrcN, no separator before rc.
          m = re.fullmatch(r"srmech-v(\d+\.\d+\.\d+(?:rc\d+)?)", tag)
          if not m:
              print(f"::error::Tag {tag!r} does not match srmech-vX.Y.Z[rcN]")
              sys.exit(1)
          tag_version = m.group(1)
          with open("docs/srmech/python/pyproject.toml", "rb") as f:
              pyproject_version = tomllib.load(f)["project"]["version"]
          if tag_version != pyproject_version:
              print(
                  f"::error::Tag version {tag_version!r} != pyproject version "
                  f"{pyproject_version!r}; refusing to publish."
              )
              sys.exit(1)
          # Cross-check the auto-routing rule. If the tag has rc, this
          # publish should hit TestPyPI; if not, PyPI. Surface this as
          # a log line so the run page makes the routing obvious.
          if "rc" in tag_version:
              print(f"Tag {tag_version!r} is an rc release → TestPyPI")
          else:
              print(f"Tag {tag_version!r} is a clean release → PyPI")
          print(f"Tag and pyproject agree: {tag_version}")
          PY

      - name: List artefacts before publish
        run: ls -la dist/

      - name: Publish to TestPyPI
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi')
          || (github.event_name == 'push' && contains(github.ref_name, 'rc'))
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist

      - name: Publish to PyPI
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
          || (github.event_name == 'push' && !contains(github.ref_name, 'rc'))
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
