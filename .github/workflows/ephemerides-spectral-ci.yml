name: ephemerides-spectral-ci

# Per-PR build + test for the ephemerides-spectral package. Mirrors
# chess-spectral-ci.yml: a small always-on matrix (4 cells) that
# catches regressions on the default PR path, plus a label-gated
# 15-cell wheel matrix that mirrors the publish workflow for the
# changes that actually warrant it (pyproject.toml, encoder layout,
# C tree edits).
#
# Triggers: pull_request changes under
# docs/antikythera-maths/ephemerides-spectral/** OR the shared
# research/ tree (codegen mirrors several modules from there) OR a
# manual workflow_dispatch.

on:
  push:
    branches: [main]
    paths:
      - "docs/antikythera-maths/ephemerides-spectral/**"
      - "docs/antikythera-maths/research/**"
      - ".github/workflows/ephemerides-spectral-ci.yml"
  pull_request:
    # Default types are [opened, synchronize, reopened]. Add `labeled`
    # so applying the `wheel-check` label re-triggers the workflow —
    # the verify-wheels / verify-build-artefacts jobs gate on
    # `contains(labels, 'wheel-check')`, evaluated at run-start time.
    # Without `labeled` here, applying the label after PR open would
    # leave those jobs skipped until a new commit lands.
    types: [opened, synchronize, reopened, labeled]
    branches: [main]
    paths:
      - "docs/antikythera-maths/ephemerides-spectral/**"
      - "docs/antikythera-maths/research/**"
      - ".github/workflows/ephemerides-spectral-ci.yml"
  workflow_dispatch: {}

# Default token permissions: read-only on the repo contents. None of
# the jobs here writes to the repo (no commits, no releases, no
# comments) — all artifacts are uploaded via actions/upload-artifact,
# which doesn't need write permissions on `contents`.
permissions:
  contents: read

# Cancel any older run for the same ref when a newer event fires.
# Without this, opening a PR with `--label wheel-check` triggers BOTH
# a `pull_request:opened` event AND a `pull_request:labeled` event,
# each starting its own workflow run — the older `opened` run wastes
# minutes computing the same matrix the `labeled` run will produce.
# Same protection covers the `synchronize` (push to PR) case.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Diagnostic: emit `github.event.action` + label state at workflow
  # start so we can see which event-action survives vs gets cancelled
  # when `gh pr create --label wheel-check` fires both `opened` and
  # `labeled` events. Once we have a couple of PRs of data we'll know
  # whether to drop one trigger type or guard with a job-level `if`.
  # Cost: ~1 second per run; runs as a separate job so it isn't tied
  # to the matrix's success/failure.
  trigger-diagnostic:
    name: trigger-diagnostic (event=${{ github.event.action }})
    runs-on: ubuntu-latest
    steps:
      - name: Log triggering event metadata
        run: |
          echo "github.event_name = ${{ github.event_name }}"
          echo "github.event.action = ${{ github.event.action }}"
          echo "github.run_id = ${{ github.run_id }}"
          echo "github.run_attempt = ${{ github.run_attempt }}"
          echo "labels at fire time:"
          echo '${{ toJson(github.event.pull_request.labels.*.name) }}'
          echo "concurrency_group = ${{ github.workflow }}-${{ github.ref }}"

  build-and-test:
    # 4 cells, always-on. Mirrors chess-spectral's pre-PR shape:
    # one Python (3.12) across the three target OSes plus a
    # min-supported-Python (3.10) cell on Linux to catch tomllib /
    # syntax / typing regressions that only show up on the floor.
    name: ${{ matrix.os }} • py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  python: "3.12" }
          - { os: macos-14,       python: "3.12" }
          - { os: windows-latest, python: "3.12" }
          - { os: ubuntu-latest,  python: "3.10" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install package + dev tools
        working-directory: docs/antikythera-maths/ephemerides-spectral/python
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ephemeris,tests]"
          # tomllib is stdlib on 3.11+; codegen + version-agreement
          # tests use tomli on 3.10.
          python -m pip install 'tomli; python_version < "3.11"'

      - name: Run tests
        working-directory: docs/antikythera-maths/ephemerides-spectral/python
        shell: bash
        run: pytest tests/ -q

  codegen-determinism:
    # Lightweight always-on guard. Re-run codegen and assert the
    # _research/ mirrors are byte-identical. Catches the latent-drift
    # class of bug we hit in PR #171 on antikythera-spectral.
    #
    # Exclusions (all in _data/):
    #   * manifest.json — version field is tied to the in-progress
    #     commit SHA; per-file SHA-256 sums INSIDE it still give the
    #     integrity guarantee we want.
    #   * initial_phases.json (v0.5.2+) — depends on auxiliary moon
    #     kernels (mar099s / jup365 / sat441, ~1.5 GB combined)
    #     which CI doesn't stage. Without them the codegen falls
    #     back to the period-based stub for moons; with them it uses
    #     real ephemeris truth. CI-side codegen produces a different
    #     hash than the dev-side one. The CHECKED-IN copy is the
    #     authoritative one (built on the dev box with all kernels);
    #     the test_data_freshness pytest enforces SHA agreement at
    #     wheel install time.
    name: codegen reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install editable
        working-directory: docs/antikythera-maths/ephemerides-spectral/python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ephemeris,tests]"
      - name: Snapshot _data + _research SHA-256
        working-directory: docs/antikythera-maths/ephemerides-spectral
        run: |
          find python/ephemerides_spectral/_data python/ephemerides_spectral/_research \
            -type f \
            -not -name manifest.json \
            -not -name initial_phases.json \
            -exec sha256sum {} \; | sort > /tmp/before.sha256
      - name: Re-run codegen
        working-directory: docs/antikythera-maths/ephemerides-spectral/codegen
        run: python regenerate.py
      - name: Verify byte-identical output
        working-directory: docs/antikythera-maths/ephemerides-spectral
        run: |
          find python/ephemerides_spectral/_data python/ephemerides_spectral/_research \
            -type f \
            -not -name manifest.json \
            -not -name initial_phases.json \
            -exec sha256sum {} \; | sort > /tmp/after.sha256
          diff /tmp/before.sha256 /tmp/after.sha256

  fallback-test:
    # Pyodide / WASM / sdist-on-no-toolchain path. The package falls
    # back to the pure-Python BIP encoder when the bundled native
    # library can't load. We verify HAS_NATIVE=False is set (because
    # we never built the C library here) and that the pure-Python
    # path still encodes correctly.
    name: fallback (pure-Python, no native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime deps only (no editable install)
        # Skip `pip install -e .` so scikit-build-core never invokes
        # CMake — _native/ ends up empty and the loader has to fall
        # back. We add the source tree to sys.path explicitly in the
        # smoke-test step.
        run: python -m pip install --upgrade pip pytest numpy skyfield jplephem

      - name: Verify HAS_NATIVE=False without a build
        working-directory: docs/antikythera-maths/ephemerides-spectral/python
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/docs/antikythera-maths/ephemerides-spectral/python
        run: |
          python -c "
          from ephemerides_spectral import _native_bip
          assert _native_bip.HAS_NATIVE is False, (
              f'expected HAS_NATIVE=False without a build, got True. '
              f'A stale _native/ directory may be polluting the load '
              f'path; check _find_library.'
          )
          assert _native_bip.LOAD_ERROR, 'LOAD_ERROR should explain why native unavailable'
          print(f'OK: HAS_NATIVE=False; LOAD_ERROR={_native_bip.LOAD_ERROR!r}')
          "

      - name: Run pure-Python BIP encode + parity-shape tests
        working-directory: docs/antikythera-maths/ephemerides-spectral/python
        shell: bash
        env:
          # Make ephemerides_spectral importable without invoking the
          # scikit-build-core build (which would build the C library
          # and defeat the no-native test premise).
          PYTHONPATH: ${{ github.workspace }}/docs/antikythera-maths/ephemerides-spectral/python
        run: |
          # Tests that don't require the native binary path. The
          # native-parity test_native_parity.py skips cleanly when
          # HAS_NATIVE is False; we don't run it here.
          # test_parity_smoke.py is the C/Python parity SSOT — its
          # python_only entries must pass in this fallback cell so
          # we catch drift in the bridge surface even when no native
          # binary is available.
          python -m pytest \
              tests/test_facades.py \
              tests/test_immolation.py \
              tests/test_data_freshness.py \
              tests/test_parity_smoke.py \
              -q

  pure-wheel-build:
    # Always-on lightweight build of the Pyodide / WASM `py3-none-any`
    # wheel. The publish workflow's `build-pure-wheel` job swaps in
    # `pyproject-pure.toml` (hatchling backend) and runs `python -m
    # build --wheel`; we mirror exactly that here so any TOML-syntax
    # / hatchling-config drift in `pyproject-pure.toml` fails on the
    # PR, not at release time.
    #
    # Background: v0.3.1 shipped a `pyproject-pure.toml` with
    # `tool.hatch.build.targets.wheel.exclude` written as a TOML
    # table; hatchling requires an array of strings, so the publish
    # workflow's `build-pure-wheel` job failed and the publish step
    # was skipped (it `needs:` all three build jobs). Always-on build
    # of this wheel from the PR catches that class of regression
    # before it can block a release.
    name: pure-wheel build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify pyproject-pure.toml version matches main
        working-directory: docs/antikythera-maths/ephemerides-spectral/python
        run: |
          python3 <<'PY'
          import sys
          try:
              import tomllib
          except ImportError:
              import tomli as tomllib  # type: ignore[no-redef]
          with open("pyproject.toml", "rb") as f:
              main_v = tomllib.load(f)["project"]["version"]
          with open("pyproject-pure.toml", "rb") as f:
              pure_v = tomllib.load(f)["project"]["version"]
          if main_v != pure_v:
              print(f"::error::pyproject.toml version {main_v!r} != "
                    f"pyproject-pure.toml version {pure_v!r}. Bump them "
                    "together; the pure-wheel + platform-wheel pair must "
                    "agree on version.")
              sys.exit(1)
          print(f"versions agree: {main_v}")
          PY

      - name: Stage pure pyproject and build wheel
        working-directory: docs/antikythera-maths/ephemerides-spectral/python
        run: |
          set -euo pipefail
          mv pyproject.toml pyproject.toml.platform
          cp pyproject-pure.toml pyproject.toml
          trap 'mv pyproject.toml.platform pyproject.toml' EXIT
          python -m pip install --upgrade pip build hatchling twine
          python -m build --wheel
          ls -la dist/
          if ! ls dist/ephemerides_spectral-*-py3-none-any.whl 1>/dev/null 2>&1; then
            echo "::error::expected a py3-none-any wheel, did not find one"
            exit 1
          fi
          # Sanity: ensure no _native/ binaries leaked into the pure wheel.
          if python -m zipfile -l dist/*-py3-none-any.whl \
              | grep -E '_native/.*\.(so|dll|dylib)|\.exe$'; then
            echo "::error::native binaries leaked into pure wheel"
            exit 1
          fi
          python -m twine check --strict dist/*.whl
          echo "pure-wheel sanity checks passed"

  verify-wheels:
    # Mirrors ephemerides-spectral-publish.yml at full size: 3 OS x
    # 5 Python = 15 cells of cibuildwheel. Each cell builds the
    # platform wheel AND runs the per-wheel test command (native
    # parity + facade + immolation), so a green run here means the
    # published artefact actually loads its bundled native library.
    #
    # GATE (chess-spectral pattern): OPT-IN at PR time, not on by
    # default. Wall time is ~10–15 min and the matrix flakes on
    # transient infra (cibuildwheel timeouts, mirror 502s) — gating
    # off the default path stops merge-train flakes that have nothing
    # to do with the change under review. Triggers that DO run it:
    #   * Manual workflow_dispatch
    #   * PR labeled `wheel-check` (apply when touching package layout,
    #     pyproject.toml, scikit-build-core config, the C source tree,
    #     or anything that could plausibly break a per-Python wheel;
    #     also apply to vX.Y.Z release PRs as a forcing function)
    # The full publish matrix still runs on tag push via
    # ephemerides-spectral-publish.yml — that's the load-bearing
    # gate. This job is a pre-flight, not a primary gate.
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'wheel-check')
    name: verify-wheels • ${{ matrix.os }} • py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python: ["310", "311", "312", "313", "314"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build + test wheel via cibuildwheel
        uses: pypa/cibuildwheel@v3.4
        with:
          package-dir: docs/antikythera-maths/ephemerides-spectral/python
        env:
          CIBW_BUILD: "cp${{ matrix.python }}-*"
          CIBW_SKIP: "*-musllinux_* *-win32 *_i686"
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_MANYLINUX_AARCH64_IMAGE: "manylinux_2_28"
          CIBW_TEST_REQUIRES: "pytest skyfield jplephem"
          # test_parity_smoke.py is the C/Python parity SSOT — exercising
          # it inside the cibuildwheel test environment ensures both
          # python_only AND parity entries pass against the actual
          # platform-specific native binary, catching drift that
          # source-build cells alone wouldn't surface.
          # test_hd_parity.py + test_channel_basis_parity.py pin the
          # Tier 2a/2b byte-parity contracts; same logic.
          CIBW_TEST_COMMAND: >
            pytest {package}/tests/test_native_parity.py
            {package}/tests/test_immolation.py
            {package}/tests/test_parity_smoke.py
            {package}/tests/test_channel_basis_parity.py
            {package}/tests/test_hd_parity.py
            {package}/tests/test_facades.py -q
          CIBW_TEST_SKIP: "*-macosx_arm64 *-*linux_aarch64"

      - name: Sanity-check native library is in the wheel
        shell: bash
        run: |
          set -euo pipefail
          for whl in wheelhouse/*.whl; do
            echo "=== $whl ==="
            if ! python -m zipfile -l "$whl" \
                 | grep -E '_native/(lib)?ephemerides_spectral\.(so|dll|dylib)' \
                 ; then
              echo "::error::wheel $whl does NOT contain native library"
              python -m zipfile -l "$whl"
              exit 1
            fi
          done
          echo "all wheels contain native library"

      - name: Upload built wheel (artifact, debug only)
        uses: actions/upload-artifact@v4
        with:
          name: verify-wheel-${{ matrix.os }}-cp${{ matrix.python }}
          path: wheelhouse/*.whl
          # Short retention — debugging artefacts for failed PR runs,
          # not durable releases.
          retention-days: 7

  verify-build-artefacts:
    # Linux-only: build a single platform wheel + sdist with `python
    # -m build`, twine-check both, then install the wheel from a
    # neutral cwd and exercise the native load path. Splitting wheel
    # and sdist into separate `python -m build` invocations avoids
    # the sdist→wheel round-trip — that round-trip fails because our
    # CMakeLists.txt lives at the package's parent dir (sdist preserves
    # the path, but the unpacked tarball ends up with the wrong layout
    # for scikit-build-core's source-dir resolution).
    #
    # Same `wheel-check` gate as verify-wheels: this is the cheaper
    # but still-meaningful pre-flight when the full 15-cell matrix
    # is overkill.
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'wheel-check')
    name: build artefacts (Linux platform wheel + sdist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        working-directory: docs/antikythera-maths/ephemerides-spectral/python
        run: |
          python -m pip install --upgrade pip build scikit-build-core cmake twine
          python -m build --wheel
      - name: Build sdist
        working-directory: docs/antikythera-maths/ephemerides-spectral/python
        run: python -m build --sdist
      - name: Twine metadata check
        working-directory: docs/antikythera-maths/ephemerides-spectral/python
        run: python -m twine check --strict dist/*
      - name: Verify wheel contents
        working-directory: docs/antikythera-maths/ephemerides-spectral/python
        run: |
          set -euo pipefail
          WHEEL=$(ls dist/*.whl)
          python -m zipfile -l "$WHEEL" | grep -F "_data/manifest.json"
          python -m zipfile -l "$WHEEL" | grep -F "_research/bip_instrument.py"
          python -m zipfile -l "$WHEEL" | grep -F "_research/laplacian.py"
          python -m zipfile -l "$WHEEL" | grep -F "_research/ephemeris_reference_instrument.py"
          python -m zipfile -l "$WHEEL" | grep -F "_research/time_scales.py"
          python -m zipfile -l "$WHEEL" | grep -E '_native/(lib)?ephemerides_spectral\.(so|dll|dylib)'
          if echo "$WHEEL" | grep -q 'py3-none-any'; then
            echo "::error::expected platform-tagged wheel; got py3-none-any"
            exit 1
          fi
      - name: Smoke-test native load
        working-directory: docs/antikythera-maths/ephemerides-spectral/python
        run: |
          set -euo pipefail
          python -m pip install --quiet "$(ls dist/*.whl)[ephemeris,tests]"
          # Run from a neutral cwd so we exercise the installed wheel,
          # not the source-tree package.
          cd /tmp
          python -c "
          from ephemerides_spectral import _native_bip, default_encode
          from ephemerides_spectral.version import __version__
          assert _native_bip.HAS_NATIVE, f'HAS_NATIVE False: {_native_bip.LOAD_ERROR}'
          assert _native_bip.native_version() == __version__
          jd = 2451545.0 + 20 * 365.25
          py = default_encode(jd, backend='bip', kernel='de421')
          c  = default_encode(jd, backend='c',   kernel='de421')
          assert (py == c).all(), 'native parity mismatch at +20 yr'
          print('native smoke: PASS', _native_bip.LIB_PATH)
          "

  pedantic-build:
    # JPL Power-of-Ten Rule 10 — "All code must compile with all
    # compiler warnings enabled at the compiler's most pedantic
    # setting, without any warnings."
    #
    # Builds the C library directly via cmake -DES_PEDANTIC=ON across
    # the three target toolchains (Linux gcc, macOS clang, Windows MSVC).
    # ES_PEDANTIC=ON elevates the existing -Wall -Wextra -Wpedantic
    # (gcc/clang) or /W4 (MSVC) warnings to ERRORS, so any new warning
    # fails the build.
    #
    # Always-on (not gated by `wheel-check`) — Rule 10 is a permanent
    # invariant, not a per-PR opt-in. Cost is ~30s per cell; cheap
    # protection against the class of regression where someone
    # introduces a signed/unsigned mismatch or unused-variable.
    name: pedantic build • ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  cc: gcc }
          - { os: macos-14,       cc: clang }
          - { os: windows-latest, cc: msvc }
    steps:
      - uses: actions/checkout@v4

      - name: Configure with ES_PEDANTIC=ON
        working-directory: docs/antikythera-maths/ephemerides-spectral
        shell: bash
        run: |
          mkdir -p build-pedantic
          cmake -S . -B build-pedantic -DES_PEDANTIC=ON

      - name: Build (warnings → errors)
        working-directory: docs/antikythera-maths/ephemerides-spectral
        shell: bash
        run: cmake --build build-pedantic --config Release
