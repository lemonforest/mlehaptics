name: chess-spectral-ci

# Per-PR build + test for the chess-spectral package. Mirrors the
# release matrix from chess-spectral-publish.yml at a smaller scale —
# enough to catch regressions before merge without running the full
# 16-cell wheel matrix on every push.
#
# Triggers: pull_request changes under docs/chess-maths/chess-spectral/
# OR a manual workflow_dispatch.

on:
  pull_request:
    # Narrow path filter: trigger ONLY on changes that affect the
    # build/test surface. Skip docs-only edits (ROADMAP.md, AUDIT_*.md,
    # internal docs/ subdirectory) because those don't change what the
    # build evaluates and burn CI minutes per PR for zero useful signal.
    paths:
      - "docs/chess-maths/chess-spectral/python/**"
      - "docs/chess-maths/chess-spectral/bridge/**"
      - "docs/chess-maths/chess-spectral/src/**"
      - "docs/chess-maths/chess-spectral/include/**"
      - "docs/chess-maths/chess-spectral/codegen/**"
      - "docs/chess-maths/chess-spectral/test/**"
      - "docs/chess-maths/chess-spectral/vendor/**"
      - "docs/chess-maths/chess-spectral/CMakeLists.txt"
      - "docs/chess-maths/chess-spectral/CMakePresets.json"
      - ".github/workflows/chess-spectral-ci.yml"
  workflow_dispatch: {}

# Default token permissions: read-only on the repo contents. Neither
# job here writes to the repo (no commits, no releases, no comments) —
# all artifacts are uploaded via actions/upload-artifact, which doesn't
# need write permissions on `contents`. Explicit declaration satisfies
# GHAS / CodeQL "Workflow does not contain permissions" alert.
permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }} • py${{ matrix.python }} • ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  python: "3.12", preset: "release" }
          - { os: ubuntu-latest,  python: "3.12", preset: "asan" }
          - { os: macos-14,       python: "3.12", preset: "release" }
          - { os: windows-latest, python: "3.12", preset: "msvc-release" }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Python deps
        # `chess` (python-chess) is a runtime dep from v1.6 onward
        # (engine.search uses chess.Board for 2D move generation).
        # Earlier this lived in the `[corpus]` extra; v1.6 promoted
        # it to runtime. CI installs it explicitly here because we
        # don't `pip install` the package itself -- tests run via
        # sys.path bootstrap.
        run: python -m pip install --upgrade pip pytest numpy scipy chess

      - name: Install Ninja (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          if command -v apt-get >/dev/null; then
            sudo apt-get update && sudo apt-get install -y ninja-build
          else
            brew install ninja
          fi

      - name: Configure (CMake preset)
        working-directory: docs/chess-maths/chess-spectral
        shell: bash
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        working-directory: docs/chess-maths/chess-spectral
        shell: bash
        run: cmake --build --preset ${{ matrix.preset }}

      - name: C unit tests (ctest)
        working-directory: docs/chess-maths/chess-spectral
        shell: bash
        run: ctest --preset ${{ matrix.preset }} || true
        # ctest preset is best-effort — not every preset declares one;
        # we don't fail CI on a missing test preset.

      - name: Python tests (parity + e2e)
        working-directory: docs/chess-maths/chess-spectral/python
        shell: bash
        env:
          # Point pytest at the binary that the matching CMake preset
          # just built. Without this, the test suite would fall back
          # to its built-in search heuristic (which finds Visual Studio
          # build outputs from a developer machine).
          CS_SPECTRAL_BIN: ${{ github.workspace }}/docs/chess-maths/chess-spectral/build/release/spectral
          CS_SPECTRAL_4D_BIN: ${{ github.workspace }}/docs/chess-maths/chess-spectral/build/release/spectral_4d
        run: pytest tests/ --ignore=tests/phase_operators -v

  verify-wheels:
    # Catches wheel-build regressions by mirroring the full
    # chess-spectral-publish.yml matrix (3 OS × 5 Python = 15 cells).
    # Each wheel build runs the parity tests inside the wheel-test phase,
    # so we know the published wheel actually works, not just builds.
    #
    # GATE (added v1.6 cascade): the 15-cell matrix is OPT-IN at PR
    # time, not on by default. Wall time is ~10 min and the matrix
    # frequently flakes on transient infra (cibuildwheel timeout, HTTP
    # 502 from package mirrors, etc.) — gating it off the default PR
    # path stops merge-train flakes that have nothing to do with the
    # change under review. Triggers that DO run the matrix:
    #   - Manual `workflow_dispatch`
    #   - PR labeled `wheel-check` (apply when touching package layout,
    #     pyproject.toml, the encoder dimensions, or anything that
    #     could plausibly break a per-Python-version wheel; also apply
    #     to v1.X.Y-ship release PRs as a forcing function)
    # The full publish matrix still runs on tag push via
    # chess-spectral-publish.yml — that's the load-bearing gate. This
    # job is a pre-flight, not a primary gate, so opt-in is the right
    # default.
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'wheel-check')
    name: verify-wheels • ${{ matrix.os }} • py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python: ["310", "311", "312", "313", "314"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build + test wheel via cibuildwheel
        uses: pypa/cibuildwheel@v3.4
        with:
          package-dir: docs/chess-maths/chess-spectral/python
        env:
          # Build only the matrix's Python; cibuildwheel handles the
          # cp/abi/platform combinatorics. Mirrors publish.yml.
          CIBW_BUILD: "cp${{ matrix.python }}-*"
          # Skip:
          # - musllinux: no demand, scipy wheels limited
          # - win32:     no scipy Windows i686 wheels at any recent
          #              version, and we don't ship 32-bit Windows
          # - linux i686: same scipy story; AMD64 is enough
          CIBW_SKIP: "*-musllinux_* *-win32 *_i686"
          # Use manylinux_2_28 (RHEL 8 / glibc 2.28) instead of the
          # default manylinux2014. Required for scipy 1.17+, which
          # dropped manylinux2014 wheel support and ships only
          # manylinux_2_28 — without this bump, pip falls back to
          # building scipy from source inside the older container
          # and fails (no LAPACK / BLAS dev headers in manylinux2014).
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_MANYLINUX_AARCH64_IMAGE: "manylinux_2_28"
          # Run the same per-wheel parity tests the publish workflow runs,
          # so the verify-wheels guardrail also catches integration bugs
          # in the wheel-bundled native binary path (cli.py:_find_c_binary
          # → wheel _native/ dir lookup).
          #
          # scipy is unpinned: chess-spectral declares it as a runtime
          # dep, so it gets installed when pip installs the wheel itself
          # (proven by CI log). The earlier scipy<1.17 pin was a red
          # herring for the actual problem — see CIBW_SKIP for the
          # win32/i686 cells that genuinely lack scipy wheels.
          CIBW_TEST_REQUIRES: "pytest"
          # 1.7.0 M2.4: include the native-bitboard tests so the
          # wheel-bundled cs_bitboard4d shared library is exercised
          # at verify time. See chess-spectral-publish.yml for the
          # rationale (we don't want a silently-non-loadable .so/.dll).
          CIBW_TEST_COMMAND: >
            pytest {package}/../python/tests/test_fen4_parity.py
            {package}/../python/tests/test_e2e_spectralz4_parity.py
            {package}/../python/tests/test_2d_cli_parity.py
            {package}/../python/tests/test_native_bitboard4d.py -q
          CIBW_TEST_SKIP: "*-macosx_arm64 *-*linux_aarch64"

      - name: Sanity-check native bitboard library is in the wheel
        shell: bash
        run: |
          set -euo pipefail
          for whl in wheelhouse/*.whl; do
            echo "=== $whl ==="
            if ! python -m zipfile -l "$whl" \
                 | grep -E 'cs_bitboard4d\.(so|dll|dylib)|libcs_bitboard4d\.(so|dylib)' \
                 ; then
              echo "::error::wheel $whl does NOT contain cs_bitboard4d native library"
              python -m zipfile -l "$whl"
              exit 1
            fi
          done
          echo "all wheels contain cs_bitboard4d native library"

      - name: Upload built wheel (artifact, debug only)
        uses: actions/upload-artifact@v4
        with:
          name: verify-wheel-${{ matrix.os }}-cp${{ matrix.python }}
          path: wheelhouse/*.whl
          # Short retention — these are debugging artifacts for failed
          # PR runs, not durable releases.
          retention-days: 7

  fallback-test:
    # 1.7.0 M2.4: verify the pure-Python fallback path still works
    # for consumers who can't load the native bitboard library.
    # Targets:
    #   * Pyodide / micropip (single-process WASM, no .so loading)
    #   * sdist install on a host without C toolchain
    #   * Future: ABI mismatch (HAS_NATIVE=False because the binary
    #     reports the wrong cs_bb4_abi_version)
    #
    # Method: skip the C build entirely. With no .so/.dll in
    # build/* and no CS_BITBOARD4D_LIB env var, _native_bitboard4d
    # sets HAS_NATIVE=False and the pure-Python Bitboard4D path is
    # used. We verify HAS_NATIVE=False explicitly, then run the
    # spatial_4d tests to confirm correctness.
    name: fallback (pure-Python, no native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps (no chess-spectral install)
        # Match the per-PR build-and-test job's deps so the test suite
        # runs the same way, just without a native library on disk.
        run: python -m pip install --upgrade pip pytest numpy scipy chess

      - name: Verify HAS_NATIVE_BITBOARD is False (no .so/.dll built)
        working-directory: docs/chess-maths/chess-spectral/python
        shell: bash
        run: |
          python3 -c "
          import sys
          sys.path.insert(0, '.')
          from chess_spectral._native_bitboard4d import HAS_NATIVE, LOAD_ERROR
          assert HAS_NATIVE is False, (
              f'expected HAS_NATIVE=False without a build, got True. '
              f'A stale build/ directory may be polluting the search '
              f'path; check _find_library.'
          )
          assert LOAD_ERROR, 'LOAD_ERROR should explain why native was unavailable'
          print(f'OK: HAS_NATIVE=False as expected; LOAD_ERROR={LOAD_ERROR!r}')
          "

      - name: Run spatial_4d test suite with pure-Python fallback
        working-directory: docs/chess-maths/chess-spectral/python
        shell: bash
        run: |
          # The native-bitboard tests skip cleanly when HAS_NATIVE is
          # False (3 tests pass — module-imports / flag-consistent /
          # load-error-set; 7 tests skip). The spatial_4d tests run
          # against pure-Python Bitboard4D.
          python3 -m pytest \
              tests/test_spatial_4d_attacks_nonsliding.py \
              tests/test_spatial_4d_attacks_pawn.py \
              tests/test_spatial_4d_attacks_sliding.py \
              tests/test_spatial_4d_bitboard.py \
              tests/test_spatial_4d_board.py \
              tests/test_spatial_4d_draws.py \
              tests/test_native_bitboard4d.py \
              -q
