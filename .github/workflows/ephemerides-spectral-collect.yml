name: ephemerides-spectral-collect

# v0.25.0b — T1 attested-data refresh.
#
# Runs registered collectors against live upstream archives and
# opens an auto-PR with the resulting NDJSON updates. The PR's
# diff documents what changed; maintainers review per-row
# attestation (citation provenance) before merging.
#
# Schedule: monthly on the 1st at 02:00 UTC. Manual dispatch
# accepts an optional --source filter so a single source can be
# refreshed out-of-band.

on:
  schedule:
    - cron: '0 2 1 * *'
  workflow_dispatch:
    inputs:
      source:
        description: "Source key to refresh (or 'all')"
        required: false
        default: 'all'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ephemerides-spectral-collect-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/antikythera-maths/ephemerides-spectral
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collector extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./python[collector]

      - name: Run collectors
        env:
          SOURCE: ${{ github.event.inputs.source || 'all' }}
        run: |
          cd codegen
          python run_collectors.py --source "$SOURCE"

      - name: Re-run codegen to refresh manifest SHA-256 sums
        run: |
          cd codegen
          python regenerate.py

      - name: Detect changes
        id: changes
        run: |
          cd ../..
          if git diff --quiet HEAD --; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short
          fi
        working-directory: ${{ github.workspace }}

      - name: Open auto-PR with refreshed NDJSON
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            chore(attested): refresh ${{ github.event.inputs.source || 'all' }} NDJSON

            Auto-generated by ephemerides-spectral-collect workflow.
            Maintainer review checklist:
            - [ ] Per-row attestation block has all 9 mandatory fields
            - [ ] response_sha256 matches the upstream content (no truncation)
            - [ ] Citation provenance is correct + accessible
            - [ ] No PII / secrets / credentials in the data block
            - [ ] Re-run codegen produced byte-identical manifest.json
          title: |
            chore(attested): refresh ${{ github.event.inputs.source || 'all' }} NDJSON ${{ github.run_id }}
          body: |
            ## Auto-collected attested data refresh

            Run: ${{ github.event.inputs.source || 'all' }}
            Triggered by: ${{ github.event_name }} (${{ github.actor }})
            Workflow: ${{ github.workflow }}
            Run ID: ${{ github.run_id }}

            This PR contains the diff between the previously-committed
            attested NDJSON and the freshly-collected version. Each
            row's attestation block carries the upstream response's
            `response_sha256` + `retrieved_at` timestamp + the
            collector's `parser_version` + `parser_rule_hash` +
            `collector_descriptor_hash`. **Review citation provenance
            + license tags before merging**; the auto-PR is not a
            rubber-stamp surface.

            ### Maintainer review checklist

            - [ ] Per-row attestation has all 9 mandatory fields
            - [ ] `response_sha256` matches upstream content (no truncation)
            - [ ] Citation provenance correct + DOI accessible
            - [ ] No PII / secrets / credentials in `data` blocks
            - [ ] Re-run codegen locally produces byte-identical `manifest.json`
            - [ ] CI green (especially Windows codegen-determinism + manifest-SHA tests)
          branch: chore/attested-collect-${{ github.event.inputs.source || 'all' }}-${{ github.run_id }}
          base: main
          delete-branch: true

      - name: No changes — nothing to PR
        if: steps.changes.outputs.changed == 'false'
        run: |
          echo "No NDJSON changes detected; upstream archive unchanged or empty."
