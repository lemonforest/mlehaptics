name: ephemerides-spectral-autotag

# Creates and pushes an annotated ``ephemerides-spectral-vX.Y.Z`` tag
# (plus a matching GitHub Release with CHANGELOG notes) whenever
# ``docs/antikythera-maths/ephemerides-spectral/python/pyproject.toml``
# on the default branch reaches a strict-semver version that doesn't
# yet have a tag. No-ops on pre-release / dev versions
# (0.1.0rc1, 0.1.0.dev0, …) — those are explicitly test-only per
# ADR 0009.
#
# Mirror of antikythera-spectral-autotag.yml; tag namespace is
# ``ephemerides-spectral-v*`` (not ``v*``) so the three PyPI
# packages in this monorepo (chess-spectral, antikythera-spectral,
# ephemerides-spectral) can coexist without clobbering each other's
# tag space.

on:
  push:
    branches: [main]
    paths:
      - "docs/antikythera-maths/ephemerides-spectral/python/pyproject.toml"
      - "docs/antikythera-maths/ephemerides-spectral/CHANGELOG.md"
      - "docs/antikythera-maths/ephemerides-spectral/python/CHANGELOG.md"
      - ".github/workflows/ephemerides-spectral-autotag.yml"

# Only one tagging run at a time.
concurrency:
  group: ephemerides-spectral-autotag
  cancel-in-progress: false

jobs:
  maybe-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push tags + create releases
      actions: write    # dispatch ephemerides-spectral-publish.yml
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version and CHANGELOG notes
        id: ver
        shell: bash
        run: |
          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import re
          import tomllib

          PKG_DIR = "docs/antikythera-maths/ephemerides-spectral"
          PYPROJECT = f"{PKG_DIR}/python/pyproject.toml"
          # Prefer the package-side CHANGELOG (more user-facing,
          # PyPI-rendered) over the project-side one. Fall back to
          # the project-side if the package one is missing the
          # version section.
          PACKAGE_CHANGELOG = f"{PKG_DIR}/python/CHANGELOG.md"
          PROJECT_CHANGELOG = f"{PKG_DIR}/CHANGELOG.md"
          TAG_PREFIX = "ephemerides-spectral-v"

          with open(PYPROJECT, "rb") as f:
              version = tomllib.load(f)["project"]["version"]

          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              # Pre-release / dev markers do NOT autotag — test only.
              print(f"skip=true")
              print(f"reason=non-strict-semver::{version}")
              raise SystemExit(0)

          tag = f"{TAG_PREFIX}{version}"
          print(f"skip=false")
          print(f"version={version}")
          print(f"tag={tag}")

          def section_for(path, ver):
              try:
                  content = open(path, encoding="utf-8").read()
              except FileNotFoundError:
                  return ""
              pattern = rf"^## \[{re.escape(ver)}\][^\n]*\n(.*?)(?=^## \[|\Z)"
              m = re.search(pattern, content, re.MULTILINE | re.DOTALL)
              return (m.group(1).strip() if m else "").strip()

          notes = section_for(PACKAGE_CHANGELOG, version) or section_for(PROJECT_CHANGELOG, version)
          print("notes<<CHANGELOG_EOF")
          print(notes)
          print("CHANGELOG_EOF")
          PY

      - name: Report skip
        if: steps.ver.outputs.skip == 'true'
        run: |
          echo "::notice::Skipping auto-tag: ${{ steps.ver.outputs.reason }}"

      - name: Check whether tag already exists
        id: exists
        if: steps.ver.outputs.skip == 'false'
        shell: bash
        run: |
          tag='${{ steps.ver.outputs.tag }}'
          # Check the REMOTE for the tag, not just the local runner clone.
          # actions/checkout@v4 by default fetches only the triggering ref
          # (the push to main), not the tag space — so a local
          # `git rev-parse --verify refs/tags/$tag` would false-negative
          # any tag that's on the remote but absent locally. Concretely:
          # this fired on the 0.26.1 production cut (#400), where the
          # maintainer pushed `ephemerides-spectral-v0.26.1` manually
          # before the autotag workflow's git push step ran. Local check
          # said "doesn't exist", the workflow created + tried to push,
          # the remote rejected the push with "already exists", and the
          # job failed despite the desired outcome (tag at the merge
          # commit) already being achieved. `git ls-remote --exit-code`
          # consults the remote and exits 0 iff the ref exists there.
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists on origin; nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $tag does not exist on origin; will create."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create annotated tag + push
        if: steps.ver.outputs.skip == 'false' && steps.exists.outputs.exists == 'false'
        shell: bash
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          NOTES: ${{ steps.ver.outputs.notes }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$NOTES" ]; then
            printf '%s\n\n%s\n' "$TAG" "$NOTES" > /tmp/tag-msg
          else
            printf '%s\n' "$TAG" > /tmp/tag-msg
          fi
          git tag -a "$TAG" -F /tmp/tag-msg
          git push origin "$TAG"

      - name: Publish GitHub Release
        if: steps.ver.outputs.skip == 'false' && steps.exists.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          NOTES: ${{ steps.ver.outputs.notes }}
        run: |
          if [ -n "$NOTES" ]; then
            gh release create "$TAG" --title "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" --title "$TAG" --notes "Auto-tagged by CI on push to main."
          fi

      - name: Dispatch publish workflow
        # Tags pushed by GITHUB_TOKEN don't fire ``on: push: tags:``
        # workflows (GitHub's anti-recursion guard). Explicitly dispatch
        # the publish workflow against the new tag so it runs.
        #
        # MUST pass ``-f target=pypi``: the publish workflow's
        # ``target`` input defaults to ``testpypi`` (intentional safety
        # for manual / accidental dispatches), but autotag-driven
        # invocations always represent a strict-semver release and
        # belong on production PyPI.
        if: steps.ver.outputs.skip == 'false' && steps.exists.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          gh workflow run ephemerides-spectral-publish.yml \
              --ref "$TAG" -f target=pypi
