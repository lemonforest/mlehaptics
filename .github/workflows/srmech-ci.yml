name: srmech-ci

# Per-PR build + test for the srmech package. srmech is pure-Python
# (no native binary, no cibuildwheel matrix); the CI shape mirrors
# ephemerides-spectral-ci.yml's `build-and-test` job at a 4-cell
# always-on matrix plus a `pure-wheel build` smoke test.
#
# Triggers: pull_request changes under docs/srmech/python/**, push
# to main affecting srmech, OR a manual workflow_dispatch.

on:
  push:
    branches: [main]
    paths:
      - "docs/srmech/python/**"
      - ".github/workflows/srmech-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/srmech/python/**"
      - ".github/workflows/srmech-ci.yml"
  workflow_dispatch: {}

# Default token permissions: read-only. None of the jobs here writes
# to the repo. Artifact uploads (if any) don't need contents:write.
permissions:
  contents: read

# Cancel older runs for the same ref when a newer event fires —
# saves CI minutes on rapid pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # 4 cells, always-on. Same shape as ephemerides-spectral-ci's
    # build-and-test job: one Python (3.12) across three OS + a
    # min-supported-Python (3.10) cell on Linux to catch the
    # tomllib / typing regressions that only surface on the floor.
    name: ${{ matrix.os }} • py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  python: "3.12" }
          - { os: macos-14,       python: "3.12" }
          - { os: windows-latest, python: "3.12" }
          - { os: ubuntu-latest,  python: "3.10" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install package + dev tools
        working-directory: docs/srmech/python
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # Install the [dev] extra so all adapter deps + pytest +
          # jsonschema are available for the full test suite.
          python -m pip install -e ".[dev]"

      - name: Dump host SIMD / SHA-NI capability (F292 graft #3)
        # Records — per matrix cell — whether THIS runner carries the Intel
        # SHA Extensions, so we can see which runs exercise the rc18 SHA-NI
        # single-stream kernel (vs the scalar fallback the dev CPU runs).
        # The SHA-NI kernel COMPILES on every host (target-attribute-guarded);
        # this step just reports the runtime cpuid truth. Never fails the job.
        working-directory: docs/srmech/python
        shell: bash
        continue-on-error: true
        run: |
          python -c "from srmech.amsc import _native; \
            s=_native.native_status() if hasattr(_native,'native_status') else {}; \
            print('HAS_NATIVE', _native.HAS_NATIVE); \
            print('SHA-NI host:', _native.has_shani())"
          echo '--- raw cpu flags (best effort) ---'
          (grep -m1 -o 'sha_ni\| sha ' /proc/cpuinfo 2>/dev/null && echo 'LINUX: SHA present') \
            || (sysctl -a 2>/dev/null | grep -i 'sha512\|sha256\|machdep.cpu.*SHA' ) \
            || echo '(no /proc/cpuinfo or sysctl sha flag visible)'

      - name: Run tests
        working-directory: docs/srmech/python
        shell: bash
        run: pytest tests/ -q

  pure-wheel-build:
    # Always-on lightweight build of the py3-none-any wheel via the
    # pyproject-pure.toml swap (hatchling backend). Mirrors
    # ephemerides-spectral-ci's `pure-wheel-build` job. Task #201
    # Phase B2 introduced scikit-build-core as the primary backend
    # for `pyproject.toml`; the Pyodide / WASM fallback path lives in
    # `pyproject-pure.toml`. This job validates the pure-wheel build
    # path stays healthy.
    name: pure-wheel build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify pyproject-pure.toml version + description match main
        working-directory: docs/srmech/python
        run: |
          python3 <<'PY'
          import sys, tomllib
          with open("pyproject.toml", "rb") as f:
              main = tomllib.load(f)["project"]
          with open("pyproject-pure.toml", "rb") as f:
              pure = tomllib.load(f)["project"]
          if main["version"] != pure["version"]:
              print(f"::error::pyproject.toml version {main['version']!r} "
                    f"!= pyproject-pure.toml version {pure['version']!r}. "
                    f"Bump them together.")
              sys.exit(1)
          print(f"versions agree: {main['version']}")
          # Description-match guard (added during the rc8 "Pure Python."
          # drift fix). Both descriptions feed the same PyPI Summary;
          # they must stay in lockstep.
          if main["description"] != pure["description"]:
              print(f"::error::pyproject.toml and pyproject-pure.toml "
                    f"have drifted descriptions. Update both together.")
              print(f"  main ({len(main['description'])} chars): "
                    f"{main['description']!r}")
              print(f"  pure ({len(pure['description'])} chars): "
                    f"{pure['description']!r}")
              sys.exit(1)
          print(f"descriptions agree: {len(main['description'])} chars")
          PY

      - name: Build pure wheel via pyproject-pure swap
        working-directory: docs/srmech/python
        run: |
          set -euo pipefail
          mv pyproject.toml pyproject.toml.platform
          cp pyproject-pure.toml pyproject.toml
          trap 'mv pyproject.toml.platform pyproject.toml' EXIT
          python -m pip install --upgrade pip build hatchling twine
          python -m build
          ls -la dist/
          if ! ls dist/srmech-*-py3-none-any.whl 1>/dev/null 2>&1; then
            echo "::error::expected a py3-none-any wheel, did not find one"
            exit 1
          fi
          if python -m zipfile -l dist/*-py3-none-any.whl \
              | grep -E '\.(so|dll|dylib|exe)$'; then
            echo "::error::native binaries leaked into pure wheel"
            exit 1
          fi
          python -m twine check --strict dist/*
          echo "pure-wheel sanity checks passed"

      - name: Verify wheel installs + imports
        working-directory: docs/srmech/python
        run: |
          set -euo pipefail
          python -m pip install --quiet dist/*.whl
          cd /tmp
          python -c "
          from srmech import __version__
          from srmech.amsc import (
              MPRRecord, Descriptor, get_attested_dataset,
              register_attested_root, list_registered_roots,
          )
          print(f'srmech {__version__} OK')
          "

  pedantic-build:
    # Task #201 Phase B6 — JPL Power-of-Ten Rule 10 ratchet.
    # Build the srmech C library with SRMECH_PEDANTIC=ON across
    # Linux gcc / macOS clang / Windows MSVC. Any new warning fails
    # the build — `-Werror` on POSIX, `/WX` on MSVC. Mirrors
    # ephemerides-spectral-ci's pedantic-build job (their Tasks
    # #105–#110 audit work).
    #
    # Smoke target only — produces the shared library and the
    # ephemerides-style test binary (when present). Doesn't ship a
    # wheel; the wheel-build matrix in srmech-publish.yml does that
    # at tag time.
    name: pedantic C build • ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configure with SRMECH_PEDANTIC=ON
        working-directory: docs/srmech
        run: cmake -S . -B build -DSRMECH_PEDANTIC=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build (warnings = errors)
        working-directory: docs/srmech
        run: cmake --build build --config Release
