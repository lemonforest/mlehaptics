name: ephemerides-spectral-publish

# Build platform-specific binary wheels (via cibuildwheel) plus an
# sdist plus a pure-Python wheel for ``ephemerides-spectral`` and
# publish them to PyPI / TestPyPI via OIDC trusted publishing.
#
# v0.3.1 added a native C backend (libephemerides_spectral.so/.dll/.dylib)
# bundled into the wheel under ``ephemerides_spectral/_native/`` and
# loaded via ctypes. Per-OS / per-Python-version wheels are required.
#
# A pure-Python ``py3-none-any`` wheel is also built (using the
# ``pyproject-pure.toml`` swap) for Pyodide / WASM environments
# where the native binary can't run; the package falls back to the
# pure-Python BIP encoder in that case.
#
# RC-version auto-routing (added Task #200 Phase A — 2026-05-13):
#   * Tag ``ephemerides-spectral-vX.Y.ZrcN``  → TestPyPI auto-route
#   * Tag ``ephemerides-spectral-vX.Y.Z``      → PyPI       auto-route
# The tag suffix is the source of truth. TestPyPI releases happen
# autonomously on rc-tagged pushes; PyPI releases happen on clean-
# version pushes (tagging a non-rc version is itself the gate).
#
# Triggers:
#   * push on ``ephemerides-spectral-v*`` tags — auto-routes per
#     rc-suffix (see above).
#   * workflow_dispatch with ``target ∈ {testpypi, pypi}`` (default
#     testpypi) — manual fallback to override the auto-route.
#
# Trusted-publisher entries (one-time setup; both done):
#   * pypi.org      project=ephemerides-spectral, env=pypi
#   * test.pypi.org project=ephemerides-spectral, env=testpypi

on:
  push:
    tags:
      - "ephemerides-spectral-v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        required: true
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build-wheels:
    name: wheel • ${{ matrix.os }} • py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python: ["310", "311", "312", "313", "314"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel via cibuildwheel
        uses: pypa/cibuildwheel@v3.4
        with:
          package-dir: docs/antikythera-maths/ephemerides-spectral/python
        env:
          CIBW_BUILD: "cp${{ matrix.python }}-*"
          # Skip 32-bit + musl: numpy / skyfield wheel coverage parity
          # with the chess-spectral / antikythera-spectral matrix.
          CIBW_SKIP: "*-musllinux_* *-win32 *_i686"
          # manylinux_2_28: matches the chess-spectral CI choice.
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_MANYLINUX_AARCH64_IMAGE: "manylinux_2_28"
          # Per-wheel test: ensure the bundled C library loaded and
          # the three-way (Python ↔ native) parity holds at the
          # +/-1 yr / +/-20 yr / +/-100 yr ladder.
          CIBW_TEST_REQUIRES: "pytest skyfield jplephem"
          CIBW_TEST_COMMAND: >
            pytest {package}/tests/test_native_parity.py
            {package}/tests/test_immolation.py
            {package}/tests/test_facades.py -q
          # Skip aarch64 wheel testing where the build runner can't
          # execute the wheel natively (cibuildwheel default skip set).
          CIBW_TEST_SKIP: "*-macosx_arm64 *-*linux_aarch64"

      - name: Sanity-check native library is in the wheel
        shell: bash
        run: |
          set -euo pipefail
          for whl in wheelhouse/*.whl; do
            echo "=== $whl ==="
            if ! python -m zipfile -l "$whl" \
                 | grep -E '_native/(lib)?ephemerides_spectral\.(so|dll|dylib)' \
                 ; then
              echo "::error::wheel $whl does NOT contain native library"
              python -m zipfile -l "$whl"
              exit 1
            fi
          done
          echo "all wheels contain native library"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-cp${{ matrix.python }}
          path: wheelhouse/*.whl

  build-sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - name: Build sdist
        working-directory: docs/antikythera-maths/ephemerides-spectral/python
        run: python -m build --sdist
      - name: Twine metadata check
        working-directory: docs/antikythera-maths/ephemerides-spectral/python
        run: python -m twine check --strict dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: docs/antikythera-maths/ephemerides-spectral/python/dist/*.tar.gz

  build-pure-wheel:
    # Pure-Python ``py3-none-any`` wheel for environments that can't
    # run the bundled native binary (Pyodide / WASM in browsers,
    # primarily). Built via hatchling instead of scikit-build-core,
    # using a separate ``pyproject-pure.toml`` that's swapped in
    # locally for the build then restored.
    name: pure-python wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify pyproject-pure.toml version matches main
        working-directory: docs/antikythera-maths/ephemerides-spectral/python
        run: |
          python3 <<'PY'
          import sys, tomllib
          with open("pyproject.toml", "rb") as f:
              main_v = tomllib.load(f)["project"]["version"]
          with open("pyproject-pure.toml", "rb") as f:
              pure_v = tomllib.load(f)["project"]["version"]
          if main_v != pure_v:
              print(f"::error::pyproject.toml version {main_v!r} != "
                    f"pyproject-pure.toml version {pure_v!r}. Bump them "
                    "together; the pure-wheel + platform-wheel pair must "
                    "agree on version.")
              sys.exit(1)
          print(f"versions agree: {main_v}")
          PY

      - name: Verify [project].description is under PyPI's 512-char Summary limit
        working-directory: docs/antikythera-maths/ephemerides-spectral/python
        run: |
          python3 <<'PY'
          # PyPI's "Summary" metadata field has a HARD 512-character
          # limit. The upload endpoint silently rejects metadata that
          # exceeds it ("could not comply" with no useful detail in the
          # publish action's logs). `twine check --strict` does NOT
          # enforce this. Caught us when v0.22.0 + v0.23.0 publishes
          # both stalled at 593 chars; the description grew across
          # ships without anyone counting until the upload failed.
          # Pin a build-time guard with explicit error message so
          # future-self never re-learns this the hard way.
          import sys, tomllib
          PYPI_SUMMARY_LIMIT = 512
          # Leave a 32-char margin so a future surface name addition
          # doesn't push the next ship over.
          SOFT_LIMIT = 480
          for path in ("pyproject.toml", "pyproject-pure.toml"):
              with open(path, "rb") as f:
                  desc = tomllib.load(f)["project"]["description"]
              n = len(desc)
              non_ascii = [c for c in desc if ord(c) > 127]
              print(f"{path}: description = {n} chars (limit "
                    f"{PYPI_SUMMARY_LIMIT}, soft {SOFT_LIMIT}); "
                    f"non-ascii = {len(non_ascii)}")
              if n >= PYPI_SUMMARY_LIMIT:
                  print(f"::error::{path} description is {n} chars; "
                        f"PyPI's Summary metadata field has a HARD "
                        f"{PYPI_SUMMARY_LIMIT}-char limit. Upload will "
                        "be silently rejected. Trim the description.")
                  sys.exit(1)
              if n >= SOFT_LIMIT:
                  print(f"::warning::{path} description is {n} chars; "
                        f"approaching the {PYPI_SUMMARY_LIMIT}-char "
                        f"PyPI limit. Soft cap is {SOFT_LIMIT}. "
                        "Trim before adding more surface names.")
              if non_ascii:
                  print(f"::warning::{path} description contains "
                        f"non-ASCII characters: "
                        f"{[hex(ord(c)) for c in non_ascii[:5]]}. "
                        "Some PyPI mirrors / packaging tools choke on "
                        "non-ASCII metadata; prefer ASCII.")
          PY

      - name: Stage pure pyproject and build wheel
        working-directory: docs/antikythera-maths/ephemerides-spectral/python
        run: |
          set -euo pipefail
          mv pyproject.toml pyproject.toml.platform
          cp pyproject-pure.toml pyproject.toml
          trap 'mv pyproject.toml.platform pyproject.toml' EXIT
          python -m pip install --upgrade pip build hatchling
          python -m build --wheel
          ls -la dist/
          if ! ls dist/ephemerides_spectral-*-py3-none-any.whl 1>/dev/null 2>&1; then
            echo "::error::expected a py3-none-any wheel, did not find one"
            exit 1
          fi
          # Sanity: ensure no _native/ binaries leaked into the pure wheel.
          if python -m zipfile -l dist/*-py3-none-any.whl \
              | grep -E '_native/.*\.(so|dll|dylib)|\.exe$'; then
            echo "::error::native binaries leaked into pure wheel"
            exit 1
          fi
          echo "pure-wheel sanity checks passed"

      - name: Twine metadata check
        working-directory: docs/antikythera-maths/ephemerides-spectral/python
        run: |
          python -m pip install --upgrade twine
          python -m twine check --strict dist/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-pure
          path: docs/antikythera-maths/ephemerides-spectral/python/dist/*py3-none-any.whl

  publish:
    name: >-
      publish
      (${{
        (github.event_name == 'workflow_dispatch' && inputs.target)
        || (contains(github.ref_name, 'rc') && 'testpypi')
        || 'pypi'
      }})
    needs: [build-wheels, build-sdist, build-pure-wheel]
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/ephemerides-spectral-v'))
    environment:
      # rc-version auto-routing: tag ending in rcN goes to testpypi;
      # plain semver tag goes to pypi. workflow_dispatch overrides
      # via `inputs.target`.
      name: >-
        ${{
          (github.event_name == 'workflow_dispatch' && inputs.target)
          || (contains(github.ref_name, 'rc') && 'testpypi')
          || 'pypi'
        }}
      url: >-
        ${{
          ((github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi')
           || (github.event_name == 'push' && contains(github.ref_name, 'rc')))
            && 'https://test.pypi.org/project/ephemerides-spectral/'
            || 'https://pypi.org/project/ephemerides-spectral/'
        }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Verify tag matches pyproject (tag-push only)
        if: github.event_name == 'push'
        shell: bash
        run: |
          python3 <<'PY'
          import os, re, tomllib, sys
          tag = os.environ["GITHUB_REF_NAME"]
          # Allow rcN suffix (TestPyPI auto-route trigger). Matches
          # PEP 440 pre-release form: X.Y.ZrcN, no separator before rc.
          m = re.fullmatch(r"ephemerides-spectral-v(\d+\.\d+\.\d+(?:rc\d+)?)", tag)
          if not m:
              print(f"::error::tag {tag!r} does not match ephemerides-spectral-vX.Y.Z[rcN]")
              sys.exit(1)
          tag_version = m.group(1)
          path = "docs/antikythera-maths/ephemerides-spectral/python/pyproject.toml"
          with open(path, "rb") as f:
              pyver = tomllib.load(f)["project"]["version"]
          if tag_version != pyver:
              print(f"::error::tag {tag_version!r} != pyproject {pyver!r}")
              sys.exit(1)
          # Cross-check the auto-routing rule. If the tag has rc, this
          # publish should hit TestPyPI; if not, PyPI. Log the routing.
          if "rc" in tag_version:
              print(f"Tag {tag_version!r} is an rc release → TestPyPI")
          else:
              print(f"Tag {tag_version!r} is a clean release → PyPI")
          print(f"tag and pyproject agree: {tag_version}")
          PY

      - name: Collect into dist/
        run: |
          mkdir -p dist
          find artifacts -name '*.whl' -exec cp {} dist/ \;
          find artifacts -name '*.tar.gz' -exec cp {} dist/ \;
          ls -la dist/

      - name: Publish to TestPyPI
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi')
          || (github.event_name == 'push' && contains(github.ref_name, 'rc'))
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist

      - name: Publish to PyPI
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
          || (github.event_name == 'push' && !contains(github.ref_name, 'rc'))
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
