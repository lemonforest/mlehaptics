name: CodeQL

# Advanced Setup for CodeQL — replaces GitHub Default Setup so we can
# honor `.github/codeql/codeql-config.yml` (Default Setup ignores it).
#
# Why we need this:
#   1. Default Setup auto-discovers Python sources across the entire
#      repo, including docs/chess-maths/ research scripts. One of
#      them (chess_d4_direct.py) trips a quirk in CodeQL's Python
#      extractor even though every CPython 3.9–3.14 parses it fine.
#   2. Default Setup uses `build-mode: none` for c-cpp (buildless
#      extraction), which gives less-accurate results because it
#      can't trace the CMake build at docs/chess-maths/chess-spectral.
#      Advanced Setup lets us run cmake --build before analyze, so
#      CodeQL traces actual compiles and gets full type / include
#      coverage.
#
# After landing this, disable Default Setup in the repo settings
# (Settings → Code security → CodeQL setup → Disable). The two would
# otherwise run in parallel and waste runner minutes.

on:
  push:
    branches: [main]
    paths:
      - "docs/chess-maths/chess-spectral/**"
      - "docs/antikythera-maths/python/**"
      - "docs/antikythera-maths/antikythera-spectral/**"
      - ".github/codeql/**"
      - ".github/workflows/codeql.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/chess-maths/chess-spectral/**"
      - "docs/antikythera-maths/python/**"
      - "docs/antikythera-maths/antikythera-spectral/**"
      - ".github/codeql/**"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "27 4 * * 0"  # weekly Sunday 04:27 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # rc357 (`#T951`) — hang guard. This is a DELIBERATE OVERRIDE of the
    # derivation rule (see srmech-publish.yml `build-wheels`), flagged rather
    # than silently fudged: the rule gives 12 from max 1:37 over n=24, but
    # CodeQL's runtime scales with TREE GROWTH rather than per-run variance, and
    # 24 samples of a growing repo is weak evidence for the ceiling. 20 buys
    # room for the tree to grow without re-deriving every rc.
    timeout-minutes: 20
    permissions:
      security-events: write   # upload SARIF
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: c-cpp
            build-mode: manual    # we run cmake --build below
          - language: actions
            build-mode: none

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Honors paths / paths-ignore. Default Setup ignores this
          # file; Advanced Setup uses it.
          config-file: ./.github/codeql/codeql-config.yml

      # c-cpp: build chess-spectral so CodeQL traces real compiles.
      # No-op for python and actions (build-mode: none).
      - if: matrix.language == 'c-cpp'
        name: Build chess-spectral C source for CodeQL tracing
        working-directory: docs/chess-maths/chess-spectral
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
