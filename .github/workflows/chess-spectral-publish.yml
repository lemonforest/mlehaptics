name: chess-spectral-publish

# Build platform-specific binary wheels (via cibuildwheel) plus an sdist
# for the ``chess-spectral`` package and publish them to PyPI via
# trusted publishing (OIDC) on a ``chess-spectral-v*`` tag.
#
# v1.2.4 added native binary bundling via scikit-build-core; the wheel
# now includes ``spectral`` + ``spectral_4d`` under
# ``chess_spectral/_native/``. That requires per-OS / per-Python-version
# wheels — hence the cibuildwheel matrix below.
#
# Triggers:
#   * ``push`` on ``chess-spectral-v*`` tags — ONLY fires when the tag
#     push comes from a human / PAT. Tags pushed by the autotag
#     workflow's GITHUB_TOKEN do NOT trigger this event (GitHub's
#     anti-recursion guard). The autotag workflow compensates by
#     dispatching this workflow explicitly after it pushes the tag.
#   * ``workflow_dispatch`` — manual fallback. Pick the tag (e.g.
#     ``chess-spectral-v1.2.4``) in the Ref dropdown and click Run.
#
# Trusted publisher configuration (one-time, done by a human on pypi.org):
#   Project:           chess-spectral
#   Owner:             lemonforest
#   Repository:        mlehaptics
#   Workflow filename: chess-spectral-publish.yml
#   Environment name:  pypi

on:
  push:
    tags:
      - "chess-spectral-v*"
  workflow_dispatch: {}

# Default token permissions: read-only. The build-wheels and build-sdist
# jobs only need to read the repo and upload artifacts (which doesn't
# require write permissions on `contents`). The `publish` job overrides
# this to add `id-token: write` for PyPI trusted publishing — see its
# job-level `permissions:` block below.
permissions:
  contents: read

jobs:
  build-wheels:
    name: wheel • ${{ matrix.os }} • py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-13 (Intel x86_64) is intentionally excluded: GitHub Actions
        # macos-13 runner capacity is severely constrained as Apple deprecates
        # Intel Macs, and we observed runs queuing for 1+ hour without ever
        # starting (PR #62 publish run #6). Apple-Silicon coverage via
        # macos-14 is sufficient for the macOS user base; Intel Mac users
        # can build from sdist (we ship one alongside the wheels) or use
        # Rosetta with a manylinux x86_64 wheel under Docker.
        os: [ubuntu-latest, macos-14, windows-latest]
        # Python 3.14 added 2026-04-28: ~6 months after 3.14.0 release,
        # ecosystem (numpy/scipy/cibuildwheel/scikit-build-core) all
        # have stable cp314 wheels. Matrix grows from 3 OS × 4 Python
        # = 12 cells to 3 × 5 = 15 cells per release.
        python: ["310", "311", "312", "313", "314"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel via cibuildwheel
        uses: pypa/cibuildwheel@v2.21
        with:
          package-dir: docs/chess-maths/chess-spectral/python
        env:
          # Build only the matrix's Python; cibuildwheel handles the
          # cp/abi/platform combinatorics. CPython only — PyPy is out
          # of scope for the C-binary-bundling story.
          CIBW_BUILD: "cp${{ matrix.python }}-*"
          # Skip 32-bit Windows / Linux: scipy doesn't ship i686 wheels,
          # and we don't ship 32-bit. musllinux: skipped for parity with
          # CI verify-wheels.
          CIBW_SKIP: "*-musllinux_* *-win32 *_i686"
          # See chess-spectral-ci.yml for the manylinux_2_28 rationale
          # (scipy 1.17+ dropped manylinux2014 wheel support).
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_MANYLINUX_AARCH64_IMAGE: "manylinux_2_28"
          # Per-wheel test: import the package and run the FEN4 + e2e
          # parity tests. Skip aarch64/arm64 wheel testing where the
          # build runner can't execute the wheel natively.
          #
          # numpy + scipy come in transitively as chess-spectral runtime
          # deps when the wheel is installed; only pytest needs to be
          # added explicitly here.
          CIBW_TEST_REQUIRES: "pytest"
          CIBW_TEST_COMMAND: >
            pytest {package}/../python/tests/test_fen4_parity.py
            {package}/../python/tests/test_e2e_spectralz4_parity.py
            {package}/../python/tests/test_2d_cli_parity.py -q
          CIBW_TEST_SKIP: "*-macosx_arm64 *-*linux_aarch64"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-cp${{ matrix.python }}
          path: wheelhouse/*.whl

  build-sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - name: Build sdist
        working-directory: docs/chess-maths/chess-spectral/python
        run: python -m build --sdist
      - name: Twine metadata check
        working-directory: docs/chess-maths/chess-spectral/python
        run: |
          python -m pip install --upgrade twine
          python -m twine check --strict dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: docs/chess-maths/chess-spectral/python/dist/*.tar.gz

  build-pure-wheel:
    # Pure-Python `py3-none-any` wheel for environments that can't
    # run our platform-specific binaries — primarily Pyodide / micropip
    # in browsers (mobile + desktop). The Pyodide runtime is
    # single-process WASM with no fork/exec, so subprocess'd binaries
    # don't work; the pure wheel uses the Python encoder paths
    # exclusively (verified bit-for-bit against C output by
    # test_c_py_parity*).
    #
    # Built via hatchling instead of scikit-build-core. The build
    # uses pyproject-pure.toml (which lives alongside the canonical
    # pyproject.toml in the package dir); we copy it over the main
    # pyproject in a checkout-local staging step, build, then restore.
    # The version in pyproject-pure.toml MUST match the main
    # pyproject's version; the publish job's tag-version check covers
    # both via grep.
    name: pure-python wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify pyproject-pure.toml version matches main
        working-directory: docs/chess-maths/chess-spectral/python
        run: |
          python3 <<'PY'
          import sys, tomllib
          with open("pyproject.toml", "rb") as f:
              main_v = tomllib.load(f)["project"]["version"]
          with open("pyproject-pure.toml", "rb") as f:
              pure_v = tomllib.load(f)["project"]["version"]
          if main_v != pure_v:
              print(f"::error::pyproject.toml version {main_v!r} != "
                    f"pyproject-pure.toml version {pure_v!r}. Bump them "
                    "together; the pure-wheel + platform-wheel pair must "
                    "agree on version.")
              sys.exit(1)
          print(f"versions agree: {main_v}")
          PY

      - name: Stage pure pyproject and build wheel
        working-directory: docs/chess-maths/chess-spectral/python
        run: |
          # Swap pyproject.toml -> pyproject-pure.toml so hatchling's
          # build backend picks it up. Restore in a `finally` so the
          # checkout is unmodified for downstream jobs (artifact
          # uploads run on this same checkout).
          set -euo pipefail
          mv pyproject.toml pyproject.toml.platform
          cp pyproject-pure.toml pyproject.toml
          trap 'mv pyproject.toml.platform pyproject.toml' EXIT
          python -m pip install --upgrade pip build hatchling
          python -m build --wheel
          ls -la dist/
          # Sanity: ensure the wheel has 'py3-none-any' tag.
          if ! ls dist/chess_spectral-*-py3-none-any.whl 1>/dev/null 2>&1; then
            echo "::error::expected a py3-none-any wheel, did not find one"
            exit 1
          fi
          # Sanity: ensure no _native/ binaries leaked into the wheel.
          if python -m zipfile -l dist/*-py3-none-any.whl | grep -E '_native/|\.exe$|\.so$|\.dll$|\.dylib$'; then
            echo "::error::native binaries leaked into pure wheel"
            exit 1
          fi
          echo "pure-wheel sanity checks passed"

      - name: Twine metadata check
        working-directory: docs/chess-maths/chess-spectral/python
        run: |
          python -m pip install --upgrade twine
          python -m twine check --strict dist/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-pure
          path: docs/chess-maths/chess-spectral/python/dist/*py3-none-any.whl

  publish:
    name: publish to PyPI
    needs: [build-wheels, build-sdist, build-pure-wheel]
    runs-on: ubuntu-latest
    # Publish only on tag-push or workflow_dispatch on a tag ref; never
    # on PR / branch dispatches.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/chess-spectral-v'))
    environment:
      name: pypi
      url: https://pypi.org/project/chess-spectral/
    permissions:
      id-token: write  # OIDC token for PyPI trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Verify tag matches pyproject version
        shell: bash
        run: |
          python3 <<'PY'
          import os, re, tomllib, sys
          tag = os.environ["GITHUB_REF_NAME"]  # e.g. "chess-spectral-v1.2.4"
          m = re.fullmatch(r"chess-spectral-v(\d+\.\d+\.\d+)", tag)
          if not m:
              print(f"::error::Tag {tag!r} does not match chess-spectral-vX.Y.Z")
              sys.exit(1)
          tag_version = m.group(1)
          with open("docs/chess-maths/chess-spectral/python/pyproject.toml", "rb") as f:
              pyproject_version = tomllib.load(f)["project"]["version"]
          if tag_version != pyproject_version:
              print(
                  f"::error::Tag version {tag_version!r} != pyproject version "
                  f"{pyproject_version!r}; refusing to publish."
              )
              sys.exit(1)
          print(f"Tag and pyproject agree: {tag_version}")
          PY

      - name: Collect wheels + sdist into dist/
        run: |
          mkdir -p dist
          find artifacts -name '*.whl' -exec cp {} dist/ \;
          find artifacts -name '*.tar.gz' -exec cp {} dist/ \;
          ls -la dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
