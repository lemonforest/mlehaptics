[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

# Pure-Python wheel (py3-none-any). Built for Pyodide / WASM / no-C
# environments where the scikit-build-core CMake compile in
# pyproject.toml can't run. Same package name + version; the
# difference is wheel-tag (py3-none-any vs platform-specific).
#
# The wheel-publish workflow swaps this in temporarily during the
# build-pure-wheel job (and asserts the version matches the main
# pyproject.toml's version via a tag-version-check step).
#
# Mirrors chess-spectral/python/pyproject-pure.toml.

[project]
name = "ephemerides-spectral"
version = "0.30.0rc8"
# IMPORTANT: PyPI's "Summary" metadata field has a HARD 512-character
# limit. The upload endpoint silently rejects oversize metadata
# ("could not comply" with no useful detail bubbled into the publish
# action's logs). `twine check --strict` does NOT enforce this.
# Keep this string ASCII-only and under ~480 chars to leave headroom.
# A guard in `.github/workflows/ephemerides-spectral-publish.yml`
# pins this at build time. Must agree with `pyproject.toml`.
description = "High-precision HDC reference instrument for the Sol Star System based on JPL DE441. 52-body roster (Lagrange trojans + retrograde irregulars); per-body Geodetic, Electromagnetic, Magnetic-Multipole, Fluid catalogs; eleven cross-channel coupling surfaces; trajectory + sensing layer (ballistic propagator, 3-regime ICBM, look-angle geometry, BC-differential discrimination); resonance-graph ITN-chain search; spectral body-architecture; pure-Python build for Pyodide / WASM."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{ name = "Steven Kirkland" }]
keywords = [
    "ephemeris",
    "spectral",
    "hyperdimensional-computing",
    "skyfield",
    "astronomy",
    "mars-sol-date",
    "mars-coordinated-time",
    "lunar-time",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
# srmech is a hard runtime dep — ephemerides_spectral/__init__.py's
# _bootstrap_amsc() imports srmech.amsc.* at package import (Task #197
# Phase 3 cross-package wiring). MUST stay congruent with the floor
# in pyproject.toml.
dependencies = ["numpy>=1.24", "srmech>=0.7.4"]

[project.optional-dependencies]
ephemeris  = ["skyfield>=1.46", "jplephem>=2.21"]
tests      = ["pytest>=7.0", "tomli>=2.0; python_version<'3.11'"]
collector         = ["requests>=2.28", "beautifulsoup4>=4.11", "tomli>=2.0; python_version<'3.11'", "jsonschema>=4.0"]
collector-netcdf  = ["netCDF4>=1.6"]
collector-geotiff = ["rasterio>=1.3"]

[project.urls]
Homepage      = "https://mlehaptics.readthedocs.io/en/latest/antikythera-maths/ephemerides-spectral/"
Documentation = "https://mlehaptics.readthedocs.io/en/latest/antikythera-maths/ephemerides-spectral/"
Repository    = "https://github.com/lemonforest/mlehaptics"
Issues        = "https://github.com/lemonforest/mlehaptics/issues"
Changelog     = "https://mlehaptics.readthedocs.io/en/latest/antikythera-maths/ephemerides-spectral/python/CHANGELOG/"
Roadmap       = "https://mlehaptics.readthedocs.io/en/latest/antikythera-maths/ephemerides-spectral/ROADMAP/"
Notebook      = "https://mlehaptics.readthedocs.io/en/latest/antikythera-maths/ephemerides_spectral_research_notebook/"

[project.scripts]
ephemerides-spectral = "ephemerides_spectral.cli:main"

# srmech profile pattern (ADR-0001 §4 — Task #212 PR-a).
# Mirror of the platform pyproject.toml declaration; required so the
# pure-Python wheel (Pyodide / WASM) also surfaces the ephemerides
# profile to srmech.list_profiles().
[project.entry-points."srmech.profiles"]
ephemerides = "ephemerides_spectral"

[tool.hatch.build.targets.wheel]
packages = ["ephemerides_spectral"]
# Exclude any _native/ directory if it leaked in from a prior build.
# Hatchling's `exclude` must be an array of glob strings — *not* a
# table. The earlier table form (`"...\_native/*" = true`) tripped
# `TypeError: Field tool.hatch.build.targets.wheel.exclude must be
# an array of strings` and broke the v0.3.1 publish workflow.
exclude = [
    "ephemerides_spectral/_native/*",
    "ephemerides_spectral/_native/**",
]

[tool.hatch.build.targets.wheel.force-include]
"ephemerides_spectral/_data/manifest.json" = "ephemerides_spectral/_data/manifest.json"
# v0.27.0 PR-a — srmech profile artifacts (Task #212). Hatchling
# needs explicit inclusion for TOMLs since they're data not Python.
"ephemerides_spectral/srmech_profile.toml" = "ephemerides_spectral/srmech_profile.toml"
"ephemerides_spectral/_srmech_tool_schema.toml" = "ephemerides_spectral/_srmech_tool_schema.toml"
