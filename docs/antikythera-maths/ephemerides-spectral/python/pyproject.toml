[build-system]
requires = ["scikit-build-core>=0.10", "cmake>=3.23"]
build-backend = "scikit_build_core.build"

[project]
name = "ephemerides-spectral"
version = "0.30.0rc5"
# IMPORTANT: PyPI's "Summary" metadata field has a HARD 512-character
# limit. The upload endpoint silently rejects metadata that exceeds it
# ("could not comply" with no useful detail bubbled into the publish
# action's logs). `twine check --strict` does NOT enforce this.
# Keep this string ASCII-only and under ~480 chars to leave headroom.
# A guard in `.github/workflows/ephemerides-spectral-publish.yml`
# pins this at build time.
description = "High-precision HDC reference instrument for the Sol Star System based on JPL DE441. Native C backend; 52-body roster (Lagrange trojans + retrograde irregulars); per-body Geodetic, Electromagnetic, Magnetic-Multipole, Fluid catalogs; eleven cross-channel coupling surfaces; trajectory + sensing layer (ballistic propagator, 3-regime ICBM, look-angle geometry, BC-differential discrimination); resonance-graph ITN-chain search; spectral body-architecture; SPICE-free runtime."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{ name = "Steven Kirkland" }]
keywords = [
    "ephemeris",
    "spectral",
    "hyperdimensional-computing",
    "skyfield",
    "astronomy",
    "mars-sol-date",
    "mars-coordinated-time",
    "lunar-time",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.24", "srmech>=0.7.1"]

[project.optional-dependencies]
ephemeris  = ["skyfield>=1.46", "jplephem>=2.21"]
tests      = ["pytest>=7.0", "tomli>=2.0; python_version<'3.11'"]
# v0.25.0+ — Attested Multi-Source Collector framework. Build/codegen-
# time tooling for the T1 collect workflow; runtime read paths
# (loading committed NDJSON via bridge.get_attested_dataset etc.)
# never need these. Each adapter module imports its dependencies
# lazily inside fetch/parse so missing extras don't break import.
collector         = ["requests>=2.28", "beautifulsoup4>=4.11", "tomli>=2.0; python_version<'3.11'", "jsonschema>=4.0"]
# Future-deferred. The netcdf_grid + geotiff_bbox adapters ship as
# fixture-only stubs in v0.25.0; the real impls land when a
# downstream consumer's question concretely needs gridded reanalysis
# / raster tiles as ground-proof rows.
collector-netcdf  = ["netCDF4>=1.6"]
collector-geotiff = ["rasterio>=1.3"]

[project.urls]
Homepage      = "https://mlehaptics.readthedocs.io/en/latest/antikythera-maths/ephemerides-spectral/"
Documentation = "https://mlehaptics.readthedocs.io/en/latest/antikythera-maths/ephemerides-spectral/"
Repository    = "https://github.com/lemonforest/mlehaptics"
Issues        = "https://github.com/lemonforest/mlehaptics/issues"
Changelog     = "https://mlehaptics.readthedocs.io/en/latest/antikythera-maths/ephemerides-spectral/python/CHANGELOG/"
Roadmap       = "https://mlehaptics.readthedocs.io/en/latest/antikythera-maths/ephemerides-spectral/ROADMAP/"
Notebook      = "https://mlehaptics.readthedocs.io/en/latest/antikythera-maths/ephemerides_spectral_research_notebook/"

[project.scripts]
ephemerides-spectral = "ephemerides_spectral.cli:main"

# srmech profile pattern (ADR-0001 §4 — entry-point discovery, Task #212).
# srmech.list_profiles() walks the "srmech.profiles" entry-point group at
# first call; this declaration makes ephemerides-spectral discoverable as
# the "ephemerides" profile. PR-a (this ship) is the simple-tier portion
# (catalogs + Python bridge). PR-b adds [profile.native] for the
# libephemerides_spectral plugin tier; PR-c migrates bridge call sites
# to exercise the ctypes path through srmech's loader.
[project.entry-points."srmech.profiles"]
ephemerides = "ephemerides_spectral"

# ───────────────────────────────────────────────────────────────────
# scikit-build-core
# ───────────────────────────────────────────────────────────────────
#
# CMake source dir is the parent of python/ — that's where
# CMakeLists.txt lives. The build compiles libephemerides_spectral
# from c/src/*.c and installs it into ephemerides_spectral/_native/
# (see _native_bip.py for the runtime discovery shim).

[tool.scikit-build]
cmake.source-dir = ".."
cmake.version = ">=3.23"
cmake.build-type = "Release"

# Python package included in the wheel alongside the CMake-installed
# native binary.
wheel.packages = ["ephemerides_spectral"]

# Make the wheel reproducible across rebuilds.
wheel.exclude = ["*.pyc", "__pycache__"]

# Sdist contents (pure-Python sources + CMake config + the C tree
# one directory up). `pip install ephemerides-spectral` from sdist
# can compile the C library locally.
sdist.include = [
    "ephemerides_spectral/**",
    "tests/**",
    "README.md",
    "CHANGELOG.md",
    "pyproject.toml",
    "../CMakeLists.txt",
    "../c/include/**",
    "../c/src/**",
    "../README.md",
    "../ROADMAP.md",
]
sdist.exclude = [
    "../c/build/**",
    "../.pytest_cache/**",
    "**/__pycache__/**",
]
