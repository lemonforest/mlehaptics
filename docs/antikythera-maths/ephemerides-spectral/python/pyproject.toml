[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "ephemerides-spectral"
version = "0.1.0"
description = "High-precision HDC reference instrument for the solar system based on JPL DE441"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{ name = "Steven Kirkland" }]
keywords = [
    "ephemeris",
    "spectral",
    "hyperdimensional-computing",
    "skyfield",
    "astronomy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
ephemeris  = ["skyfield>=1.46", "jplephem>=2.21"]
tests      = ["pytest>=7.0"]

[project.scripts]
ephemerides-spectral = "ephemerides_spectral.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ephemerides_spectral"]

[tool.hatch.build.targets.wheel.force-include]
"ephemerides_spectral/_data/manifest.json" = "ephemerides_spectral/_data/manifest.json"
