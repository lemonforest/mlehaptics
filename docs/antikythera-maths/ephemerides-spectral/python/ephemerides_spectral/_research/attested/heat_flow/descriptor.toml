# Sol Heat Flow Catalogue — per-body surface heat flow ↔ tidal-heating
# decomposition, authored through the AMSC literature_curated framework.
#
# v0.30.0rc10 attested-TOML backfill (cf. saturn_rings + solar_rotation +
# tidal_migration): the 6 per-body heat-flow rows shipped at v0.21.8 in the
# hand-coded `_research/heat_flow_data.py` module are now encoded a SECOND
# time through this AMSC path (descriptor + NDJSON + JSON Schema). The two
# paths' data dicts are diff-checked by tests/test_heat_flow_dual_author.py;
# byte-stable agreement is the evidence the descriptor schema expresses what
# the hand-coded @dataclass expresses.
#
# This backfill is the SECOND author of the heat_flow catalogue and follows
# directly from the v0.30.0rc9 CITATION REPAIR: the rc7 triality panel caught
# three broken citations in heat_flow's shipped data (khan_2023 -> the wrong
# DOI/lunar paper, tobie_2008 -> the Enceladus paper cited for Titan,
# veeder_2012 -> a paraphrased title), so heat_flow was held back from the
# rc7 batch backfill until those citations were corrected (rc9). All six
# per-row DOIs are now CrossRef-verified (the 3 rc9 repairs Frizzell 2023 /
# Tobie 2005 / Veeder 2012-title + the 3 pre-existing Davies 2010 / Vance
# 2018 / Howett 2011, all re-confirmed against live CrossRef 2026-06-07).

[source]
key = "heat_flow"
human_readable_name = "Sol Heat Flow Catalogue"
purpose = "ground-proof rows for per-body surface heat flow and its tidal / radiogenic / primordial-cooling decomposition (the v0.21.8 eighth cross-channel coupling surface)"
license = "literature-curated; per-row source DOIs cited"
homepage = "https://ssd.jpl.nasa.gov/"
canonical_doi = "10.1016/j.icarus.2012.04.004"

# canonical_doi points at Veeder et al. 2012, *Icarus* 219, 701-722 — the
# headline Io ~100 TW global-heat-flow measurement and the most prominent
# heat-flow datum in the set (CrossRef-verified: DOI resolves, title/author/
# year match). Per-row provenance is finer-grained: each row carries its own
# source_doi for the paper authorising its values.

[fetch]
adapter = "literature_curated"
ndjson_path = "heat_flow.ndjson"
# No endpoint / pagination / rate-limiting — literature_curated does no
# network I/O; the "fetch" reads the committed NDJSON at ndjson_path.

[parse]
# Every row must carry its own source_doi (per-row attestation).
require_per_row_source_doi = true

[schema]
data_schema_id = "heat_flow.heat_flow.v1"
data_schema_path = "heat_flow.schema.json"

[rendering]
cite_as_template = "Sol Heat Flow Catalogue (curated against published literature; per-row source DOIs Davies 2010 / Frizzell 2023 / Veeder 2012 / Vance 2018 / Howett 2011 / Tobie 2005); revision retrieved {retrieved_at:%Y-%m-%d}."
purpose_template = "ground-proof heat-flow row (Sol; per-body surface heat flow + tidal/radiogenic/primordial decomposition)"

[attestation]
hash_response = true
hash_algorithm = "sha256"
required_fields = [
    "source_doi",
    "source_url",
    "license",
    "retrieved_at",
    "response_sha256",
    "parser_version",
    "parser_rule_hash",
    "collector_descriptor_path",
    "collector_descriptor_hash",
]

# [gap_targeting] intentionally omitted: a per-body heat-flow magnitude +
# tidal/radiogenic/primordial fraction triple does not map onto any of the
# v0.24.9 dynamical-regime classifier labels (trajectory / temporal-quasi-
# periodic / bounded-local-Laplacian), so declaring one would be a forced
# fit. This source is not a schema-gap target for the v0.26.0 trigger.
