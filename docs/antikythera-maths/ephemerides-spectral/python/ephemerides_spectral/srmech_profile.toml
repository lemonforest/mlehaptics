# ephemerides_spectral srmech profile descriptor.
#
# ADR-0001 (srmech v0.3.x) §7 Step 2 — ephemerides-spectral plugin-
# profile POC, PR-a (simple-profile portion).
#
# This file declares ephemerides-spectral as a discoverable srmech
# profile. A user / LLM agent can do:
#
#     import srmech
#     eph = srmech.profile("ephemerides")
#     bodies = eph.list_bodies()
#     em = eph.get_em_state(jd_tdb=2451545.0)
#     audit = eph.attestation_audit("earthref_sc")
#
# instead of (or alongside) the existing:
#
#     from ephemerides_spectral import bridge
#     bodies = bridge.list_bodies()
#     em = bridge.get_em_state(jd_tdb=2451545.0)
#
# Both paths call the same underlying functions. The profile path adds
# srmech-mediated discovery + introspection + the tool-schema surface.
#
# Schema: docs/srmech/adr/0001-profile-pattern.schema.json
# Tier:   plugin. PR-a (v0.27.0) shipped [profile.bridge] +
#         [profile.smoke_test] + [profile.tool_schema]. PR-b (this
#         file, v0.28.0rc2) ships [profile.native] for the
#         libephemerides_spectral plugin tier; the ABI handshake
#         binds the native library at srmech.profile() activation
#         time. PR-c (v0.28.0rc3) migrates bridge call sites to
#         exercise the plugin-tier handle.

profile_schema_version = "1.0"

[profile]
name            = "ephemerides"
version         = "0.29.1rc1"
summary         = "Sol Star System spectral instrument — 52-body roster, 11 cross-channel coupling surfaces, native-C BIP encoder, AMSC-attested catalogs (Geodetic/EM/Magnetic/Fluid/Dynamical) anchored on JPL DE441"
package         = "ephemerides_spectral"
srmech_requires = ">=0.4.0"
homepage        = "https://github.com/lemonforest/mlehaptics/tree/main/docs/antikythera-maths/ephemerides-spectral"
license         = "GPL-3.0-or-later"

# ────────────────────────────────────────────────────────────────────────
# [profile.bridge]
#
# Curated subset of ephemerides_spectral.bridge.* — the full public
# surface is 166 functions; this profile exposes a representative
# 9-function set covering: introspection, time scales, dynamics
# (syzygies / breathing / ITN), electromagnetic state, and AMSC
# attested-catalog access.
#
# Profile authors can grow this surface in minor version bumps. The
# direct `from ephemerides_spectral import bridge` path remains
# unchanged for callers who want the full 166-function API.
# ────────────────────────────────────────────────────────────────────────

[profile.bridge]
# Version + body introspection
get_version             = "ephemerides_spectral.bridge:get_version"
list_bodies             = "ephemerides_spectral.bridge:list_bodies"

# Dynamics — syzygies (eclipse / alignment finder), breathing
# (parametric time-scale modulation), and the resonance-graph
# ITN-pathway search (low-Δv accessibility prediction).
find_syzygies           = "ephemerides_spectral.bridge:find_syzygies"
get_breathing_modulation = "ephemerides_spectral.bridge:get_breathing_modulation"
find_itn_chains         = "ephemerides_spectral.bridge:find_itn_chains"

# Electromagnetic state at epoch
get_em_state            = "ephemerides_spectral.bridge:get_em_state"

# AMSC attested-catalog access (powered by srmech.amsc internally
# post-Task-#197 refactor; profile-level surface makes them
# double-discoverable via srmech.profile("ephemerides") or via
# srmech's universal catalog bridge).
list_attested_sources   = "ephemerides_spectral.bridge:list_attested_sources"
get_attested_dataset    = "ephemerides_spectral.bridge:get_attested_dataset"
attestation_audit       = "ephemerides_spectral.bridge:attestation_audit"

# ────────────────────────────────────────────────────────────────────────
# [profile.smoke_test]
#
# Activation-time smoke test. Returns None on success; raises on
# failure. Cached at ~/.cache/srmech/profile_smoke_tests/
# ephemerides-<version>.toml.
# ────────────────────────────────────────────────────────────────────────

[profile.smoke_test]
callable = "ephemerides_spectral._srmech_smoke:smoke_test"

# ────────────────────────────────────────────────────────────────────────
# [profile.tool_schema]
#
# Tool-schema extension file registering the 9 bridge surfaces into
# srmech.amsc.tool_schema for LLM-agent discovery.
# ────────────────────────────────────────────────────────────────────────

[profile.tool_schema]
extension_file = "_srmech_tool_schema.toml"

# ────────────────────────────────────────────────────────────────────────
# [profile.native]
#
# Plugin-tier declaration (ADR-0001 §5). PR-b (v0.28.0rc2) wires the
# srmech-side loader: srmech.profile("ephemerides")._maybe_load_native()
# resolves the platform-specific shared library from the installed
# wheel via importlib.metadata.files("ephemerides-spectral"), opens it
# with ctypes.CDLL, calls es_abi_version(), and rejects the load if
# the runtime ABI doesn't match expected_abi_version below.
#
# ABI v9 = current. ABI history (mirror of c/include/ephemerides_spectral.h):
#   v1 — v0.3.1 baseline (encode-only).
#   v2 — v0.4.1 (es_patch_t / es_apply_patch / es_clear_patches).
#   v3 — v0.6.0 (es_breathing_modulation, es_find_syzygies).
#   v4 — v0.6.1 (es_complex64_t, es_channel_basis, splitmix64).
#   v5 — v0.7.0 (HD pipeline: es_encode_state_hd, es_bind_observer,
#       es_get_eclipse_probability).
#   v6 — v0.13.4 (JPL Power-of-Ten Rule 1 + Rule 3: caller-supplied
#       scratch buffers, no malloc/goto).
#   v7 — v0.15.0 (Sol Moon Times classical-roster completion;
#       ES_N_BODIES grew, per-body array wire-format changed).
#   v8 — v0.16.0 (Tier-1 BODIES expansion; ES_N_BODIES = 52, current).
#   v9 — v0.28.0rc5 (Phase 10a EOC C-side completion; added
#       ES_PATCH_KIND_ECCENTRICITY_CORRECTION + 3 trailing double
#       fields on es_patch_t for Newton-Kepler EOC parameters).
#   v10 — v0.29.0rc1 (channel-basis dual-path spike; added
#       ES_BASIS_METHOD_LEGACY/COSPI enum + es_channel_basis_method()
#       + es_has_native_cospi(); LEGACY route byte-identical to v9).
#
# The pure-Python Pyodide / WASM wheel does NOT ship a native library;
# srmech's loader raises InvalidProfileError on those installs and
# falls back to bridge.* calls through ephemerides_spectral's pure-
# Python BIP path. The wheel-tag is the only discriminator.
# ────────────────────────────────────────────────────────────────────────

[profile.native]
library              = "ephemerides_spectral"
install_path         = "ephemerides_spectral/_native"
abi_version_function = "es_abi_version"
expected_abi_version = 10

# ────────────────────────────────────────────────────────────────────────
# [profile.native.symbols]
#
# Curated symbol declarations. srmech v0.3.x binds by name only
# (loader at docs/srmech/python/srmech/profile_loader.py:815 — argtype
# binding is deferred per the loader's inline comment). Listing the
# symbols is forward-compatible and documents the intended plugin-
# tier surface for PR-c's bridge call-site migration.
#
# Subset rationale: introspection accessors (es_version, es_abi_version,
# es_n_bodies, es_body_index) + encoder hot path (es_encode_state,
# es_encode_at_jd, es_cos_lut, es_residue_to_radians). Tier-1 / Tier-2
# surfaces (es_find_syzygies, es_breathing_modulation,
# es_encode_state_hd, etc.) grow into this section as PR-c migrates
# them; the symbols table is incremental.
# ────────────────────────────────────────────────────────────────────────

[profile.native.symbols.es_version]
argtypes = []
restype  = "c_char_p"

[profile.native.symbols.es_abi_version]
argtypes = []
restype  = "c_int"

[profile.native.symbols.es_n_bodies]
argtypes = []
restype  = "c_int"

[profile.native.symbols.es_body_index]
argtypes = ["c_char_p"]
restype  = "c_size_t"

[profile.native.symbols.es_encode_state]
argtypes = ["c_double", "POINTER(c_uint32)"]
restype  = "c_int"

[profile.native.symbols.es_encode_at_jd]
argtypes = ["c_double", "POINTER(c_uint32)"]
restype  = "c_int"

[profile.native.symbols.es_cos_lut]
argtypes = ["c_uint32", "c_uint32"]
restype  = "c_int32"

[profile.native.symbols.es_residue_to_radians]
argtypes = ["c_uint32"]
restype  = "c_double"
