[build-system]
requires = ["scikit-build-core>=0.10", "cmake>=3.23"]
build-backend = "scikit_build_core.build"

[project]
name = "chess-spectral"
version = "1.17.0"
description = "Spectral lattice-fermion encoder for 2D and 4D chess (D4 / B4 symmetry, graph-Laplacian eigenbasis, 640-dim / 45 056-dim HDC)"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{ name = "Steven Kirkland" }]
keywords = [
    "chess",
    "spectral",
    "4d",
    "hyperdimensional-computing",
    "graph-laplacian",
    "oana-chiru",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Games/Entertainment :: Board Games",
    "Typing :: Typed",
]
# `chess` (python-chess) was promoted from a `[corpus]` optional extra
# to a runtime dependency in v1.6 alongside the engine.search package
# (PR-5). The engine's 2D search core uses chess.Board for move
# generation -- it's no longer optional. python-chess is a small,
# mature, pure-Python library (~1 MB, no native deps), Pyodide-
# compatible. The `[corpus]` extra below is retained as a no-op for
# back-compat with existing `pip install chess-spectral[corpus]`
# invocations.
dependencies = ["numpy", "scipy", "chess"]

[project.optional-dependencies]
corpus = ["chess"]   # no-op alias post-v1.6; chess is now a runtime dep
# Test-only deps for the 4D phase-operator validation gates (Phase C/D
# of the 4D phase-ops plan): python-chess4d-oana-chiru is the Python
# reference implementation of Oana & Chiru (2026), used as the spatial
# move-generation oracle by tests/test_phase_4d_occupation_aware.py
# and tests/test_phase_4d_check_detection.py. Not pulled into wheels.
test = ["python-chess4d-oana-chiru>=0.3.3"]

[project.urls]
Homepage = "https://github.com/lemonforest/mlehaptics/tree/main/docs/chess-maths/chess-spectral/python"
Repository = "https://github.com/lemonforest/mlehaptics"
Issues = "https://github.com/lemonforest/mlehaptics/issues"
Changelog = "https://github.com/lemonforest/mlehaptics/blob/main/docs/chess-maths/chess-spectral/python/CHANGELOG.md"
Roadmap = "https://github.com/lemonforest/mlehaptics/blob/main/docs/chess-maths/chess-spectral/ROADMAP.md"
"Notebook (2D)" = "https://github.com/lemonforest/mlehaptics/blob/main/docs/chess-maths/chess_spectral_research_notebook.md"
"Notebook (4D)" = "https://github.com/lemonforest/mlehaptics/blob/main/docs/chess-maths/chess_spectral_4d_notebook.md"

[project.scripts]
chess-spectral = "chess_spectral.cli:main"
chess-spectral-4d = "chess_spectral_4d.cli:main"

[tool.scikit-build]
# CMake source dir is the parent of python/ — that's where CMakeLists.txt
# lives. Build the spectral + spectral_4d native binaries and install
# them into chess_spectral/_native (see _find_c_binary in cli.py).
cmake.source-dir = ".."
cmake.version = ">=3.23"
cmake.build-type = "Release"

# Python packages to include in the wheel (alongside the CMake-installed
# native binaries).
wheel.packages = ["chess_spectral", "chess_spectral_4d"]

# Make the wheel reproducible across rebuilds by stamping mtimes.
wheel.exclude = ["*.pyc", "__pycache__"]

# Sdist contents (pure-Python sources + CMake config). The full C tree
# lives one directory up; we slot it in as a sub-include so `pip install
# chess-spectral` can compile from sdist.
sdist.include = [
    "chess_spectral/**",
    "chess_spectral_4d/**",
    "README.md",
    "CHANGELOG.md",
    "pyproject.toml",
    "../CMakeLists.txt",
    "../CMakePresets.json",
    "../include/**",
    "../src/**",
    "../vendor/**",
    "../ROADMAP.md",
    "../docs/**",
]
sdist.exclude = [
    "../build/**",
    "../.pytest_cache/**",
    "**/__pycache__/**",
]
