# Pure-Python build configuration for chess-spectral.
#
# This file produces a `chess_spectral-X.Y.Z-py3-none-any.whl` wheel
# containing only the Python sources — no `_native/spectral{.exe}`
# binaries. The wheel is installable in environments that can't run
# our platform-specific binaries:
#
#   * Pyodide / micropip in browsers (mobile + desktop). The Pyodide
#     runtime is single-process WASM with no fork/exec, so even if we
#     shipped emscripten binaries they couldn't be subprocess'd. The
#     pure wheel uses Python encoder paths exclusively, which work
#     end-to-end inside Pyodide.
#   * Less-common platforms where we don't ship a platform wheel
#     (e.g., fresh Linux ARM, BSDs). pip will resolve to py3-none-any
#     after exhausting platform candidates.
#
# Behavior on a pure-wheel install: ``_find_c_binary()`` returns None
# at every callsite, and the CLI / encoder API falls back to the pure-
# Python implementation (verified bit-for-bit equivalent to C output
# by ``test_c_py_parity*``). Slower than C — typically 30-60× — but
# correct.
#
# This file is built into a wheel via:
#     python -m build --wheel \
#         -C--build-backend-config-file=pyproject-pure.toml
# or by copying it to pyproject.toml in a clean staging dir before
# invoking `python -m build`. See the `build-pure-wheel` job in
# .github/workflows/chess-spectral-publish.yml for the exact
# invocation used in CI.
#
# IMPORTANT: keep ``[project]`` metadata in sync with the main
# pyproject.toml. The CI workflow grep-asserts version equality
# between the two files before building.

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "chess-spectral"
version = "1.12.0"
description = "Spectral lattice-fermion encoder for 2D and 4D chess (D4 / B4 symmetry, graph-Laplacian eigenbasis, 640-dim / 45 056-dim HDC)"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{ name = "Steven Kirkland" }]
keywords = [
    "chess",
    "spectral",
    "4d",
    "hyperdimensional-computing",
    "graph-laplacian",
    "oana-chiru",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Games/Entertainment :: Board Games",
    "Typing :: Typed",
]
# See pyproject.toml for the rationale; `chess` is a runtime dep
# from v1.6 onward. Pure-Python wheel keeps the same dep set as
# the platform wheels.
dependencies = ["numpy", "scipy", "chess"]

[project.optional-dependencies]
corpus = ["chess"]   # no-op alias post-v1.6
test = ["python-chess4d-oana-chiru>=0.3.3"]

[project.urls]
Homepage = "https://github.com/lemonforest/mlehaptics/tree/main/docs/chess-maths/chess-spectral/python"
Repository = "https://github.com/lemonforest/mlehaptics"
Issues = "https://github.com/lemonforest/mlehaptics/issues"
Changelog = "https://github.com/lemonforest/mlehaptics/blob/main/docs/chess-maths/chess-spectral/python/CHANGELOG.md"
Roadmap = "https://github.com/lemonforest/mlehaptics/blob/main/docs/chess-maths/chess-spectral/ROADMAP.md"
"Notebook (2D)" = "https://github.com/lemonforest/mlehaptics/blob/main/docs/chess-maths/chess_spectral_research_notebook.md"
"Notebook (4D)" = "https://github.com/lemonforest/mlehaptics/blob/main/docs/chess-maths/chess_spectral_4d_notebook.md"

[project.scripts]
chess-spectral = "chess_spectral.cli:main"
chess-spectral-4d = "chess_spectral_4d.cli:main"

[tool.hatch.build.targets.wheel]
# Include only the Python packages. Notably absent: the
# `chess_spectral/_native/` directory that scikit-build-core
# populates with platform-specific binaries in the main pyproject.
packages = ["chess_spectral", "chess_spectral_4d"]

[tool.hatch.build.targets.wheel.force-include]
# Include the .npz committed-tables that the encoder loads at
# runtime. They're data, not Python — hatchling needs the explicit
# include because they're not under a packages/ dir by default.
"chess_spectral/_committed_tables.npz" = "chess_spectral/_committed_tables.npz"
"chess_spectral/_committed_tables_4d.npz" = "chess_spectral/_committed_tables_4d.npz"

[tool.hatch.build.targets.wheel.shared-data]
# No shared data files in this build.

# No sdist target — the main pyproject.toml is the canonical sdist
# source. Pure-wheel sdist would be confusing (it would NOT build a
# pure-Python wheel from sdist; pip would invoke the main pyproject's
# scikit-build-core backend).
