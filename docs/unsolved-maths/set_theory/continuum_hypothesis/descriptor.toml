[source]
key                  = "continuum_hypothesis"
human_readable_name  = "Continuum Hypothesis (Hilbert's 1st problem; INDEPENDENT of ZFC)"
purpose              = "Cascade A o I o J o K o N o C o M applied to 11 axiom-system + cardinal-arithmetic entries. CH is INDEPENDENT of ZFC (Gödel 1940 + Cohen 1963). Documents the framework reading: independence IS Class K substrate-DoF inaccessibility within the ZFC substrate-instance; further axiom choices (V=L, MA, PFA, large cardinals, Woodin's Ultimate L) are Class C cascade-orientation transitions between substrate-instances. Note: this is also Hilbert's 1st problem (1900). Per [[feedback_no_lineage_claims_in_notebook]]."
license              = "CC0"
homepage             = "https://github.com/lemonforest/mlehaptics/tree/main/docs/unsolved-maths/set_theory/continuum_hypothesis"

