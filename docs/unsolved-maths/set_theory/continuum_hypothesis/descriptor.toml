cohen_1963           = "Cohen PJ (1963-64). The independence of the continuum hypothesis. Proc. Natl. Acad. Sci. USA 50:1143-1148; 51:105-110."
woodin_2010s         = "Woodin WH (2010-2020s). The Ultimate-L conjecture and the Continuum Hypothesis."
wikipedia_ch         = "Wikipedia (2026). Continuum hypothesis. https://en.wikipedia.org/wiki/Continuum_hypothesis"

