[source]
key                  = "biplanar_chromatic"
human_readable_name  = "Biplanar Graph Chromatic Spectrum Catalog"
purpose              = "Spectral chromatic data for graphs of thickness 2 (biplanar). Each record encodes a biplanar graph as a union of two planar subgraphs, Laplacian spectrum of each layer and their union, Hoffman spectral lower bound on chromatic number, best-rational approximation of the spectral ratio, and HDC coloring constraint verification. Primary research question: is max chromatic number of biplanar graphs 8 or 9? Class cascade: A-compose-L-compose-N-compose-M-compose-I."
license              = "CC0 (self-computed; mathematical objects are not copyrightable)"
homepage             = "https://github.com/lemonforest/mlehaptics/tree/main/docs/srmech/catalogs/biplanar_chromatic"

[source.primary_references]
beineke_harary_1965 = "Beineke LW, Harary F (1965). The thickness of the complete graph. Canadian Journal of Mathematics 17:850-859."
four_color_theorem   = "Appel K, Haken W (1976). Every planar map is four colorable. Bull. Amer. Math. Soc. 82(5):711-712."
hoffman_bound        = "Hoffman AJ (1970). On eigenvalues and colorings of graphs. In: Graph Theory and its Applications (ed. B. Harris), Academic Press, pp. 79-91."

[fetch]
adapter      = "literature_curated"
ndjson_path  = "biplanar_graphs.ndjson"

[parse]
natural_key = "graph_id"

[schema]
data_schema_id = "srmech.biplanar_chromatic.graph.v1"
ndjson_file    = "biplanar_graphs.ndjson"

[rendering]
name_template    = "Biplanar graph {graph_id}"
purpose_template = "Spectral chromatic analysis of {graph_id}: {n_vertices} vertices, Hoffman bound {hoffman_bound_exact}"
cite_as_template = "mlehaptics biplanar_chromatic catalog (srmech AMSC); graph {graph_id}; computed {retrieved_at}"

[attestation]
method      = "self-computed"
provenance  = "Generated by docs/srmech/catalogs/biplanar_chromatic/generate_catalog.py using srmech A/L/N/M/I primitive class cascade. Edge lists and chromatic numbers are mathematically exact; spectral values computed by srmech.amsc.laplacian.jacobi_eigvals."

[gap_targeting]
gap_label = "biplanar_chromatic_number"
