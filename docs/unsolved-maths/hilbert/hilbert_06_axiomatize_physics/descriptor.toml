provenance  = "Class A content-hash, Class H self-introspection (enumerate 14 classes A-N from srmech.amsc.tool_schema), per-domain cascade-composition inferred from existing framework spike-research + MFO notebook anchors. Cryptography-as-physics row attested to [[project_a_n_operators_are_harmonic_objects_themselves]] section B (defensive-scope only)."

[gap_targeting]
