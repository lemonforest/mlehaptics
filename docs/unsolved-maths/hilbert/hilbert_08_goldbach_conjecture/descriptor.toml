[source]
key                  = "hilbert_08_goldbach"
human_readable_name  = "Hilbert's 8th — Goldbach Conjecture Cascade Catalog"
purpose              = "srmech 14-class cascade applied to Goldbach's conjecture. For each even n in the dispatched range, record the Goldbach partition graph G_n (vertices = primes <= n, edges = (p,q) with p+q=n) and its Class L Laplacian spectrum, the Class M HDC signature of the spectrum, and the Hardy-Littlewood density-prediction comparison. Cascade composition: A-compose-J-compose-I-compose-L-compose-M. Per [[user_stance_fiber_as_spatially_absent_encoding]] the Goldbach loop is directly visible (most projection-visible of Hilbert's open problems), making it the natural first dispatch."
license              = "CC0 (self-computed; mathematical objects are not copyrightable)"
homepage             = "https://github.com/lemonforest/mlehaptics/tree/main/docs/unsolved-maths/hilbert/hilbert_08_goldbach_conjecture"

[source.primary_references]
hardy_littlewood_1923   = "Hardy GH, Littlewood JE (1923). Some problems of 'partitio numerorum'; III: On the expression of a number as a sum of primes. Acta Mathematica 44:1-70. Public domain."
oliveira_e_silva_2014   = "Oliveira e Silva T, Herzog S, Pardi S (2014). Empirical verification of the even Goldbach conjecture up to 4*10^18. Math. Comp. 83(288):2033-2060. AMS open access."
helfgott_2013_ternary   = "Helfgott HA (2013). The ternary Goldbach problem. arXiv:1312.7748 (OA preprint)."

[fetch]
adapter      = "literature_curated"
ndjson_path  = "goldbach_partition_graphs.ndjson"

[parse]
natural_key = "n_even"

[schema]
data_schema_id = "srmech.hilbert.goldbach.partition_graph.v1"

[rendering]
name_template    = "Goldbach partition graph for n = {n_even}"
purpose_template = "Class L spectrum of Goldbach partition graph G_{n_even}: {partition_count} partition pairs, Fiedler {fiedler_value}, spectral radius {spectral_radius}"
cite_as_template = "mlehaptics hilbert_08_goldbach catalog (srmech AMSC); n={n_even}; computed {retrieved_at}"

[attestation]
method      = "self-computed"
provenance  = "Generated by docs/unsolved-maths/hilbert/hilbert_08_goldbach_conjecture/generate_catalog.py using srmech A/J/I/L/M primitive class cascade. Primes enumerated via srmech.amsc.primes.is_prime (Class J). Partition pairs via Class I cyclic sum check. Graph Laplacian + eigenvalues via srmech.amsc.laplacian. HDC signature via srmech.amsc.hdc. Hardy-Littlewood density comparison computed against the closed-form 2*C2*n/(ln n)^2 * product correction (C2 = twin prime constant)."

[gap_targeting]
gap_label = "goldbach_conjecture"
