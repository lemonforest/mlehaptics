    <circle cx="5" cy="3" r="0.12"/>
    <line x1="5" y1="3.12" x2="5" y2="3.5" stroke="#ff3333" stroke-width="0.05"/>
    
    <circle cx="9" cy="5" r="0.12"/>
    <line x1="9" y1="5.12" x2="9" y2="5.5" stroke="#ff3333" stroke-width="0.05"/>
    
    <circle cx="7" cy="7" r="0.12"/>
    <line x1="7" y1="7.12" x2="7" y2="7.5" stroke="#ff3333" stroke-width="0.05"/>
  </g>

  <text x="5" y="7.8" text-anchor="middle" font-family="sans-serif" font-size="0.35" fill="black" font-weight="bold">Inherent Virtual Aperture: Amazon Sidewalk</text>
  <text x="5" y="0.4" text-anchor="middle" font-family="sans-serif" font-size="0.25" fill="gray">Sparse Network Nodes Resolving Macroscopic Seismic/Acoustic Waves</text>
