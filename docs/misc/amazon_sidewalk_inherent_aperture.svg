<svg width="600" height="500" viewBox="0 0 10 8" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="10" height="8" fill="#fcfcfc"/>
  
  <g stroke="gray" stroke-width="0.03" opacity="0.3">
    <line x1="0" y1="0" x2="0" y2="8"/>
    <line x1="2" y1="0" x2="2" y2="8"/>
    <line x1="4" y1="0" x2="4" y2="8"/>
    <line x1="6" y1="0" x2="6" y2="8"/>
    <line x1="8" y1="0" x2="8" y2="8"/>
    <line x1="10" y1="0" x2="10" y2="8"/>
    <line x1="0" y1="0" x2="10" y2="0"/>
    <line x1="0" y1="2" x2="10" y2="2"/>
    <line x1="0" y1="4" x2="10" y2="4"/>
    <line x1="0" y1="6" x2="10" y2="6"/>
    <line x1="0" y1="8" x2="10" y2="8"/>
  </g>

  <g stroke="purple" stroke-width="0.06" opacity="0.5" fill="none">
    <path d="M-1,1 Q4,3 11,0.5" stroke-dasharray="0.1,0.1"/>
    <path d="M-1,4 Q4,6 11,3.5" stroke-dasharray="0.1,0.1"/>
    <path d="M-1,7 Q4,9 11,6.5" stroke-dasharray="0.1,0.1"/>
    <text x="0.5" y="4.2" font-family="sans-serif" font-size="0.2" fill="purple" transform="rotate(-15 0.5,4.2)">Long-Wavelength Infrasound</text>
  </g>

  <g stroke="black" stroke-width="0.02">
    <rect x="0.6" y="0.6" width="0.8" height="0.8" fill="#e0f0ff"/>
    <polygon points="0.6,1.4 1,1.7 1.4,1.4" fill="#333"/>
    <rect x="2.6" y="0.6" width="0.8" height="0.8" fill="#e0f0ff"/>
    <polygon points="2.6,1.4 3,1.7 3.4,1.4" fill="#333"/>
    
    <rect x="4.6" y="2.6" width="0.8" height="0.8" fill="#e0f0ff"/>
    <polygon points="4.6,3.4 5,3.7 5.4,3.4" fill="#333"/>
    
    <rect x="8.6" y="4.6" width="0.8" height="0.8" fill="#e0f0ff"/>
    <polygon points="8.6,5.4 9,5.7 9.4,5.4" fill="#333"/>
    
    <rect x="6.6" y="6.6" width="0.8" height="0.8" fill="#e0f0ff"/>
