# RBS-LM substrate parameterization catalog — CANONICAL variant
#
# Validated by srmech.amsc.load_descriptor (srmech v0.4.4 + siona 0.0.2).
# Substrate parameters are nested under [fetch.literature_curated] so they
# round-trip through srmech's typed Descriptor accessor — no parallel
# Python loader needed (would re-introduce MVP magic the user just called out).
#
# Per [[feedback_no_mvp_framing]] + [[feedback_full_coverage_shipping_mpm_way]]:
# catalog is loaded via srmech.amsc.load_descriptor; hash via descriptor_hash;
# output measurements written as MPR-v1 NDJSON via write_ndjson.
#
# Per [[feedback_upstream_srmech_fixes_as_research_notes]]: a future
# 'substrate_parameterization' adapter (UPSTREAM_NOTES wishlist) would let
# srmech's cascade dispatch directly consume substrate params and run the
# characterization adapter. Until then this catalog rides on the
# 'literature_curated' adapter — substrate params ARE curated research
# parameters with F-numbered finding citations.

[source]
key                  = "rbs_lm_substrate_canonical"
human_readable_name  = "RBS-LM substrate parameterization (canonical full-coverage)"
purpose              = "Canonical AMSC catalog parameterizing the variable-length Klein-4 chirality-level sentence substrate. Every parameter that was a module-level constant in the R-RBS-LM-112..116 first-pass scripts is now an attested catalog field nested under [fetch.literature_curated]. The substrate characterization run (R-RBS-LM-122) loads this descriptor via srmech.amsc.load_descriptor, reads parameters off desc.fetch['literature_curated'], runs the measurement sweeps, and emits MPR-v1 NDJSON records via srmech.amsc.write_ndjson. Variants (smol_stack, etc.) override fields without re-declaring substrate library code."
license              = "CC0"
homepage             = "https://github.com/lemonforest/mlehaptics/tree/main/docs/srmech/catalogs/rbs_lm_substrate"

[source.primary_references]
rbs_lm_arc                = "docs/srmech/rbs_lm_research/ — F132 → F157 chirality-level sentence substrate arc"
substrate_library_canonical = "docs/srmech/rbs_lm_research/_canonical_substrate.py — catalog-driven substrate library; consumes srmech.amsc.Descriptor; pending upstream absorption per UPSTREAM_NOTES"
characterization_script   = "docs/srmech/rbs_lm_research/R-RBS-LM-122_substrate_characterization.py — full-coverage measurement loading this catalog via srmech.amsc"
f154_4x_ceiling           = "F154 — Klein-4 4× ceiling at exactly 4.00× (bit-density 2× × sectorization 2×)"
f155_chirality_levels     = "F155 — chirality sectors as 4 independent LEVEL channels (substrate.sector_count = 4)"
f156_sentence_generation  = "F156 — cross-level Klein-4 walk produces compositional novelty"
f157_v1_first_pass        = "F157 v1 — first-pass closure (R-RBS-LM-112..116) at MVP scope; preserved as historical record"
f162_full_coverage        = "F162 (pending) — full-coverage substrate characterization via this catalog; supersedes F157 v1 empirical claims"
srmech_amsc_descriptor    = "srmech v0.4.4 srmech.amsc.descriptor — load_descriptor + descriptor_hash + Descriptor dataclass; we consume these directly rather than re-implementing"

[fetch]
adapter      = "literature_curated"
ndjson_path  = "substrate_measurements/canonical.ndjson"

# ---------------------------------------------------------------------------
# Substrate parameters carried by the adapter — every former magic number
# ---------------------------------------------------------------------------
[fetch.literature_curated.substrate]
D                       = 8192     # hypervector dimension
sector_count            = 4        # Klein-4 chirality sectors (F132 + F155)
min_skeleton_length     = 4        # algebraic floor is 2; demo convention is 4
token_seed_hex_chars    = 8        # 32-bit; raise to 16 for V > ~1e6 vocab

[fetch.literature_curated.encoding]
backend                 = "klein4"
encoder_library         = "docs/srmech/rbs_lm_research/_canonical_substrate.py"
encoder_version         = "0.1.0"

[fetch.literature_curated.generation]
default_top_k                = 5
max_walk_length              = 30   # was hardcoded 10 in R-RBS-LM-112:170 — capped output at L=10
max_paths                    = 100  # was hardcoded 5 in R-RBS-LM-112:168 — capped diversity at 5
cycle_policy                 = "forbid"   # forbid (default), allow, count_limited
l4_direct_composition        = false      # was hardcoded special-case at L=4
skeleton_length_fallback     = []         # was hardcoded {4} fallback

[fetch.literature_curated.hierarchical]
n_buckets                   = 16
default_strategy            = "hash"
allowed_strategies          = ["hash", "first_bigram_hash", "sector_then_hash"]
sentence_hash_hex_chars     = 8

[fetch.literature_curated.corpus]
source                  = "template"   # template | hf_dataset | file | stdin
tokenizer               = "whitespace" # whitespace | python_tokenize | byte_level | bpe

[fetch.literature_curated.corpus.template]
module                  = "R-RBS-LM-113_larger_corpus_scaling.py"
default_distribution    = {L4 = 0.25, L5 = 0.25, L6 = 0.25, L7 = 0.25}

[fetch.literature_curated.grammar]
mode                    = "pos_template"  # pos_template | substrate_native | none
pos_source              = "vocab_categories"
allow_multi_class_pos   = true

[fetch.literature_curated.grammar.templates]
L4 = ["DET", "SUBJ", "VERB", "OBJ"]
L5 = ["DET", "SUBJ", "VERB", "PREP", "OBJ"]
L6 = ["DET", "SUBJ", "VERB", "PREP", "DET", "OBJ"]
L7 = ["DET", "SUBJ", "VERB", "PREP", "DET", "ADJ", "OBJ"]

[fetch.literature_curated.plausibility]
combination_mode        = "weighted_geometric_mean"
eps_smoothing           = 0.000001
skip_distances          = [2, 3]

[fetch.literature_curated.plausibility.weights]
bigram_freq             = 0.4
skip_gram               = 0.2
token_known             = 0.1
substrate_skel_sim      = 0.3

[fetch.literature_curated.measurement]
# recall_sample bounded to 500 after the 2026-05-29 canonical run ground for
# ~20 min on the single N=12800 full-corpus recall: full-corpus self-recall is
# O(N²·D) (each of N sentences argmax-compared against the full N×D matrix), so
# at N=12800 that is ~12330² × 8192 ≈ 1.2e12 element-compares for ONE data point.
# A bounded random sample of 500 estimates the recall rate to within sampling
# error well under the 1/N misclass granularity observed (recall has been
# exactly 1.000 at every measured N), without the quadratic wall-clock blowup.
# This is the catalog-parameter fix for the runtime balloon — NOT a C-path issue
# (HAS_NATIVE=True / ABI=3 confirmed); the cost was the measurement protocol.
recall_sample           = 500
seed                    = 42

[fetch.literature_curated.measurement.length_sweep]
values                  = [2, 3, 4, 5, 6, 7, 8, 9, 10, 12, 15, 18, 20, 25, 30]
n_per_length            = 50

[fetch.literature_curated.measurement.corpus_sweep]
values                  = [400, 800, 1600, 3200, 6400, 12800]

[fetch.literature_curated.measurement.dimension_sweep]
# D=32768 dropped after the canonical-catalog run died on 2026-05-28 partway
# through phase 3 at D=16384 → D=32768 (OOM most likely; cumulative numpy
# allocations across the prior D values held in scope). 8× dynamic range
# {2048, 4096, 8192, 16384} is sufficient to characterize substrate
# D-dependence; F154 4× ceiling validated D=8192 as the canonical operating
# point separately.
values                  = [2048, 4096, 8192, 16384]
fixed_n                 = 2000

[fetch.literature_curated.measurement.bucket_sweep]
values                  = [4, 8, 16, 32, 64, 128]

[fetch.literature_curated.measurement.top_k_sweep]
values                  = [5, 10, 20, 50, 100]

[fetch.literature_curated.measurement.perturbation_categories]
values                  = ["single_swap", "type_violation", "partial_shuffle", "full_random"]

[fetch.literature_curated.measurement.weight_sensitivity_configs]
baseline                 = {bigram_freq = 0.4, skip_gram = 0.2, token_known = 0.1, substrate_skel_sim = 0.3}
bigram_only              = {bigram_freq = 1.0, skip_gram = 0.0, token_known = 0.0, substrate_skel_sim = 0.0}
skip_only                = {bigram_freq = 0.0, skip_gram = 1.0, token_known = 0.0, substrate_skel_sim = 0.0}
token_only               = {bigram_freq = 0.0, skip_gram = 0.0, token_known = 1.0, substrate_skel_sim = 0.0}
substrate_only           = {bigram_freq = 0.0, skip_gram = 0.0, token_known = 0.0, substrate_skel_sim = 1.0}
balanced                 = {bigram_freq = 0.25, skip_gram = 0.25, token_known = 0.25, substrate_skel_sim = 0.25}
co_occurrence_heavy      = {bigram_freq = 0.6, skip_gram = 0.3, token_known = 0.05, substrate_skel_sim = 0.05}
substrate_heavy          = {bigram_freq = 0.1, skip_gram = 0.1, token_known = 0.1, substrate_skel_sim = 0.7}

# ---------------------------------------------------------------------------
# Standard AMSC tail
# ---------------------------------------------------------------------------
[parse]
natural_key = "measurement_id"

[schema]
data_schema_id = "srmech.rbs_lm.substrate_measurement.v1"
ndjson_file    = "substrate_measurements/canonical.ndjson"

[rendering]
name_template    = "RBS-LM substrate measurement '{measurement_id}'"
purpose_template = "Substrate characterization phase={phase} at config '{config_name}' (D={D}, max_walk={max_walk_length}, cycle_policy={cycle_policy})"
cite_as_template = "mlehaptics RBS-LM substrate catalog ('{measurement_id}') via srmech v{srmech_version}; descriptor_hash={descriptor_hash}; retrieved {retrieved_at}"

[attestation]
method     = "config_descriptor"
provenance = "Catalog parameterizes the canonical substrate library (docs/srmech/rbs_lm_research/_canonical_substrate.py) via srmech v0.4.4 AMSC machinery: load_descriptor for validation, descriptor_hash for attestation chain, write_ndjson for MPR-v1 output. Substrate parameters are nested under [fetch.literature_curated.*] so they round-trip through the typed Descriptor accessor — no parallel Python loader needed. Per [[feedback_no_mvp_framing]] + user direction 'catalogs are not new python script mvp magics; cascade is handled by srmech with the toml and MPR things': this catalog rides srmech's existing cascade. Same descriptor_hash + same srmech_version + same corpus → bit-exact reproducible measurements."

[gap_targeting]
gap_label = "rbs_lm_substrate_parameterization_canonical"
