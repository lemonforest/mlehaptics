# ---------------------------------------------------------------------------
# F225 multilingual extension config
# ---------------------------------------------------------------------------
[fetch.literature_curated.multilingual]
# --- PRED1: the N domain-anchors as a Class-L spectral similarity space ---
# Anchor build = F165 / R-RBS-LM-54f / R-RBS-LM-124 K1-flat path: the co-occurrence
# Laplacian (dense_laplacian) → top-K eigvecs (symmetric_eigendecompose) → top-M
# vocab each → bipolar-mint bundle (the F165-attested family-routing kernel). The
# N×N inter-anchor similarity → dense_laplacian → Fiedler split tests whether the
# Class-L spectrum recovers the known Abrahamic-vs-Eastern typological clustering.
anchor_D              = 8192   # bipolar-mint anchor dimension (F165/124 used 8192)
anchor_vocab_size     = 200    # top-V co-occurrence vocab per anchor (F124 K1 VOCAB_SIZE)
anchor_k_eig          = 33     # top-K eigvecs bundled (F124 K1 K_EIG)
anchor_m_vocab        = 21     # top-M vocab per eigvec (F124 K1 M_VOCAB)
anchor_window         = 5      # co-occurrence window (F124 K1 WINDOW)
anchor_token_budget   = 20000  # tokens per anchor (length-control across the 6 texts)

# --- PRED2: capacity multiplier vs inter-domain similarity ---
# F146/F222 HIER+DOM capacity harness (synthetic R-RBS-LM-113 corpus, structural
# length-domains), with the domain key-vector swapped from F222's ORTHOGONAL
# enc("__domain_d__") to (a) a parametric inter-domain-similarity SWEEP and (b) the
# REAL religious-text structured-anchor geometry. Measures whether the ×n_domains
# multiplier degrades gracefully as inter-domain similarity rises.
capacity_D            = 4096   # capped for tractability (F222 used 4096 at N=8192)
capacity_N            = 2048   # stored pairs (F222 regime where the multiplier is large)
capacity_n_buckets    = 32     # hierarchical fan-out (F222 best-case host)
capacity_window_k     = 5      # context window (F146/F222 WINDOW_K)
capacity_corpus_n     = 8000   # synthetic corpus sentences (F222 scaleup_corpus_n)
correlation_sweep     = [0.3, 0.6, 0.9]  # fraction of coords shared toward a common
                                          # root: 0.0=orthogonal (F222 baseline) →
                                          # 1.0=identical; the inter-domain-similarity knob
capacity_null_threshold = 0.05  # gain must DROP by > this from orthogonal→correlated
                                # for PRED2 (graceful-degradation) to clear

seed                  = 42      # deterministic / bit-exact (per-domain seeds via sha256)

# ---------------------------------------------------------------------------
# Standard AMSC tail
# ---------------------------------------------------------------------------
[parse]
