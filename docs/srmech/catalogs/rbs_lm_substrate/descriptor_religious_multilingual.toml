[schema]
data_schema_id = "srmech.rbs_lm.multilingual_anchor_classL.v1"
ndjson_file    = "substrate_measurements/multilingual_anchor_classL_similarity_space.ndjson"

[rendering]
name_template    = "RBS-LM multilingual anchor-as-Class-L '{measurement_id}'"
purpose_template = "Multilingual anchor Class-L spectral / capacity-vs-similarity for {phase}"
cite_as_template = "mlehaptics RBS-LM multilingual variant ('{measurement_id}') via srmech v{srmech_version}; descriptor_hash={descriptor_hash}; STRUCTURAL-ONLY per §VII.6.20"

[attestation]
method     = "config_descriptor"
provenance = "NEW variant for F225 (does NOT touch descriptor_religious_texts.toml). Reuses the 6 public-domain religious-text corpora (attested by content SHA-256, identical to the religious-texts variant), cached at ~/.cache/rbs_lm_corpora, re-fetchable from Project Gutenberg. Measurement consumes the canonical Klein-4 substrate library + the F146 HierarchicalMemory via srmech 0.5.0 native (ABI=3). STRUCTURAL/SPECTRAL READING ONLY per [[feedback_trauma_informed_defensive_scope]] + [[feedback_no_lineage_claims_in_notebook]]: texts + languages are structural test-objects; no doctrinal/truth/origin/ranking/linguistic/cognitive/BCI claims; MFO §VII.6.20 epistemic ceiling honored. The foreign-language (Fr/Es/Zh) extension is corpus-gated CONJECTURE-tier — NOT run. The test may return null (e.g. the §VII.6.20 translator-register degeneracy may dominate the Class-L spectrum over theological family); nulls count and refine the conjecture per [[feedback_dont_pre_commit_spike_query_operators]]."

[gap_targeting]
gap_label = "rbs_lm_substrate_religious_multilingual_classL_anchor"
