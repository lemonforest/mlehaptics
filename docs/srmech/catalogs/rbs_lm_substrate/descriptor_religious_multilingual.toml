# RBS-LM substrate catalog — MULTILINGUAL extension variant (F225 / R-RBS-LM-225)
#
# NEW descriptor (does NOT touch descriptor_religious_texts.toml). Same substrate
# library (_canonical_substrate.py), same srmech 0.5.0 Klein-4 machinery, same MPR
# attestation, same 6 public-domain religious-text corpora — a DIFFERENT measurement
# config: the MULTILINGUAL extension of the teaching ≡ bilingualism conjecture.
#
# Research question (F225, extends F224's bilingual decisive test): F224 tests
# BILINGUAL = 2 anchors (which can be ~orthogonal). MULTILINGUAL = N anchors with a
# GRADED SIMILARITY STRUCTURE — languages cluster typologically. THE KEY INSIGHT:
# an anchor axis (language OR depth) is NOT a basis of orthogonal labels — it is a
# SIMILARITY-STRUCTURED space = a Class-L spectral graph. That is exactly what F221
# found on the DEPTH axis (depth-bands pairwise sim ~0.25; non-orthogonal; share
# sectors). So MULTILINGUAL puts the LANGUAGE axis into the SAME non-orthogonal
# regime the DEPTH axis already lives in → the apples-to-apples test of teaching ≡
# bilingual ≡ multilingual.
#
# CORPUS-GATE HONESTY (load-bearing): genuine foreign-language corpora (En↔Fr/Es/Zh)
# are GATED (not on disk). The runnable analog is the N=6 religious-text typological
# clustering: Abrahamic = {Quran, KJV-OT, KJV-NT} vs Eastern = {Gita, Tao, Dhammapada}
# (the R-RBS-LM-53a/b/c/e corpora). The foreign-language path is the corpus-gated
# CONJECTURE-tier extension; no foreign-language claim is made.
#
# SCOPE DISCIPLINE (load-bearing): structural/spectral reading ONLY. No doctrinal /
# truth / origin / ranking / linguistic / cognitive / BCI claims, per
# [[feedback_no_lineage_claims_in_notebook]] + [[feedback_trauma_informed_defensive_scope]].
# Texts + languages are STRUCTURAL TEST-OBJECTS. MFO §VII.6.20 honored: form-claims
# only; substrate-identity/meaning requires a DOMAIN anchor and is ceiling-bounded.

[source]
key                  = "rbs_lm_substrate_religious_multilingual"
human_readable_name  = "RBS-LM substrate — multilingual anchor-as-Class-L-similarity-space (F225, 6 corpora)"
purpose              = "Catalog variant for F225 (R-RBS-LM-225): the MULTILINGUAL extension of teaching ≡ bilingualism. Tests whether the N-domain anchor axis is a recoverable similarity-structured Class-L spectral space (PRED1: N×N domain-anchor similarity → dense_laplacian → Fiedler → recover Abrahamic-vs-Eastern?) and whether the F222 ×n_domains effective-capacity multiplier degrades gracefully with inter-domain similarity (PRED2). Reuses the 6 R-RBS-LM-53 religious-text corpora as the runnable typological-clustering analog for the corpus-gated foreign-language (Fr/Es/Zh) conjecture. Structural-only; §VII.6.20 ceiling honored."
license              = "CC0 for the catalog; corpora are public-domain open translations (Project Gutenberg / public translations)"
homepage             = "https://github.com/lemonforest/mlehaptics/tree/main/docs/srmech/catalogs/rbs_lm_substrate"

[source.primary_references]
f224_bilingual_decisive = "F224 (R-RBS-LM-224) — the bilingual decisive head-to-head; 2-anchor case this generalizes to N"
f165_domain_anchor      = "F165 (R-RBS-LM-125/54f) — the labeled DOMAIN anchor; family routing 6/6, within-family at the degeneracy (contrast 1.12)"
f222_capacity_multiplier = "F222 (R-RBS-LM-222) — the F165 DOMAIN-anchor orthogonalization persists to N=8192 (+0.388) as a ~×n_domains effective-capacity multiplier (assumes ORTHOGONAL domains)"
f221_depth_nonorthogonal = "F221 (R-RBS-LM-221) — depth-bands are NON-orthogonal (pairwise sim ~0.243/0.250/0.252; share sectors); top-k separation vanished — the regime this puts the language axis into"
rbs_lm_53_clustering    = "R-RBS-LM-53 SUMMARY (53e/53f/53h) — cross-religion clustering: family-specificity 1.24, coherence ratio 1.57; translator-stability dominates (KJV-OT↔NT 0.428; Quran Sale↔Rodwell 0.392)"
mfo_VII_6_20            = "MFO §VII.6.20 — epistemic ceiling: cascade reads form, not substrate-identity; the ceiling this variant respects"
religious_texts_catalog = "docs/srmech/catalogs/rbs_lm_substrate/descriptor_religious_texts.toml — the sibling variant (F224 owns it; NOT touched here)"

[fetch]
adapter      = "literature_curated"
ndjson_path  = "substrate_measurements/multilingual_anchor_classL_similarity_space.ndjson"

# ---------------------------------------------------------------------------
# Substrate parameters — same Klein-4 substrate as canonical / religious-texts
# ---------------------------------------------------------------------------
[fetch.literature_curated.substrate]
D                       = 8192
sector_count            = 4
min_skeleton_length     = 4
token_seed_hex_chars    = 16   # real-text vocab is large (10k+ types)

[fetch.literature_curated.encoding]
backend                 = "klein4"
encoder_library         = "docs/srmech/rbs_lm_research/_canonical_substrate.py"
encoder_version         = "0.1.0"

# ---------------------------------------------------------------------------
# Corpus source — the SAME 6 religious texts (3 Abrahamic + 3 Eastern), attested
# by content SHA-256. (Identical SHA-256s to descriptor_religious_texts.toml; the
# corpora are shared, the measurement config is what differs.)
# ---------------------------------------------------------------------------
[fetch.literature_curated.corpus]
source                  = "religious_text_kernels"
tokenizer               = "whitespace"
cache_dir               = "~/.cache/rbs_lm_corpora"
strip_gutenberg         = true
unit                    = "verse_line"

# typological-family grouping (the runnable analog for language-family clustering)
[fetch.literature_curated.corpus.families]
abrahamic = "abrahamic"
eastern   = "eastern"

[fetch.literature_curated.corpus.texts.quran_yusuf_ali]
