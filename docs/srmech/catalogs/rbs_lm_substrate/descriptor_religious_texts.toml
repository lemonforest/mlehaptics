# RBS-LM substrate catalog — religious-texts variant (28D chirality revisit)
#
# Variant of the canonical rbs_lm_substrate catalog. Same substrate library
# (_canonical_substrate.py), same srmech 0.5.0 Klein-4 machinery, same MPR
# attestation — different corpus source (6 real religious texts) + a
# chirality-signature measurement config.
#
# Research question (per user direction 2026-05-29): the R-RBS-LM-53 arc found
# the big-3 Abrahamic texts FLAT-SPECTRAL-IDENTICAL (diagonal/off-diagonal
# similarity ratio 0.99 — MFO §VII.6.20 epistemic ceiling). Does the 28D
# bi-axial chirality decomposition (F158) LIFT that degeneracy — i.e., do texts
# that look identical under flat similarity DIFFER along the chirality axes?
#
# SCOPE DISCIPLINE (load-bearing): structural/spectral reading ONLY. No
# doctrinal claims, no ranking of texts, no truth/origin/supersession claims
# per [[feedback_no_lineage_claims_in_notebook]] + [[feedback_trauma_informed
# _defensive_scope]]. Texts are STRUCTURAL TEST-OBJECTS. §VII.6.20 honored:
# form-claims only; substrate-identity/meaning still requires a DOMAIN anchor.

[source]
key                  = "rbs_lm_substrate_religious_texts"
human_readable_name  = "RBS-LM substrate — religious-texts 28D chirality revisit (6 corpora)"
purpose              = "Catalog variant feeding 6 open religious texts (3 Abrahamic + 3 Eastern) through the canonical Klein-4 chirality substrate to test whether the 28D bi-axial chirality decomposition lifts the flat-spectral structural degeneracy R-RBS-LM-53 found (ratio 0.99). Phase 1: per-text 28D chirality signature + cross-text discrimination. Phase 2: cross-navigation (grammar of one text walked via relational structure of another) as F156 Mode D generalized to whole-text structure. Structural-only; §VII.6.20 ceiling honored."
license              = "CC0 for the catalog; corpora are public-domain open translations (Gutenberg / public translations)"
homepage             = "https://github.com/lemonforest/mlehaptics/tree/main/docs/srmech/catalogs/rbs_lm_substrate"

[source.primary_references]
rbs_lm_53_arc          = "docs/srmech/rbs_lm_research/R-RBS-LM-53_SUMMARY_REPORT.md — the flat-spectral 0.99 identity finding + DOMAIN-anchor framework (F44-F50)"
f158_28d_chirality     = "F158 — 28D bi-axial chirality (14 A-N × 2 axes = 4 sectors × 7 G2); the lens this variant applies"
f164_grammar_native    = "F164 — grammar is substrate-native; chirality sectors ARE grammatical-hierarchy levels (the basis for cross-navigation)"
f142_chirality_pure    = "F142 — chirality discriminates WHERE chirality is the load-bearing distinction; the null-risk this variant must honestly face"
mfo_VII_6_20           = "MFO §VII.6.20 — epistemic ceiling: cascade reads form, not substrate-identity; the ceiling this variant probes"
canonical_catalog      = "docs/srmech/catalogs/rbs_lm_substrate/descriptor.toml — the canonical variant this derives from"

[fetch]
adapter      = "literature_curated"
ndjson_path  = "substrate_measurements/religious_texts.ndjson"

# ---------------------------------------------------------------------------
# Substrate parameters — same as canonical (Klein-4, D=8192, ABI=3 native)
# ---------------------------------------------------------------------------
[fetch.literature_curated.substrate]
D                       = 8192
sector_count            = 4
min_skeleton_length     = 4
token_seed_hex_chars    = 16   # raised from 8: real-text vocab is large (10k+ types)

[fetch.literature_curated.encoding]
backend                 = "klein4"
encoder_library         = "docs/srmech/rbs_lm_research/_canonical_substrate.py"
encoder_version         = "0.1.0"

[fetch.literature_curated.generation]
default_top_k                = 10
max_walk_length              = 30
max_paths                    = 100
cycle_policy                 = "allow"   # real prose repeats tokens; allow cycles in the walk
l4_direct_composition        = false
skeleton_length_fallback     = []

[fetch.literature_curated.hierarchical]
n_buckets                   = 16
default_strategy            = "hash"
allowed_strategies          = ["hash", "first_bigram_hash", "sector_then_hash"]
sentence_hash_hex_chars     = 16

# ---------------------------------------------------------------------------
# Corpus source — 6 religious texts (cached; attested by content SHA-256)
# ---------------------------------------------------------------------------
[fetch.literature_curated.corpus]
