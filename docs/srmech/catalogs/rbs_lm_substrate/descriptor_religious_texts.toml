# ---------------------------------------------------------------------------
# Chirality-signature measurement (Phase 1) — the 28D revisit config
# ---------------------------------------------------------------------------
[fetch.literature_curated.chirality_signature]
# Per-text signature components computed against the text's aggregate Klein-4
# encoding. The flat-spectral baseline (bundle similarity) reproduces the 0.99
# R-RBS-LM-53 result; the chirality components test whether resolving along the
# (γ₅, iω₇) axes lifts the degeneracy.
n_units_per_text        = 2000     # sample N verse-lines per text (balanced across texts)
seed                    = 42
sector_routing          = "bigram_parity"   # route bigrams to sectors by word-order parity
                                             # (forward/reverse presence) so sector occupancy
                                             # carries word-order STRUCTURE, not token hash.
                                             # "hash" = null-control (uniform sectors expected).
chirality_ops           = ["gamma5_flip", "omega7_flip", "cpt_mirror"]
compute_flat_baseline   = true     # reproduce the 0.99 flat-similarity matrix for comparison

# ---------------------------------------------------------------------------
# Cross-navigation (Phase 2) — grammar(A) walked via logic(B)
# ---------------------------------------------------------------------------
[fetch.literature_curated.cross_navigation]
enabled                 = true
# For each ordered pair (A, B): take A's sector-hierarchy (grammar) and walk it
# using B's bigram-adjacency (logic). Measure coherence + breakpoints + the
# hybrid's chirality signature. F156 Mode D generalized.
max_pairs               = 30       # all ordered pairs of 6 texts = 30
sample_seeds_per_pair   = 20

# ---------------------------------------------------------------------------
# Emergent-perplexity profile (F168) — resolution-level = chirality-sector depth
# ---------------------------------------------------------------------------
[fetch.literature_curated.emergent_perplexity]
# F168 test: read perplexity off the RESOLUTION-LEVEL profile, NOT a forced
# softmax. The n-gram orders ARE the F155 structural levels = the chirality
# sectors (word=order1, bigram=order2, ... long-range=higher). Backoff-accuracy
# as a function of max-order is the emergent profile: the order beyond which it
# plateaus is the corpus's resolution DEPTH (its emergent perplexity profile).
# Per-text = domain-anchored (each labeled kernel its own domain, F165); the
# template corpus is the SHALLOW-structure control (Step 4 plateaued at order 2).
# Prediction (F168 §5): real long-range corpora keep gaining accuracy at higher
# orders (deeper sectors populate) where the template plateaus. Null counts.
max_order               = 6      # resolution levels (sectors) to profile (unigram..6-gram)
n_units_per_text        = 4000   # verse-lines sampled per text
held_out_fraction       = 0.5    # train-half / test-half (F163 §7 length-control)
test_positions          = 4000   # held-out positions scored per corpus
seed                    = 42
klein4_sector_demo      = true   # bind level-predictions into Klein-4 sectors; read occupancy

# ---------------------------------------------------------------------------
# Confound control (F169) — separate STORAGE structure from SURFACE repetition
# ---------------------------------------------------------------------------
[fetch.literature_curated.confound_control]
# F168 §5.1 caveat: resolution depth conflated intrinsic structure with
# repetition-density × data budget. This controls both: match TOKEN BUDGET and
# VOCAB across the real-language corpora, so resolution depth becomes a clean
# INTRINSIC (the STORAGE axis). Surface repetition (1 - distinct-trigram ratio of
# the corpus itself) is reported as the SEPARATE EXPRESSION/surface axis.
# Hypothesis (user 2026-05-29): storage and expression are SEPARABLE axes — if
# controlled storage-depth is ~invariant across expression styles while surface
# repetition varies independently, knowledge-storage is shared and only the
# arts-of-communication layer differs. Structural test on text objects ONLY;
# NOT a clinical claim about real cognition (§VII.6.20).
budget_tokens           = 12000    # matched token budget per corpus (auto-clamped to min available)
shared_vocab            = 600      # matched top-V vocab; rest → <unk> (auto-clamped to min available)
max_order               = 6
seed                    = 42

# ---------------------------------------------------------------------------
# Recipient-fiber retrieval-vs-render test (F214 / R-RBS-LM-214) — F212 §5
# ---------------------------------------------------------------------------
# F212 §5 test: condition the SAME fixed knowledge query on three recipient-
# absorption frames (ELI5 / peer / expert), each encoded as a Class-C orientation
# (hdc.klein4_chirality_flip_* — the rigid vector-level Class-C operators) bound
# into the F166 rolling context-state (the QUERY/hidden-state, NOT the render).
# Then measure whether RETRIEVAL/ADDRESSING shifts across the three frames vs
# only the final render: (1) Klein-4 SECTOR OCCUPANCY of the recipient-conditioned
# probe (F168 resolution-depth sectors), (2) the Class-L EIGEN-PROJECTION of the
# per-frame activation graph (dense_laplacian -> jacobi_eigvals; spectral distance
# across frames), (3) WHICH stored relationships (candidate continuations) the
# probe activates (ranked-set overlap across frames). A shape-matched RANDOM
# orientation control (n_random rigid random Klein-4 orientations bound the same
# way) is the noise floor: structured-frame spread must EXCEED random-frame spread
# to count as real steering.
#   Pre-stated null (F212 §5): "only the render differs; retrieval / sector-
#   occupancy / eigen-projection is INVARIANT across recipient frames" => naive
#   separable model holds (recipient is render-only).
#   Retrieval differs (beyond the random control) => recipient-fiber threads into
#   the QUERY/addressing => the RECIPIENT anchor must live in the F166 context-
#   state (CONFIRMS F212). Nulls count. STRUCTURAL test-objects ONLY; §VII.6.20.
[fetch.literature_curated.recipient_fiber]
demo_text          = "kjv_nt"  # F168: deepest sector structure -> most retrieval headroom for steering to surface
n_units            = 6000      # verse-lines sampled to build the bigram store + candidate sets
n_queries          = 400       # fixed held-out queries (context windows) scored per frame
window             = 5         # k-token context window (the F166 rolling state width)
min_candidates     = 3         # only score queries whose last token has >=3 legal successors (a real distribution)
top_k_activate     = 5         # ranked-set size for the "which relationships activate" overlap metric
n_random           = 16        # shape-matched random orientation control frames: enough pairwise
                               # distances to estimate the random-spread DISTRIBUTION (not a 3-sample
                               # point estimate), so the structured spread's noise-floor PERCENTILE is meaningful
noise_percentile   = 0.90      # structured pairwise spread must exceed this percentile of the random-spread
                               # distribution to count as a retrieval-shift beyond noise (honest gate)
seed               = 42

# ---------------------------------------------------------------------------
