# ---------------------------------------------------------------------------
[parse]
natural_key = "measurement_id"

[schema]
data_schema_id = "srmech.rbs_lm.religious_text_chirality.v1"
ndjson_file    = "substrate_measurements/religious_texts.ndjson"

[rendering]
