tokenizer               = "whitespace"
cache_dir               = "~/.cache/rbs_lm_corpora"
strip_gutenberg         = true     # strip PG header/footer boilerplate (per 53-arc strip_gutenberg)
unit                    = "verse_line"   # one structural unit per non-empty line (verse/aphorism)

