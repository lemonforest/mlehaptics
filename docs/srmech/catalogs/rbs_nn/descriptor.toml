license              = "CC0 (substrate content-mint is deterministic; mints are mathematical objects)"
homepage             = "https://github.com/lemonforest/mlehaptics/tree/main/docs/srmech/catalogs/rbs_nn"

[source.primary_references]
spike_170                       = "docs/srmech/notes/spike170_loe_rbs_hdc_architecture_design.md — RBS-HDC instrument architecture; D=8192; 10 strict-spec invariants verified."
