[fetch]
adapter      = "literature_curated"
ndjson_path  = "detection_heptad/m_bindings.ndjson"

[parse]
natural_key = "binding_id"

[schema]
data_schema_id = "srmech.rbs_nn.binding.v1"
ndjson_file    = "detection_heptad/m_bindings.ndjson"

[rendering]
name_template    = "RBS-NN binding '{binding_id}'"
purpose_template = "User-lexicon binding '{binding_id}' (kind={kind}, D={D}); re-mints deterministically from mint_name via Class A SHA-256 chain."
cite_as_template = "mlehaptics RBS-NN catalog (srmech AMSC); binding '{binding_id}' at D={D}; minted {minted_at}"

[attestation]
method      = "self-minted"
provenance  = "Class A content-mint via srmech.signal_processing.rbs_hdc_instrument.mint_vector(name, D=8192). Deterministic per Spike #170 invariant 1: same name + same D → same vector bit-exact. Vectors are NOT stored in the NDJSON; the mint_name field is the substrate-locus identifier; re-derive vectors on load. Compositional rows specify their composition expression in the 'composition' field; the composition re-evaluates deterministically from atomic mints."

[gap_targeting]
gap_label = "rbs_nn_arc"

