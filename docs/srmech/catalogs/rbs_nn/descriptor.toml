rbs_nn_research_v2              = "docs/srmech/rbs_nn_research/ — V2 operational arc (R-RBS-NN-10..-16) closed 2026-05-28 via Phase 6. Two-tier storage prototype + hierarchical bundling + chirality auto-detect + multi-step retrieval + interface polish. See PR #687."
architectural_pattern           = "docs/srmech/rbs_nn_research/ARCHITECTURAL_PATTERN_two_tier_klein4_polar.md — canonical two-tier RBS-NN architecture (Klein-4 Tier 1 + Polar Tier 2 + Class K bridge). HARD RULE: H2 chirality tag must be outermost cascade operation (per F-R16 Test 1)."
