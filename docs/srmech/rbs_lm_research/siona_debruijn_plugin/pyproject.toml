[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "siona-debruijn-plugin"
version = "0.1.0"
description = "A C-native de Bruijn walk exposed as a 3rd-party srmech profile plugin (F824)"
requires-python = ">=3.10"

# THE 3rd-party plugin hook: srmech's profile_loader enumerates this entry-point group at import.
[project.entry-points."srmech.profiles"]
siona_debruijn = "siona_debruijn_plugin"

[tool.setuptools]
packages = ["siona_debruijn_plugin"]

[tool.setuptools.package-data]
siona_debruijn_plugin = ["*.so", "*.dll", "*.dylib", "srmech_profile.toml"]
