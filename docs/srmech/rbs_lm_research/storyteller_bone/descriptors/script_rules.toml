# script_rules.toml -- per-SCRIPT seen-rules, UNICODE-CHARACTER-AWARE (F696 + F698).
# Every rule (the english/latin one INCLUDED) classifies characters by UNICODE CATEGORY (unicodedata), NOT ASCII:
#   word_char = Unicode letter|mark|number ; boundary = Unicode punct|space|symbol ; terminators = the Unicode set.
# Even 'plain English' is Unicode (café, naïve, smart quotes, em-dash, ellipsis). MECHANISM only; grammar = native speaker's (F282/F398/F650).

[script.latin]
has_case = true
word_sep = " "
clause_sep = ", "
sentence_sep = ". "
direction = "ltr"
word_segmentation = "unicode"  # runs of Unicode letter|mark|number (unicodedata), NOT ascii .split()
sentence_terminators = ".!?…"  # Unicode terminators (not the literal ". ")

[script.cjk]
has_case = false
word_sep = ""
clause_sep = "、"
sentence_sep = "。"
direction = "ltr"
word_segmentation = "unicode"  # runs of Unicode letter|mark|number (unicodedata), NOT ascii .split()
sentence_terminators = "。！？"  # Unicode terminators (not the literal ". ")

[script.arabic]
has_case = false
word_sep = " "
clause_sep = "، "
sentence_sep = "؟ "
direction = "rtl"
word_segmentation = "unicode"  # runs of Unicode letter|mark|number (unicodedata), NOT ascii .split()
sentence_terminators = "؟۔"  # Unicode terminators (not the literal ". ")

[script.egyptian]
has_case = false
word_sep = ""
clause_sep = ""
sentence_sep = ""
direction = "ltr-or-rtl"
word_segmentation = "unicode"  # runs of Unicode letter|mark|number (unicodedata), NOT ascii .split()
sentence_terminators = ""  # Unicode terminators (not the literal ". ")
