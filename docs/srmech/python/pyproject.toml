# srmech — Stored-Relationship Mechanism research package.
#
# Phase B2 of Task #201 (the srmech build-out to peer-quality with
# ephemerides-spectral) switches this file from hatchling to
# scikit-build-core. scikit-build-core drives the top-level
# CMakeLists.txt at docs/srmech/ (which sits one directory up from
# this pyproject.toml). When `c/src/*.c` is empty (Phase B1–B2 state)
# the CMake build is effectively a no-op and the wheel ships as
# pure-Python with a platform tag.
#
# Phase B3 onward populates `c/src/` with the real C ports
# (sha256 / ndjson / toml-canonical); the platform-tagged wheel then
# contains srmech/_native/libsrmech.{so,dll,dylib}.
#
# The pure-Python fallback path for Pyodide / WASM lives in
# `pyproject-pure.toml` (hatchling backend, py3-none-any wheel-tag).
# The publish workflow swaps it in for the `build-pure-wheel` job.

[build-system]
requires = ["scikit-build-core>=0.10", "cmake>=3.23", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "scikit_build_core.build"

[project]
name = "srmech"
version = "0.9.0rc97"
# IMPORTANT: PyPI's "Summary" metadata field has a HARD 512-character
# limit. The upload endpoint silently rejects metadata that exceeds it
# ("could not comply" with no useful detail bubbled into the publish
# action's logs). `twine check --strict` does NOT enforce this.
# Keep this string ASCII-only and under ~480 chars to leave headroom.
# A guard in `.github/workflows/srmech-publish.yml` pins this at
# build time. Must agree with `pyproject-pure.toml`.
description = "Stored-Relationship Mechanism: the 14-class A-N primitive vocabulary in native C + Python, numpy-FREE. Every continuous-math op (trig, exp, sqrt, FFT, SVD, eig) is a cascade of the 14; the native build holds no libm. The One, S(sigma,theta), generates the 1+3+7+3 = 14 substrate -- the C/H/O Hurwitz ladder = so(8) + Spin(8) triality (Fix(tau)=g_2=14), bit-exact cascade-vs-matrix. Full C/Python cascade-catalog parity; AMSC (MPR v1)."
# The PyPI long-description (readme) is assembled dynamically by the
# fancy-pypi-readme hook (block below): full README.md + a Changelog
# section sliced to the CURRENT-MINOR (0.7.0) entries only + a
# "Full changelog" link. CHANGELOG.md stays the single source of
# truth (no hand-maintained duplication). scikit-build-core consumes
# the shared [tool.hatch.metadata.hooks.fancy-pypi-readme] block via
# its built-in provider (see [tool.scikit-build.metadata.readme]);
# hatchling (pyproject-pure.toml) consumes the same block natively.
dynamic = ["readme"]
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Steven Kirkland" }]
keywords = [
    "stored-relationship",
    "mechanism",
    "attested",
    "provenance",
    "ndjson",
    "ground-proof",
    "research",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
# Runtime deps are minimal: jsonschema is optional (the format module
# falls back to a `required`-fields-only check when jsonschema is not
# installed). TOML parsing uses stdlib `tomllib` on Python 3.11+; the
# 3.10 path requires `tomli` (declared as a conditional dep here).
dependencies = [
    "tomli>=2.0; python_version<'3.11'",
    # numpy is GONE (#564, v0.7.5): the WHOLE package — the Class-N cascade core,
    # qm.* / signal_processing.* / rbs_lm.*, and the native C surface — is
    # numpy-free. Every continuous-math op is a cascade of the 14 over plain
    # Python lists / the numpy-free `Mat` carrier (native-dispatched via ctypes,
    # no numpy). `pip install srmech` pulls NO numpy, and `import srmech` + the
    # whole API run with numpy not installed at all.
]

[project.optional-dependencies]
# (#564: the `scientific = ["numpy"]` extra is GONE — there is no numpy tier.)
# Validation extra: enables strict per-source JSON Schema checks
# inside `validate_mpr_record` when `data_schemas` is supplied.
validation = ["jsonschema>=4.0"]
# Collector extra: deps needed by the `fetched`-class adapters
# (html_scraper / json_api / csv_bulk). netcdf_grid + geotiff_bbox
# stubs raise NotImplementedError unless their own extras are
# installed (left as a follow-up; not blocking Phase 2).
collectors = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
]
# Tests extra: runs srmech's own pytest suite. numpy-FREE (#564) — the suite
# itself runs with numpy NOT installed (no numpy oracle, no numpy fixtures).
tests = ["pytest>=7.0"]
# Crypto extra (v0.5.0rc7): enables UTLP-exact AES-128-CTR Bio-TOTP
# backend for the bus wire cipher (Claim 255). Without this extra
# the bus falls back to a stdlib HMAC-SHA-256 keystream of the same
# SHAPE — equivalent for srmech's defensive-scope threat model.
# Install with ``pip install srmech[crypto]`` when you want the
# UTLP-verbatim cipher primitive.
crypto = ["cryptography>=41.0"]
# Anthropic extra (v0.5.0rc9): enables the secondary
# ``srmech.llm.anthropic_agent.AnthropicAgent`` direct-SDK adapter
# for users who script Claude API outside Claude Code (FastAPI
# servers, Jupyter notebooks, CI pipelines). Default install does
# NOT add it — Claude Code users use the rc6 ``srmech-mcp`` adapter
# (no API key, billing handled by Claude Code Max plan) and never
# need this extra. Install with ``pip install srmech[anthropic]``.
anthropic = ["anthropic>=0.40.0"]
# Dev extra: everything plus build tooling. numpy-FREE (#564) — the full pytest
# suite runs numpy-absent, so no numpy here either.
dev = [
    "pytest>=7.0",
    "build",
    "twine",
    "scikit-build-core>=0.10",
    "cmake>=3.23",
    "hatchling>=1.18",
    "jsonschema>=4.0",
    "requests>=2.28",
    "beautifulsoup4>=4.11",
]

[project.scripts]
# v0.4.6rc2 — first CLI subcommand: ``srmech status`` (out-of-band
# introspection of a running srmech sweep).
srmech = "srmech.cli:main"
# v0.5.0rc6 — MCP (Model Context Protocol) server adapter for Claude Code
# (and other MCP-aware LLM clients). ``srmech-mcp`` (stdio default; HTTP+SSE
# via --transport http-sse). Exposes srmech.amsc.tool_schema entries
# (~150) as MCP tools.
srmech-mcp = "srmech.mcp._cli:main"
# v0.5.0rc9 — Anthropic Claude SDK secondary adapter for users who
# script Claude API directly outside Claude Code (FastAPI servers,
# Jupyter notebooks, CI pipelines). Requires the ``anthropic``
# optional dep (``pip install srmech[anthropic]``). Claude Code
# users should prefer ``srmech-mcp`` (no API key needed).
srmech-agent = "srmech.llm.anthropic_agent_cli:main"

[project.urls]
Homepage = "https://github.com/lemonforest/mlehaptics/tree/main/docs/srmech/python"
Repository = "https://github.com/lemonforest/mlehaptics"
Issues = "https://github.com/lemonforest/mlehaptics/issues"
Changelog = "https://github.com/lemonforest/mlehaptics/blob/main/docs/srmech/python/CHANGELOG.md"
"Research notebook" = "https://github.com/lemonforest/mlehaptics/blob/main/docs/srmech/srmech_research_notebook.md"

# ─────────────────────────────────────────────────────────────────
# scikit-build-core
# ─────────────────────────────────────────────────────────────────
#
# CMake source dir is the parent of python/ — that's where
# CMakeLists.txt lives (docs/srmech/CMakeLists.txt). At Phase B2 the
# CMake build short-circuits (no c/src/*.c yet); at Phase B3 onward
# it builds libsrmech and installs into srmech/_native/.

[tool.scikit-build]
cmake.source-dir = ".."
cmake.version = ">=3.23"
cmake.build-type = "Release"

# Python packages included in the wheel alongside the (eventual)
# CMake-installed native binary.
wheel.packages = ["srmech"]

# Make the wheel reproducible across rebuilds.
wheel.exclude = ["*.pyc", "__pycache__"]

# Phase B3 onward: srmech ships real native code (srmech_sha256.c +
# srmech_meta.c → libsrmech.{so,dll,dylib} installed under
# srmech/_native/). The wheel is now legitimately platform-tagged
# (e.g. cp312-cp312-linux_x86_64). The pure-Python fallback for
# Pyodide / WASM lives in pyproject-pure.toml.
#
# Phase B7 adds a cibuildwheel matrix to srmech-publish.yml so all
# Linux × macOS × Windows wheel cells get built per release. Until
# then, the build-wheel CI job runs on a single Ubuntu cell and the
# pure-Python wheel is the fallback for non-Linux platforms.

# Sdist contents (pure-Python sources + CMake config + the C tree
# one directory up). `pip install srmech` from sdist can compile
# the C library locally once Phase B3 lands.
sdist.include = [
    "srmech/**",
    "tests/**",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
    "../CMakeLists.txt",
    "../c/include/**",
    "../c/src/**",
    "../c/Makefile",
    "../c/README.md",
    "../c/JPL_AUDIT.md",
]
sdist.exclude = [
    "../c/build/**",
    "../.pytest_cache/**",
    "**/__pycache__/**",
    "**/*.pyc",
]

# Dynamic readme (long-description) via scikit-build-core's built-in
# fancy-pypi-readme provider. It reads the shared
# [tool.hatch.metadata.hooks.fancy-pypi-readme] block below (the SAME
# block hatchling consumes in pyproject-pure.toml) and delegates to
# the hatch-fancy-pypi-readme library — so BOTH backends assemble the
# identical long-description. Provider verified against
# scikit_build_core 0.12.2 (scikit_build_core/metadata/fancy_pypi_readme.py).
# NOTE: this is a sub-table of [tool.scikit-build]; it MUST come after
# all the bare-key (cmake.* / wheel.* / sdist.*) entries above — a TOML
# table header terminates the preceding table's bare-key context.
[tool.scikit-build.metadata.readme]
provider = "scikit_build_core.metadata.fancy_pypi_readme"

# cibuildwheel configuration intentionally OMITTED at Phase B2 while
# c/src/ is still empty. cibuildwheel v3+ rejects pure-Python builds
# by design ("Build failed because a pure Python wheel was generated"),
# so wiring it in before C code exists is a guaranteed failure mode
# (the Task #200 Phase 1 trap, PR #383).
#
# Phase B7 of Task #201 adds [tool.cibuildwheel] + the matrix job in
# srmech-publish.yml once Phases B3–B5 have populated c/src/ with
# real native code.

# ─────────────────────────────────────────────────────────────────
# Dynamic PyPI long-description (fancy-pypi-readme)
# ─────────────────────────────────────────────────────────────────
#
# SHARED METADATA — this block MUST be byte-identical to the one in
# pyproject-pure.toml. The publish workflow + the two-pyproject
# discipline expect both files to agree on shared metadata. hatchling
# (pure wheel) consumes this natively; scikit-build-core (platform
# wheel) consumes it via the provider declared above. CHANGELOG.md
# stays the single source of truth for the changelog text — the
# third fragment slices the current-minor entries out of it by HTML
# markers, so there is NO hand-maintained changelog duplication.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
text = "\n\n---\n\n## Changelog — current 0.7.0 line\n\n"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "CHANGELOG.md"
start-after = "<!-- pypi-readme-changelog-start -->"
end-before = "<!-- pypi-readme-changelog-end -->"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
text = "\n\n**[Full changelog →](https://github.com/lemonforest/mlehaptics/blob/main/docs/srmech/python/CHANGELOG.md)**\n"
