# srmech — Stored-Relationship Mechanism research package.
#
# Phase B2 of Task #201 (the srmech build-out to peer-quality with
# ephemerides-spectral) switches this file from hatchling to
# scikit-build-core. scikit-build-core drives the top-level
# CMakeLists.txt at docs/srmech/ (which sits one directory up from
# this pyproject.toml). When `c/src/*.c` is empty (Phase B1–B2 state)
# the CMake build is effectively a no-op and the wheel ships as
# pure-Python with a platform tag.
#
# Phase B3 onward populates `c/src/` with the real C ports
# (sha256 / ndjson / toml-canonical); the platform-tagged wheel then
# contains srmech/_native/libsrmech.{so,dll,dylib}.
#
# The pure-Python fallback path for Pyodide / WASM lives in
# `pyproject-pure.toml` (hatchling backend, py3-none-any wheel-tag).
# The publish workflow swaps it in for the `build-pure-wheel` job.

[build-system]
requires = ["scikit-build-core>=0.10", "cmake>=3.23"]
build-backend = "scikit_build_core.build"

[project]
name = "srmech"
version = "0.2.0"
# IMPORTANT: PyPI's "Summary" metadata field has a HARD 512-character
# limit. The upload endpoint silently rejects metadata that exceeds it
# ("could not comply" with no useful detail bubbled into the publish
# action's logs). `twine check --strict` does NOT enforce this.
# Keep this string ASCII-only and under ~480 chars to leave headroom.
# A guard in `.github/workflows/srmech-publish.yml` pins this at
# build time. Must agree with `pyproject-pure.toml`.
description = "Stored-Relationship Mechanism research package: home of the Attested Multi-Source Collector/Catalog (AMSC) framework — Mathematical Provenance Record v1 on-disk format, descriptor TOML loader, six adapters (html/json/csv/netcdf/geotiff/literature), universal catalog bridge with register_attested_root cross-package overlay, and schema-gap-driven trigger. Native C dispatch (SHA-256 + NDJSON line reader) with pure-Python fallback for Pyodide / WASM."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{ name = "Steven Kirkland" }]
keywords = [
    "stored-relationship",
    "mechanism",
    "attested",
    "provenance",
    "ndjson",
    "ground-proof",
    "research",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
# Runtime deps are minimal: jsonschema is optional (the format module
# falls back to a `required`-fields-only check when jsonschema is not
# installed). TOML parsing uses stdlib `tomllib` on Python 3.11+; the
# 3.10 path requires `tomli` (declared as a conditional dep here).
dependencies = [
    "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
# Validation extra: enables strict per-source JSON Schema checks
# inside `validate_mpr_record` when `data_schemas` is supplied.
validation = ["jsonschema>=4.0"]
# Collector extra: deps needed by the `fetched`-class adapters
# (html_scraper / json_api / csv_bulk). netcdf_grid + geotiff_bbox
# stubs raise NotImplementedError unless their own extras are
# installed (left as a follow-up; not blocking Phase 2).
collectors = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
]
# Tests extra: runs srmech's own pytest suite.
tests = ["pytest>=7.0"]
# Dev extra: everything plus build tooling.
dev = [
    "pytest>=7.0",
    "build",
    "twine",
    "scikit-build-core>=0.10",
    "cmake>=3.23",
    "hatchling>=1.18",
    "jsonschema>=4.0",
    "requests>=2.28",
    "beautifulsoup4>=4.11",
]

[project.urls]
Homepage = "https://github.com/lemonforest/mlehaptics/tree/main/docs/srmech/python"
Repository = "https://github.com/lemonforest/mlehaptics"
Issues = "https://github.com/lemonforest/mlehaptics/issues"
Changelog = "https://github.com/lemonforest/mlehaptics/blob/main/docs/srmech/python/CHANGELOG.md"
"Research notebook" = "https://github.com/lemonforest/mlehaptics/blob/main/docs/srmech/srmech_research_notebook.md"

# ─────────────────────────────────────────────────────────────────
# scikit-build-core
# ─────────────────────────────────────────────────────────────────
#
# CMake source dir is the parent of python/ — that's where
# CMakeLists.txt lives (docs/srmech/CMakeLists.txt). At Phase B2 the
# CMake build short-circuits (no c/src/*.c yet); at Phase B3 onward
# it builds libsrmech and installs into srmech/_native/.

[tool.scikit-build]
cmake.source-dir = ".."
cmake.version = ">=3.23"
cmake.build-type = "Release"

# Python package included in the wheel alongside the (eventual)
# CMake-installed native binary.
wheel.packages = ["srmech"]

# Make the wheel reproducible across rebuilds.
wheel.exclude = ["*.pyc", "__pycache__"]

# Phase B3 onward: srmech ships real native code (srmech_sha256.c +
# srmech_meta.c → libsrmech.{so,dll,dylib} installed under
# srmech/_native/). The wheel is now legitimately platform-tagged
# (e.g. cp312-cp312-linux_x86_64). The pure-Python fallback for
# Pyodide / WASM lives in pyproject-pure.toml.
#
# Phase B7 adds a cibuildwheel matrix to srmech-publish.yml so all
# Linux × macOS × Windows wheel cells get built per release. Until
# then, the build-wheel CI job runs on a single Ubuntu cell and the
# pure-Python wheel is the fallback for non-Linux platforms.

# Sdist contents (pure-Python sources + CMake config + the C tree
# one directory up). `pip install srmech` from sdist can compile
# the C library locally once Phase B3 lands.
sdist.include = [
    "srmech/**",
    "tests/**",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
    "../CMakeLists.txt",
    "../c/include/**",
    "../c/src/**",
    "../c/Makefile",
    "../c/README.md",
    "../c/JPL_AUDIT.md",
]
sdist.exclude = [
    "../c/build/**",
    "../.pytest_cache/**",
    "**/__pycache__/**",
    "**/*.pyc",
]

# cibuildwheel configuration intentionally OMITTED at Phase B2 while
# c/src/ is still empty. cibuildwheel v3+ rejects pure-Python builds
# by design ("Build failed because a pure Python wheel was generated"),
# so wiring it in before C code exists is a guaranteed failure mode
# (the Task #200 Phase 1 trap, PR #383).
#
# Phase B7 of Task #201 adds [tool.cibuildwheel] + the matrix job in
# srmech-publish.yml once Phases B3–B5 have populated c/src/ with
# real native code.
