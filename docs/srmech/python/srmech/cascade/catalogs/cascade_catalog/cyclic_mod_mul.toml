# Cascade catalog entry: cyclic_mod_mul
# v0.9.0rc302 (§110 / #1460) — the Class-I modular family joins the cascade
# catalog so a modular-arithmetic cascade (an LCG, a hash) can be DECLARED via
# the DSL, not only hand-composed in Python. Peer of cyclic_gcd.

[cascade]
name = "cyclic_mod_mul"
class_composition = "I"
kind = "stage"
purpose = "Class I modular multiply (a * b) mod n — the multiply stage of an LCG cascade."
description = """
Cascade-namespace alias for the Class I modular multiply
srmech.amsc.cyclic.mod_mul: (a * b) mod n, overflow-safe via russian-peasant
doubling in C. Following the DSL chain contract the piped value is the first
positional argument `a` and the multiplier `b` + modulus `n` are bound stage
kwargs, so an LCG multiply stage reads
`.then("cyclic_mod_mul", b=MULT, n=MOD)` — the state flows through, `b`/`n` are
the fixed cascade parameters (the same data-first shape schur_complement uses
for boundary_idx).

Operands and modulus are bounded by uint64 (the fixed-64-bit ABI srmech_mod_mul
the primitive binds); use cyclic_mod_mul_wide for a > 64-bit modulus (the
PCG64 128-bit step). n must be > 0.

This is NOT a new primitive: it is a thin delegation to the already-
c_dispatched srmech.amsc.cyclic.mod_mul (which routes to srmech_mod_mul), so
it adds no native dispatch and no new C symbol — the cascade-catalog / DSL-
registration layer only (composition_of_c).
"""

[cascade.signature]
# Data-first (cf. schur_complement): a is positional — the DSL pipe fills it —
# while b and n are keyword-only bound stage kwargs.
input = "a: int (positional; the piped state); b: int multiplier (keyword-only, required); n: int modulus > 0 (keyword-only, required). All in uint64 range."
output = "int in [0, n) — (a * b) mod n"
operation = "(a * b) mod n"
non_negative_only = true
uint64_bounded = true
requires_n_positive = true
dsl_stage = "data-first; op=\"cyclic_mod_mul\" with b=<multiplier> and n=<modulus> bound"

[cascade.native]
# No dedicated cascade C symbol: the op delegates straight to the Class-I
# primitive's own native dispatch (srmech_mod_mul). composition_of_c — reaches
# C through cyclic.mod_mul, not a cascade-namespace wrapper.
status = "delegation (no dedicated cascade C symbol); the Class-I primitive srmech.amsc.cyclic.mod_mul dispatches to srmech_mod_mul"
abi_version = 8

[cascade.delegates_to]
class = "I"
primitive_c_symbol = "srmech_mod_mul"
primitive_python = "srmech.amsc.cyclic.mod_mul"
rationale = """
The cascade op carries no math of its own — the Class I primitive
srmech.amsc.cyclic.mod_mul owns the russian-peasant modular product and its
native dispatch to srmech_mod_mul. The cascade wrapper exists so the op is
DECLARABLE in a DSL chain / make_class descriptor and DISCOVERABLE in the
tool_schema by the words a caller searches ("modular multiply"). Rosetta
classification: composition_of_c (composes the c_dispatched cyclic.mod_mul).
"""

[cascade.boundary_cases]
zero_modulus = "n == 0 raises ValueError (forwarded from cyclic.mod_mul)."
out_of_uint64 = "operands / modulus beyond uint64 raise ValueError; use cyclic_mod_mul_wide for a wider modulus."
bool_input = "bool is a subclass of int but the primitive rejects it (isinstance guard); the pure path raises TypeError."

[cascade.attestation]
author = "Steven Kirkland"
license = "MIT"
parser_version = "srmech-cascade 0.9.0rc302"
canonical_landings = [
  "§110 / #1460 — the Class-I modular family becomes DSL-declarable (rc302)",
  "srmech.amsc.cyclic.mod_mul — the registered Class-I primitive home (c_dispatched via srmech_mod_mul)",
  "cyclic_gcd.toml — the Class-I cascade-catalog model this follows",
  "user_stance_cross_substrate_cascade_matching_as_research_method — a modular cascade (LCG) is one 14-class cascade shape",
]
