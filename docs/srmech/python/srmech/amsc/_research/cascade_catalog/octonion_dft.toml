# Cascade catalog entry: octonion_dft
# v0.7.0rc31 of the cascade-catalog — the OCTONION discrete Fourier transform
# (ODFT), #863 / F378 / F380. The (8:7) rung above the QDFT. Composite over
# the qm.octonion left/right-multiply atoms.
#
# The load-bearing honesty point: octonion multiplication is NON-ASSOCIATIVE
# (F378), so the two-sided ODFT is NOT UNIQUE — it must DECLARE a bracketing /
# association convention. Expressing it as a cascade is the right home: the
# association order becomes an EXPLICIT, ATTESTED field in this descriptor
# (the `bracketing` parameter), not a silent assumption.

[cascade]
name = "octonion_dft"
class_composition = "M ∘ C ∘ N"
purpose = "Octonion discrete Fourier transform (ODFT) — the (8:7) FFT-ladder rung above the QDFT. Composite over the qm.octonion multiply atoms. Carries the F378 octonion NON-ASSOCIATIVITY as an EXPLICIT declared `bracketing` field: the two-sided form is not unique, so the association order ((W_l·x)·W_r vs W_l·(x·W_r)) must be stated. One-sided forms round-trip; the two-sided form is forward-only."
description = """
Up the (2:1) → (4:3) → (8:7) FFT ladder only the COEFFICIENT ALGEBRA changes;
the cyclic "fast" structure is invariant (F379). The octonion rung carries TWO
honesty caveats that make it more than "wrap fft":

1. NON-COMMUTATIVITY (ℍ, 𝕆): the twiddle cannot be factored out the way the
   complex FFT does, so there are genuinely left- / right- / two-sided forms —
   the cascade calls the explicit qm.octonion left/right multiply.

2. NON-ASSOCIATIVITY (𝕆 ONLY, F378): the two-sided ODFT W_l·x·W_r is NOT
   UNIQUE — (W_l·x)·W_r and W_l·(x·W_r) DIFFER for octonions. So the ODFT must
   DECLARE a bracketing/association convention. This descriptor makes that the
   explicit `bracketing` field — the concrete crystallisation of F378's
   168/210 non-associative triples:

       bracketing = "left_associated"   →  (W_l · x) · W_r
       bracketing = "right_associated"  →  W_l · (x · W_r)

   These are measurably different (the test pins a non-zero difference). For
   the one-sided forms the field is recorded but trivial.

    X[k] = Σ_n  exp(σ·μ·2πkn/N) · x[n]              (left)
    X[k] = Σ_n  x[n] · exp(σ·μ·2πkn/N)              (right)
    X[k] = Σ_n  W_l[k,n] · x[n] · W_r[k,n]          (two_sided; bracketing-keyed)

The one-sided forms are invertible and round-trip (the one-sided twiddle lives
in the commutative ℝ[μ]≅ℂ subalgebra). The two-sided form is FORWARD-ONLY here
— its inverse is open under non-associativity, so an inverse two-sided call
RAISES rather than fabricating an answer.

HONEST CASCADE SHAPE: Class M (octonion multiply, via the qm.octonion
left/right-mult atoms) ∘ Class C (twiddle ±μ orientation) ∘ Class N (rational
angle kn/N). NO new privileged primitive class; NO abs() (the octonion
norm/conjugate route through Class K+C). The octonion structure-constant table
self-attests via qm.octonion.octonion_table_attestation().

SCIENTIFIC TIER (UPSTREAM §22): numpy is imported lazily on call, so
`import srmech.amsc.cascade` stays numpy-free (the numpy-absent-safe core,
v0.7.0rc30) while the transform uses numpy on call.
"""

[cascade.signature]
input = "x: sequence of N octonion samples, each 8-component [e0..e7]"
output = "list[list[float]] — N octonions (8-component lists), the ODFT spectrum X"
operation = "X[k] = Σ_n T(W) · x[n] (one-sided) / Σ_n bracket(W_l, x[n], W_r) (two-sided)"
forms = ["left", "right", "two_sided"]
bracketings = ["left_associated", "right_associated"]
mu_axes = ["i", "j", "k", "ijk"]
round_trip = "one-sided forms: inverse(forward(x)) == x to float round-off; two_sided: forward-only (inverse RAISES — open under non-associativity)"
n0_maps_to = "[]"

[cascade.bracketing]
# The F378 non-associativity made an explicit attested field (the #863 DoD).
why_declared = "octonion multiplication is non-associative (F378: 168 of 210 triples), so the two-sided ODFT W_l·x·W_r is not unique; the association order MUST be declared, not assumed."
left_associated = "(W_l · x) · W_r"
right_associated = "W_l · (x · W_r)"
measurably_differ = true
one_sided_note = "for form='left'/'right' the field is recorded but trivial (a 2-factor product has no association ambiguity)."

[cascade.composes]
multiply_atom = "srmech.qm.octonion.octonion_left_mult / octonion_right_mult"
norm_conjugate = "srmech.qm.octonion.octonion_norm / octonion_conjugate (Class K+C, never abs())"
twiddle = "exp(μθ) = cos θ·1 + sin θ·μ (float trig; or the Class-N exact-rational asymptotic_calculus.{cos,sin}_series_truncate)"
radix_split_atom = "srmech.amsc.primes.factor + srmech.amsc.cyclic (algebra-agnostic Cooley-Tukey reindex)"

[cascade.graduation]
tier = "prototype (composite over existing primitives)"
graduates_to = "a first-class native C/Python primitive (srmech_octonion_dft) IF it earns attested status — a SEPARATE later voxel, not a prerequisite blocker"

[cascade.attestation]
author = "Steven Kirkland"
license = "MIT"
parser_version = "srmech-cascade 0.7.0rc31"
# Citations VERIFIED via PDF extraction (MPM discipline;
# docs/srmech/notes/qdft_odft_citation_verification_863.md). OA / attestable;
# the paywalled Elsevier Signal Processing 2017 paper was EXCLUDED in favour of
# the same lead author's OA arXiv anchor, per the paywalled-DOI rule.
literature = [
  "Błaszczyk, Ł. (2019). A Generalization of the Octonion Fourier Transform to 3-D Octonion-Valued Signals — Properties and Possible Applications to 3-D LTI Partial Differential Systems. arXiv:1905.12631.",
  "Hahn, S. L. & Snopek, K. M. (2011). The unified theory of n-dimensional complex and hypercomplex analytic signals. Bull. Polish Acad. Sci. Tech. Sci. 59(2):167-181. [ODFT origin]",
]
canonical_landings = [
  "F378 — octonion FT carries non-associativity (168/210 non-associative triples); the bracketing-convention requirement",
  "F379 — FFT-ladder n:n−1; the (8:7) octonion rung",
  "F380 — Klein-4 = quaternion-units-mod-sign; the QDFT/ODFT motivation",
  "issue #863 — the native transform for a Klein-4 object, not its complex flat shadow",
]
