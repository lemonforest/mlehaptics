# and the paper's OFT definition confirmed to state its exponential-placement
# convention explicitly. The BRACKETING/ALTERNATIVITY statements lodged here
# are the IN-REPO SSOT (the attested qm.octonion table + the rc111 empirical
# verification), anchored to these OA papers for the OFT *definition* only.
literature = [
  "Błaszczyk, Ł. (2019). A Generalization of the Octonion Fourier Transform to 3-D Octonion-Valued Signals — Properties and Possible Applications to 3-D LTI Partial Differential Systems. arXiv:1905.12631.",
  "Hahn, S. L. & Snopek, K. M. (2011). The unified theory of n-dimensional complex and hypercomplex analytic signals. Bull. Polish Acad. Sci. Tech. Sci. 59(2):167-181. [ODFT origin]",
]
canonical_landings = [
  "F378 — octonion FT carries non-associativity (168/210 non-associative triples); the bracketing-convention requirement",
  "F379 — FFT-ladder n:n−1; the (8:7) octonion rung",
  "F380 — Klein-4 = quaternion-units-mod-sign; the QDFT/ODFT motivation",
  "issue #863 — the native transform for a Klein-4 object, not its complex flat shadow",
  "issue #1234 Item 1c — the ODFT graduation with the bracketing convention as an explicit ATTESTED field",
]
