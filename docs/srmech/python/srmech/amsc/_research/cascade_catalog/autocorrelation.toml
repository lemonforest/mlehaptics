# Cascade catalog entry: autocorrelation
# v0.7.0rc8 of the cascade-catalog — the Class-L circular autocorrelation
# (Wiener-Khinchin) primitive. Closes the LAST C/Python parity gap blocking
# the F290 §C "un-flatten" catalog composite (autocorr -> difference-graph ->
# conservation-validate): srmech had no native autocorrelation primitive, so
# that composite could not be authored as pure-TOML over named ops. This adds
# it, with a co-equal native C peer srmech_autocorrelation_f64 (the direct
# O(n²) multiply-add sum — JPL-clean, no FFT, embedded-ready). ABI stays 3.

[cascade]
name = "autocorrelation"
class_composition = "L"
# kind defaults to "stage" — a plain value→value op: the piped value is the
# real sequence x, returning the length-n circular autocorrelation r. Usable
# directly as a `.then("autocorrelation")` / `op="autocorrelation"` chain
# stage (it takes no extra kwargs).
purpose = "Circular autocorrelation of a real sequence (the Wiener-Khinchin spectral object): r[k] = Σ_i x[i]·x[(i+k) mod n], r[0] = Σ x² = energy. DSL stage-op — the piped value is x; returns the length-n autocorrelation r."
description = """
The circular autocorrelation of a real sequence x of length n:

    r[k] = Σ_i x[i] · x[(i + k) mod n],   k = 0 .. n-1

with r[0] = Σ x² = the signal energy. This is EXACTLY the Wiener-Khinchin
spectral object

    r = Re(IFFT(|FFT(x)|²))

(the circular-convolution theorem) — that identity is WHY autocorrelation
is Class L (the spectral side: autocorrelation ↔ power spectrum). The
F290 §C "un-flatten" composite (autocorr -> difference-graph ->
conservation-validate) consumes r — notably the r[0] energy for its
conservation check — so shipping this primitive lets the rest of that
catalog be authored as pure-TOML composites over named ops.

HONEST CASCADE SHAPE: Class L (the spectral / Wiener-Khinchin reading);
computationally a Σ-reduce of products — NO abs(), no sign branch. NOT a
new privileged primitive class.

The Python wrapper uses the co-equal native C peer
srmech_autocorrelation_f64 when present (HAS_NATIVE); that peer computes
the DIRECT O(n²) multiply-add sum — the IDENTICAL object, and JPL-clean:
no FFT, hence no recursion (Rule 1) and no transcendentals — just bounded
loops over caller buffers, so it runs on a microcontroller with no host
Python and no FFT library. The no-native fallback computes the SAME direct
sum in pure Python (math.fsum; numpy-free since v0.7.0rc30, UPSTREAM §22 —
the cascade layer is numpy-absent-safe), so a numpy-less install still
runs this op. Parity of the native sum to the math identity
r = Re(IFFT(|FFT(x)|²)) is to FFT round-off (~1e-12, NOT bit-exact: an
FFT route and the direct sum accumulate in different orders; a compiler
may also contract a*b into an FMA). n == 0 returns [].
"""

[cascade.signature]
input = "x: sequence[float] (the real signal, length n)"
output = "list[float] of length n — the circular autocorrelation r, with r[0] = Σ x² = energy"
operation = "out[k] = sum_i x[i] * x[(i + k) % n]  (equivalently Re(IFFT(|FFT(x)|^2)))"
parity = "FFT round-off tolerance (~1e-12; NOT bit-exact — FFT vs direct-sum accumulate in different orders, and a compiler may contract a*b into an FMA)"
n0_maps_to = "[]"

[cascade.native]
c_symbol_f64 = "srmech_autocorrelation_f64"
abi_version = 3
abi_note = "rc8 adds srmech_autocorrelation_f64 as a NEW exported symbol (additive) — ABI stays 3 (a new symbol does not bump ABI; only a wire-format change of an existing symbol does)."

[cascade.composes]
# Class L (the Wiener-Khinchin / power-spectrum reading); NOT a new
# privileged primitive (the cascade-honesty discipline).
class_l_spectral = "autocorrelation ↔ power spectrum (Wiener-Khinchin): r = Re(IFFT(|FFT(x)|²)) — the spectral side, hence Class L"
sum_reduce = "Σ_i x[i]·x[(i+k) mod n] — the lagged product-sum (a Σ-reduce of products; no abs(), no sign branch)"
energy_anchor = "r[0] = Σ x² = the signal energy — the conservation quantity the F290 §C un-flatten composite validates against"

[cascade.boundary_cases]
n_zero = "n == 0 (empty x) -> []"
n_one = "n == 1 -> [x[0]²] (the single lag k=0 is the energy)"
aliasing = "the C `out` buffer MUST NOT alias `x` (caller-supplied disjoint buffers; the Python peer always returns a fresh list)"
non_numeric = "non-coercible x -> native path skipped; pure-Python FFT fallback (float() coercion) runs"
periodicity = "the autocorrelation is CIRCULAR (lags wrap mod n) — this is the FFT-consistent definition, NOT the zero-padded linear autocorrelation"

[cascade.attestation]
author = "Steven Kirkland"
license = "GPL-3.0-or-later"
parser_version = "srmech-cascade 0.7.0rc8"
canonical_landings = [
  "Wiener, N. (1930), 'Generalized harmonic analysis', Acta Math. 55:117 — the autocorrelation ↔ power-spectrum theorem",
  "Khinchin, A. (1934), 'Korrelationstheorie der stationären stochastischen Prozesse', Math. Ann. 109:604 — the stochastic-process form of the theorem",
  "feedback_sign_handling_is_class_k_pin_slot_not_alu_abs — no abs() inside cascade scripts (autocorrelation is a pure product-sum, no sign branch)",
  "feedback_c_python_co_equal_parity_not_callback — the C peer srmech_autocorrelation_f64 is a standalone symbol (direct O(n²) sum); C never calls back into Python",
  "R-RBS-LM F290 §C — the 'un-flatten' catalog composite (autocorr -> difference-graph -> conservation-validate) this primitive unblocks",
]
