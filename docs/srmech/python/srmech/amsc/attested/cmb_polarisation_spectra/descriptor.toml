# CMB Polarisation Power Spectra — Planck 2018 PR3 binned TE/EE bandpowers
# plus low-ell BB unbinned likelihood.
#
# Companion to cmb_power_spectrum (Planck 2018 PR3 binned TT D_ell, hosted
# in ephemerides-spectral). Where the TT catalog covers temperature
# autocorrelation, this catalog covers the three polarisation cross
# spectra:
#   - TE: temperature x E-mode polarization cross-spectrum
#   - EE: E-mode polarization autocorrelation
#   - BB: B-mode polarization (largely noise-dominated upper limits at
#     Planck sensitivity; primary use is constraint on r and primordial
#     gravitational waves)
#
# The full set {TT, TE, EE, BB} forms the canonical CMB spectral
# decomposition at the two-point-function level. The notebook framing
# is that {TT, TE, EE, BB} represent four different projections of the
# same underlying CMB random field onto spherical-harmonic basis modes;
# polarization-spectrum tracking adds independent constraints on the
# cosmological parameters because E-mode polarization is generated
# by scalar (density) perturbations primarily at the last-scattering
# surface while T fluctuations sample additional integrated-LOS effects.
#
# Ground-truth source: Planck Collaboration 2018 V (Aghanim et al. 2020)
# "Planck 2018 results V: CMB power spectra and likelihoods", A&A 641:A5,
# doi:10.1051/0004-6361/201936386, arXiv:1907.12875.
#
# Data files (Planck Legacy Archive, PR3 / R3.02 for TE/EE — note the
# bump from R3.01 due to a file-swap bug fix; R3.01 for low-ell BB):
#   - COM_PowerSpect_CMB-TE-binned_R3.02.txt: 67 binned TE bands,
#     ell ~ 48 to ell ~ 1988. Plik likelihood. Columns: ell, D_ell (muK^2),
#     -dD_ell, +dD_ell, BestFit (LambdaCDM ref).
#   - COM_PowerSpect_CMB-EE-binned_R3.02.txt: 67 binned EE bands, same
#     coverage as TE.
#   - COM_PowerSpect_CMB-low-ell-BB-full_R3.01.txt: 28 unbinned low-ell
#     bands, ell = 2..29. Commander likelihood. Values are
#     noise-dominated, fluctuating around zero with ~0.01 muK^2 amplitude;
#     statistical upper limits, not detections.
#
# This catalogue samples ~30-40 representative rows across TE/EE/BB,
# covering the acoustic-peak structure (TE alternates sign with each
# acoustic peak; EE peaks shifted by ~pi/2 from TT peaks; BB upper
# limits).
#
# precision_flag = "high" for all rows --- values taken verbatim from
# the PLA tables without rounding.

[source]
key = "cmb_polarisation_spectra"
human_readable_name = "Cosmic Microwave Background Polarisation TE/EE/BB Power Spectra (Planck 2018) Catalogue"
purpose = "ground-proof rows for the CMB polarisation cross-spectra C_ell^TE, C_ell^EE, and C_ell^BB at canonical multipole bins, companion to cmb_power_spectrum (TT); reference for the polarisation arm of the spectral-dimension flow"
license = "literature-curated; per-row source DOI cites Planck 2018 V (Aghanim et al. 2020 A&A 641:A5)"
homepage = "https://pla.esac.esa.int/"
canonical_doi = "10.1051/0004-6361/201936386"

# canonical_doi above points at Planck Collaboration 2018 V (Aghanim
# et al. 2020 A&A 641:A5, arXiv:1907.12875). Per-row provenance cites
# this paper as the source for the spectrum values. The PR3 / R3.02
# binned TE and EE tables (R3.01 was withdrawn because TE and EE
# contents were swapped in the original release; R3.02 fixed this) are
# distributed via the Planck Legacy Archive. The low-ell BB unbinned
# table remains at R3.01.

[fetch]
adapter = "literature_curated"
ndjson_path = "row.ndjson"

[parse]
require_per_row_source_doi = true

[schema]
data_schema_id = "cmb_polarisation_spectra.row.v1"
data_schema_path = "row.schema.json"

[rendering]
cite_as_template = "CMB Polarisation Power Spectra Catalogue (curated against Planck 2018 V: Aghanim et al. 2020 *A&A* 641:A5, doi:10.1051/0004-6361/201936386, arXiv:1907.12875; binned TE/EE from PLA R3.02 tables, low-ell BB from PLA R3.01); revision retrieved {retrieved_at:%Y-%m-%d}."
purpose_template = "ground-proof CMB polarisation power at multipole bin {schema.ell_bin_label} ({schema.spectrum_kind}: {schema.feature})"

[attestation]
hash_response = true
hash_algorithm = "sha256"
required_fields = [
    "source_doi",
    "source_url",
    "license",
    "retrieved_at",
    "response_sha256",
    "parser_version",
    "parser_rule_hash",
    "collector_descriptor_path",
    "collector_descriptor_hash",
]

[gap_targeting]
# CMB polarisation spectra are companion observables to the TT spectrum
# (cmb_power_spectrum in ephemerides-spectral) and probe the same
# spherical-harmonic decomposition on S² but with a different physics
# coupling: E-mode polarization is generated by Thomson scattering of a
# quadrupole anisotropy at recombination, so it samples the velocity
# field of the photon-baryon plasma more directly than T. B-mode
# polarization at large scales is the primary observational target for
# primordial gravitational waves (r constraint).
# The v0.24.9 dynamical-regime classifier doesn't yet have a regime
# label for cosmological-polarisation catalogues; closest existing
# label is rigid_body_action_angle_stable. A future label like
# `cosmological_polarization_spectrum` would be more precise.
regime_labels = [
    "rigid_body_action_angle_stable",
]

# ─────────────────────────────────────────────────────────────────
# Operator-chain specs — REMOVED in v0.4.1rc7 (2026-05-16)
# ─────────────────────────────────────────────────────────────────
#
# One Phase 1 worked-example chain previously lived here:
#   - `acoustic_peak_locations` (CDE) — stream rows via Class C
#     read_ndjson, dispatch by feature field via Class D
#     match_filter, extract (ell_center, D_ell_muK2, peak_type) via
#     Class E sorted_lookup_extract.
#
# It referenced Class D `match_filter` and Class E
# `sorted_lookup_extract` — neither exists. Class D exposes only
# `match` (single-input bytes-pattern match, wrong shape for stream
# filter); Class E exposes only catalog-metadata + dataset-pagination
# ops (no row-stream sort-and-extract). Phase 2 (rc5) shipped the
# composition engine which surfaced the activate-time gap via
# fresh-venv smoke.
#
# Per `[[feedback_every_doc_edit_faces_falsification]]` (user
# direction 2026-05-16) we don't ship chain specs whose underlying
# primitives can't run. The chain re-lands when:
#   - Class D `match_filter` (stream-filter wrapper around `match`)
#     and Class E `sorted_lookup_extract` (row-stream extract +
#     sort) ship in rc7+ — both are Task #234 §11 inventory items
#     mapped to "calculus operations" / catalog-traversal primitives.
#
# The DSL design pattern lives in
# `docs/srmech/adr/0002-phase-1-operator-chain-schema.md`.

[catalog]
chain_schema_version = 1
