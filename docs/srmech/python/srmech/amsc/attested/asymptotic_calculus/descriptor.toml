# Asymptotic Calculus Catalogue — falsification infrastructure for the
# canonical reposture per [[user_stance_infinity_approximates_asymptote]]:
# **infinity approximates the asymptote.** Asymptote is upstream (the value
# a Taylor partial sum approaches as N grows through finite values); cardinal
# ∞ / `lim_{N → ∞}` / infinitesimals are the downstream algebraic-tool
# approximations 17th-century-onward calculus reached for to talk about the
# asymptote. Each row in this catalog computes the asymptote-side content
# (finite-N partial sum at exact integer/rational arithmetic, growing N
# producing tighter approximation) using only Class N + Class J chain
# composition — no actual-infinity invoked at any step.
#
# Spike #28 (PR #447) §10 defines the canonical chain-spec form for
# integer/rational chain compositions of transcendentals; §11 inventories
# the broader scope (trig + log + Bessel + Γ + ζ + calculus operations).
# Per `[[feedback_every_doc_edit_faces_falsification]]` (2026-05-16),
# every project doc claim should come with a class-operator chain spec
# that proves or disproves it. This catalog is the first concrete
# instance of that falsification infrastructure.
#
# Initial coverage (rc6, this commit): exp partial-sum truncation
#   S_N(p/q) = sum_{k=0..N} (p/q)^k / k!
# via Class N rational + Class J integer factorial chain composition.
# Each row carries (x_num, x_den, num_terms) input + (expected_num,
# expected_den) ground-truth output; CI runs the chain and verifies
# bit-exact agreement.
#
# Future rcs (Task #234) expand to:
#   - Class N sin_series_truncate, cos_series_truncate, tan via division
#   - Class N log1p_series_truncate, atan_series_truncate
#   - Class N forward_difference (Bishop-constructive derivative)
#   - Class N riemann_sum (definite integral via finite-N partition)
#   - Class N + Class J: Gamma/Bessel/digamma/zeta partial sums
#
# The catalog's ROWS are computed by the chain itself (self-validating)
# — the expected outputs were generated by running the chain at catalog
# author time and are bit-exact reproducible by re-running the chain
# at consumer time. Any drift in Class N + Class J primitives surfaces
# immediately as row-by-row exact-rational mismatch.
#
# Citation discipline (per [[feedback_pdf_extraction_citation_discipline]]):
#
# - Apostol, *Mathematical Analysis* (Addison-Wesley 2nd ed., 1974) —
#   Theorem 12.20 (Lagrange remainder), §12.7 (Taylor series). Used as
#   the canonical SSoT for exp series convergence + bound.
# - Bishop, *Foundations of Constructive Analysis* (McGraw-Hill, 1967) —
#   the foundational reference for Taylor series + asymptotic-rate
#   framing without invoking actual-infinity.
# - Cited in Spike #28 working note:
#   `docs/antikythera-maths/research-mfo/asymptotic_vs_infinity_history_2026-05-16.md`.
#
# Per `[[reference_autonomous_validation_tos_landscape]]`, textbook
# citations are acceptable in the spike artifact provenance; no
# autonomous-fetch from commercial-publisher endpoints is performed.

[source]
key = "asymptotic_calculus"
human_readable_name = "Asymptotic Calculus Catalogue — falsification infrastructure for integer/rational chain compositions of classical-calculus operations"
purpose = "self-validating chain-composed catalog of exp / sin / cos / log1p / atan (later: forward_difference / riemann_sum / Bessel / Gamma / zeta) partial-sum truncations; each row's expected output is computable bit-exactly from Class N + Class J class-operator chain composition (Spike #28 §10 PR #447); demonstrates the canonical [[user_stance_infinity_approximates_asymptote]] reposture operationally — the asymptote (upstream) is computed in exact integer/rational arithmetic at finite N, and cardinal infinity (downstream algebraic tool) is the framing classical calculus reached for to approximate that asymptote; first concrete instance of [[feedback_every_doc_edit_faces_falsification]] infrastructure"
license = "CC0-1.0 (self-generated rows; mathematical identities are public domain)"
homepage = "https://github.com/lemonforest/mlehaptics/blob/main/docs/srmech/srmech_research_notebook.md"
canonical_doi = "10.5281/zenodo.placeholder.spike28"

# canonical_doi above is a placeholder; Spike #28 working note +
# §10 / §11 of `docs/antikythera-maths/research-mfo/asymptotic_vs_infinity_history_2026-05-16.md`
# is the canonical reference for the catalog's mathematical content.
# Textbook anchors (per-row): Apostol §12.20, Bishop §2.

[fetch]
adapter = "literature_curated"
ndjson_path = "row.ndjson"

[parse]
require_per_row_source_doi = false

[schema]
data_schema_id = "asymptotic_calculus.row.v1"
data_schema_path = "row.schema.json"

[rendering]
cite_as_template = "Asymptotic Calculus Catalogue (chain-verified against Apostol *Mathematical Analysis* 2nd ed. Theorem 12.20 + Bishop *Foundations of Constructive Analysis* §2); revision retrieved {retrieved_at:%Y-%m-%d}."
purpose_template = "chain-verified {schema.kind} partial sum S_N(p/q) at row {schema.row_label}"

[attestation]
hash_response = true
hash_algorithm = "sha256"
required_fields = [
    "license",
    "retrieved_at",
    "response_sha256",
    "parser_version",
    "parser_rule_hash",
    "collector_descriptor_path",
    "collector_descriptor_hash",
]

[gap_targeting]
# This catalog is not gap-targeting in the v0.24.9 dynamical-regime
# classifier sense — its content is mathematical-identity falsification,
# not empirical dynamical-regime sampling. Future v0.26.x research may
# define a `chain_verified_identity` regime label; for now use the
# closest existing label.
regime_labels = [
    "rigid_body_action_angle_stable",
]

# ─────────────────────────────────────────────────────────────────
# Operator-chain spec (ADR-0002 Phase 2 schema v1)
# ─────────────────────────────────────────────────────────────────
#
# Single-step chain calling Class N rational exp_series_truncate. The
# step's expected output (out_num, out_den) is verified against the row's
# stored (expected_num, expected_den) by the catalog test. Any drift in
# the Class N primitive surfaces as immediate test failure.
#
# Per Spike #28 §10, this is a single-step linear pipeline (Phase 2 v1).
# The k-loop is hidden inside the Class N primitive; a future Phase 2-v2
# with fold/reduce syntax would unroll the loop into N+1 chain steps
# (Task #235).

[catalog]
chain_schema_version = 1

[[catalog.operator_chain]]
name = "exp_series_truncate"
summary = "Compute the exp Taylor-series partial sum S_N(p/q) = sum_{k=0..N} (p/q)^k / k! as an exact rational via Class N rational + Class J integer factorial chain composition. Returns (out_num, out_den) reduced to lowest terms. Anchors Spike #28 §10 chain-spec form + §11 asymptotic-calculus catalog scope."
returns = "tuple[int, int]  # (out_num, out_den) of S_N reduced to lowest terms"
on_error = "raise"

[[catalog.operator_chain.steps]]
class = "N"
op = "exp_series_truncate"
args = { numerator = "@row.x_num", denominator = "@row.x_den", num_terms = "@row.num_terms" }

# ── rc11: trig + log Taylor series chains ──
#
# Four single-step chains added per Task #234 §11 inventory and
# user direction 2026-05-16 (Milestone #2, Phase 3B). All four are
# Class N rational-arithmetic ops with closed-form Lagrange-remainder
# bounds; Python bignum-capable. C parity surface deferred to rc12
# per scope discipline (the four ops together would significantly
# expand srmech_rational.c; staged ship preferred over monolithic).

[[catalog.operator_chain]]
name = "sin_series_truncate"
summary = "Sin Taylor partial sum sin(p/q) = sum_{k=0..N} (-1)^k (p/q)^(2k+1)/(2k+1)! as exact rational via Class N rational + Class J integer factorial chain composition. Anchors sin row family in asymptotic_calculus."
returns = "tuple[int, int]  # (out_num, out_den) of sin(p/q) reduced"
on_error = "raise"

[[catalog.operator_chain.steps]]
class = "N"
op = "sin_series_truncate"
args = { numerator = "@row.x_num", denominator = "@row.x_den", num_terms = "@row.num_terms" }

[[catalog.operator_chain]]
name = "cos_series_truncate"
summary = "Cos Taylor partial sum cos(p/q) = sum_{k=0..N} (-1)^k (p/q)^(2k)/(2k)! as exact rational. Anchors cos row family in asymptotic_calculus."
returns = "tuple[int, int]  # (out_num, out_den) of cos(p/q) reduced"
on_error = "raise"

[[catalog.operator_chain.steps]]
class = "N"
op = "cos_series_truncate"
args = { numerator = "@row.x_num", denominator = "@row.x_den", num_terms = "@row.num_terms" }

[[catalog.operator_chain]]
name = "log1p_series_truncate"
summary = "log(1+x) Taylor partial sum sum_{k=1..N} (-1)^(k+1) x^k / k for |x|<1 as exact rational. Anchors log1p row family in asymptotic_calculus."
returns = "tuple[int, int]  # (out_num, out_den) of log(1+p/q) reduced"
on_error = "raise"

[[catalog.operator_chain.steps]]
class = "N"
op = "log1p_series_truncate"
args = { numerator = "@row.x_num", denominator = "@row.x_den", num_terms = "@row.num_terms" }

[[catalog.operator_chain]]
name = "atan_series_truncate"
summary = "atan(x) Taylor partial sum sum_{k=0..N} (-1)^k x^(2k+1)/(2k+1) for |x|<=1 as exact rational. Anchors atan row family in asymptotic_calculus."
returns = "tuple[int, int]  # (out_num, out_den) of atan(p/q) reduced"
on_error = "raise"

[[catalog.operator_chain.steps]]
class = "N"
op = "atan_series_truncate"
args = { numerator = "@row.x_num", denominator = "@row.x_den", num_terms = "@row.num_terms" }
