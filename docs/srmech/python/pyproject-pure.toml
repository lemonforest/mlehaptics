# srmech — pure-Python pyproject for Pyodide / WASM environments.
#
# Pure-Python wheel (py3-none-any). Built for Pyodide / WASM / no-C
# environments where the scikit-build-core CMake compile in
# pyproject.toml can't run. Same package name + version; the
# difference is wheel-tag (py3-none-any vs platform-specific).
#
# The wheel-publish workflow swaps this in temporarily during the
# build-pure-wheel job (and asserts the version matches the main
# pyproject.toml's version via a tag-version-check step).
#
# Mirrors docs/antikythera-maths/ephemerides-spectral/python/
# pyproject-pure.toml.

[build-system]
requires = ["hatchling>=1.18", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "srmech"
version = "0.9.0rc100"
# IMPORTANT: PyPI's "Summary" metadata field has a HARD 512-character
# limit. The upload endpoint silently rejects oversize metadata
# ("could not comply" with no useful detail bubbled into the publish
# action's logs). `twine check --strict` does NOT enforce this.
# Keep this string ASCII-only and under ~480 chars to leave headroom.
# A guard in `.github/workflows/srmech-publish.yml` pins this at
# build time. Must agree with `pyproject.toml`.
description = "Stored-Relationship Mechanism: the 14-class A-N primitive vocabulary in native C + Python, numpy-FREE. Every continuous-math op (trig, exp, sqrt, FFT, SVD, eig) is a cascade of the 14; the native build holds no libm. The One, S(sigma,theta), generates the 1+3+7+3 = 14 substrate -- the C/H/O Hurwitz ladder = so(8) + Spin(8) triality (Fix(tau)=g_2=14), bit-exact cascade-vs-matrix. Full C/Python cascade-catalog parity; AMSC (MPR v1)."
# The PyPI long-description (readme) is assembled dynamically by the
# fancy-pypi-readme hook (block below): full README.md + a Changelog
# section sliced to the CURRENT-MINOR (0.7.0) entries only + a
# "Full changelog" link. CHANGELOG.md stays the single source of
# truth (no hand-maintained duplication). hatchling consumes the
# shared [tool.hatch.metadata.hooks.fancy-pypi-readme] block
# natively; scikit-build-core (pyproject.toml) consumes the same
# block via its built-in provider.
dynamic = ["readme"]
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Steven Kirkland" }]
keywords = [
    "stored-relationship",
    "mechanism",
    "attested",
    "provenance",
    "ndjson",
    "ground-proof",
    "research",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "tomli>=2.0; python_version<'3.11'",
    # numpy is GONE (#564, v0.7.5). Must agree with pyproject.toml. The WHOLE
    # package — cascade core, qm.* / signal_processing.* / rbs_lm.* — is
    # numpy-free; `import srmech` + the whole API run with numpy not installed.
]

[project.optional-dependencies]
# (#564: the `scientific = ["numpy"]` extra is GONE — there is no numpy tier.)
validation = ["jsonschema>=4.0"]
collectors = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
]
# numpy-FREE (#564): the suite runs with numpy NOT installed.
tests = ["pytest>=7.0"]
# Crypto extra (v0.5.0rc7): UTLP-exact AES-128-CTR Bio-TOTP backend
# for the bus wire cipher (Claim 255). Pyodide/WASM may not support
# the cryptography wheel — the stdlib HMAC-SHA-256 fallback always
# works, so install this extra only when AES-CTR is required.
crypto = ["cryptography>=41.0"]
# Anthropic extra (v0.5.0rc9): enables the secondary
# ``srmech.llm.anthropic_agent.AnthropicAgent`` direct-SDK adapter
# for users who script Claude API outside Claude Code. Default
# install does NOT add it. Pure-Python; Pyodide can install the
# ``anthropic`` SDK via micropip if browser usage is desired.
anthropic = ["anthropic>=0.40.0"]
# numpy-FREE (#564): the full pytest suite runs numpy-absent.
dev = [
    "pytest>=7.0",
    "build",
    "twine",
    "hatchling>=1.18",
    "jsonschema>=4.0",
    "requests>=2.28",
    "beautifulsoup4>=4.11",
]

[project.scripts]
# v0.4.6rc2 — first CLI subcommand: ``srmech status`` (out-of-band
# introspection of a running srmech sweep).
srmech = "srmech.cli:main"
# v0.5.0rc6 — MCP (Model Context Protocol) server adapter for Claude Code.
# Mirrors the pyproject.toml entry; pure-Python wheel ships the same console-
# script so Pyodide / WASM environments get the same surface.
srmech-mcp = "srmech.mcp._cli:main"
# v0.5.0rc9 — Anthropic Claude SDK secondary adapter (mirror of
# pyproject.toml so the pure-Python wheel ships the same console
# script). Requires ``pip install srmech[anthropic]``.
srmech-agent = "srmech.llm.anthropic_agent_cli:main"

[project.urls]
Homepage = "https://github.com/lemonforest/mlehaptics/tree/main/docs/srmech/python"
Repository = "https://github.com/lemonforest/mlehaptics"
Issues = "https://github.com/lemonforest/mlehaptics/issues"
Changelog = "https://github.com/lemonforest/mlehaptics/blob/main/docs/srmech/python/CHANGELOG.md"
"Research notebook" = "https://github.com/lemonforest/mlehaptics/blob/main/docs/srmech/srmech_research_notebook.md"

[tool.hatch.build.targets.wheel]
packages = ["srmech"]
# Exclude any _native/ directory if it leaked in from a prior build.
# Hatchling's `exclude` must be an array of glob strings — *not* a
# table. (The earlier table form `"...\_native/*" = true` broke
# ephemerides-spectral's v0.3.1 publish workflow; cargo-culting it
# avoids the same trap.)
exclude = [
    "srmech/_native/*",
    "srmech/_native/**",
]

[tool.hatch.build.targets.sdist]
include = [
    "srmech/**",
    "tests/**",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "srmech/_native/**",
]

# ─────────────────────────────────────────────────────────────────
# Dynamic PyPI long-description (fancy-pypi-readme)
# ─────────────────────────────────────────────────────────────────
#
# SHARED METADATA — this block MUST be byte-identical to the one in
# pyproject.toml. The publish workflow + the two-pyproject discipline
# expect both files to agree on shared metadata. hatchling (this pure
# wheel) consumes this natively; scikit-build-core (platform wheel)
# consumes it via its built-in provider. CHANGELOG.md stays the
# single source of truth for the changelog text — the third fragment
# slices the current-minor entries out of it by HTML markers, so
# there is NO hand-maintained changelog duplication.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
text = "\n\n---\n\n## Changelog — current 0.7.0 line\n\n"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "CHANGELOG.md"
start-after = "<!-- pypi-readme-changelog-start -->"
end-before = "<!-- pypi-readme-changelog-end -->"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
text = "\n\n**[Full changelog →](https://github.com/lemonforest/mlehaptics/blob/main/docs/srmech/python/CHANGELOG.md)**\n"
