[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "siona"
# 0.1.0rc1 — the UN-MIRROR cut: siona stops being a co-name alias for srmech (srmech rc173 removed the in-wheel
# `import siona` alias) and becomes its OWN real package — the grounded RBS-HDC inference layer, a srmech PROFILE
# built ON lean srmech. TestPyPI rc first (its OWN PR; NOT via PR #687); a clean tag -> PyPI is the human gate.
version = "0.1.0rc1"
description = "Siona — a grounded, can't-hallucinate RBS-HDC instrument: storage + retrieval (k=3 chiral addressing) of spectrally-encoded knowledge, built on srmech (Stored-Relationship Mechanism)."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{ name = "Steven Kirkland" }]
keywords = ["siona", "srmech", "rbs-hdc", "stored-relationship", "de-bruijn", "recall", "grounded-lm", "spectral", "hyperdimensional"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
# srmech is the lean MATH CORE siona rides on (the 14-class A-N vocabulary + the klein4 HDC + the profile loader).
dependencies = ["srmech>=0.7.4"]

# THE plugin hook: siona declares itself as a srmech profile (package-only entry-point form; the loader reads
# siona/srmech_profile.toml via importlib.resources). `srmech.profile("siona")` discovers + smoke-tests + activates it.
[project.entry-points."srmech.profiles"]
siona = "siona"

[project.urls]
Homepage = "https://github.com/lemonforest/mlehaptics/tree/main/docs/srmech/siona"
Repository = "https://github.com/lemonforest/mlehaptics"
Issues = "https://github.com/lemonforest/mlehaptics/issues"
"srmech (math core)" = "https://pypi.org/project/srmech/"

[tool.hatch.build.targets.wheel]
packages = ["siona"]

# Ship the profile descriptor as package data so the loader can read it via importlib.resources.
# rc1 is pure-Python (py3-none-any); the C-native de Bruijn accelerator (F824/F825) is a follow-on cibuildwheel rc.
[tool.hatch.build.targets.wheel.force-include]
"siona/srmech_profile.toml" = "siona/srmech_profile.toml"

[tool.hatch.build.targets.sdist]
include = ["siona/", "README.md", "pyproject.toml"]
