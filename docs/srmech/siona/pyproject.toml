[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "siona"
version = "0.0.2rc1"
# siona is a METADATA-ONLY metapackage (no Python files of its own). The
# `import siona` co-name alias ships INSIDE the srmech wheel (top-level
# `siona/` package alongside `srmech`, from srmech v0.4.4). All this dist
# does is guarantee srmech>=0.4.4 is present, which is what provides
# `import siona`. Shipping no `siona/` here is deliberate: it prevents a
# file-ownership collision when both `siona` and `srmech` are installed.
description = "siona - co-name metapackage for srmech (Stored-Relationship Mechanism). Installs srmech>=0.4.4, whose wheel provides the 'import siona' alias (same objects as 'import srmech', single source of truth)."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{ name = "Steven Kirkland" }]
keywords = ["srmech", "siona", "alias", "metapackage", "stored-relationship-mechanism", "spectral", "cascade"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
# srmech>=0.4.4 is the floor that bundles the in-wheel `siona/` alias.
dependencies = ["srmech>=0.4.4"]

[project.urls]
Homepage = "https://github.com/lemonforest/mlehaptics/tree/main/docs/srmech/siona"
Repository = "https://github.com/lemonforest/mlehaptics"
Issues = "https://github.com/lemonforest/mlehaptics/issues"
"srmech (canonical package)" = "https://pypi.org/project/srmech/"

# Metadata-only wheel: no Python packages are selected. `bypass-selection`
# tells hatchling this empty-payload wheel is intentional (a metapackage),
# not a misconfiguration. The alias code lives in srmech's wheel.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.sdist]
include = ["README.md", "pyproject.toml"]
